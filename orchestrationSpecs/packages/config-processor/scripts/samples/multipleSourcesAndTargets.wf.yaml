sourceClusters:
  source-a:
    endpoint: https://elasticsearch-master-headless:9200
    allowInsecure: true
    version: ES 7.10
    authConfig:
      basic:
        secretName: source-creds
    snapshotInfo:
      repos:
        repoA:
          awsRegion: us-east-2
          endpoint: http://10.99.62.203:4566
          repoPathUri: s3://migrations-default-123456789012-dev-us-east-2
      snapshots:
        snapA:
          config:
            createSnapshotConfig: {}
          repoName: repoA
  source-b:
    endpoint: https://elasticsearch-master-headless:9200
    allowInsecure: true
    version: ES 7.10
    authConfig:
      basic:
        secretName: source-creds
    snapshotInfo:
      repos:
        repoB:
          awsRegion: us-east-2
          endpoint: http://10.99.62.203:4566
          repoPathUri: s3://bucket-b
      snapshots:
        snapB:
          config:
            createSnapshotConfig:
              indexAllowlist:
                - index-*
          repoName: repoB
targetClusters:
  target-x:
    endpoint: https://opensearch-cluster-master-headless:9200
    allowInsecure: true
    authConfig:
      basic:
        secretName: target-creds
  target-y:
    endpoint: https://opensearch-y:9200
    allowInsecure: true
    authConfig:
      basic:
        secretName: target-creds
snapshotMigrationConfigs:
  - fromSource: source-a
    toTarget: target-x
    fromSnapshot: snapA
    slice: metadata
    metadataMigrationConfig: {}
  - fromSource: source-b
    toTarget: target-y
    fromSnapshot: snapB
    slice: backfill
    documentBackfillConfig: {}
traffic:
  kafkaClusters:
    default:
      autoCreate: {}
      topics:
        proxy-a: {}
        proxy-b: {}
  proxies:
    proxy-a:
      kafka: default
      kafkaTopic: proxy-a
      source: source-a
      proxyConfig:
        listenPort: 9201
    proxy-b:
      kafka: default
      kafkaTopic: proxy-b
      source: source-b
      proxyConfig:
        listenPort: 9202
  replayers:
    replay-a:
      fromCapturedTraffic: proxy-a
      toTarget: target-x
    replay-b:
      fromCapturedTraffic: proxy-b
      toTarget: target-y
