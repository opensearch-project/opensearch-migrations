sourceClusters:
  legacy-source:
    endpoint: https://elasticsearch-master-headless:9200
    allowInsecure: true
    version: ES 5.6.0
    authConfig:
      basic:
        secretName: source-creds
    snapshotInfo:
      repos:
        default:
          awsRegion: us-east-2
          endpoint: http://10.99.62.203:4566
          repoPathUri: s3://migrations-default-123456789012-dev-us-east-2
      snapshots:
        s1:
          config:
            createSnapshotConfig: {}
          repoName: default
        s2:
          config:
            createSnapshotConfig: {}
          repoName: default
targetClusters:
  target:
    endpoint: https://opensearch-cluster-master-headless:9200
    allowInsecure: true
    authConfig:
      basic:
        secretName: target-creds
snapshotMigrationConfigs:
  - fromSource: legacy-source
    toTarget: target
    fromSnapshot: s1
    slice: metadata
    metadataMigrationConfig: {}
  - fromSource: legacy-source
    toTarget: target
    fromSnapshot: s2
    slice: backfill
    documentBackfillConfig: {}
traffic:
  proxies: {}
  replayers: {}
