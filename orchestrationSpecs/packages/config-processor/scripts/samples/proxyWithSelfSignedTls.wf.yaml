# Capture proxy with self-signed TLS certificate (for kind / non-AWS)

sourceClusters:
  source:
    endpoint: "https://elasticsearch-master-headless:9200"
    allowInsecure: true
    version: "ES 7.10.2"

targetClusters:
  target:
    endpoint: "https://opensearch-cluster-master-headless:9200"
    allowInsecure: true

snapshotMigrationConfigs: []

traffic:
  kafkaClusters:
    default:
      autoCreate: {}
      topics:
        capture-proxy: {}
  proxies:
    capture-proxy:
      kafka: default
      kafkaTopic: capture-proxy
      source: "source"
      proxyConfig:
        listenPort: 9201

        tls:
          mode: "certManager"
          issuerRef:
            name: "migrations-ca"
            kind: "ClusterIssuer"
          dnsNames:
            - "capture-proxy.ma.svc.cluster.local"
            - "capture-proxy"
          duration: "2160h"
          renewBefore: "360h"
  replayers:
    replay1:
      fromCapturedTraffic: "capture-proxy"
      toTarget: "target"
