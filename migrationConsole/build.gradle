import com.github.gradle.node.npm.task.NpmTask
import com.github.gradle.node.NodeExtension

plugins {
    id 'org.opensearch.migrations.java-library-conventions'
    id 'com.github.node-gradle.node'
}

evaluationDependsOn(":libraries:kafkaUtils")

node {
    version = '22.14.0'
    download = true
}

// Define paths at the top level
def orchestrationSpecsDirP = rootProject.layout.projectDirectory.dir("orchestrationSpecs")
def orchestrationP     = orchestrationSpecsDirP
def configProcessorP   = orchestrationP.dir("packages/config-processor")
def workflowTemplatesP = orchestrationP.dir("packages/migration-workflow-templates")
def argoWorkflowBuildersP = orchestrationP.dir("packages/argo-workflow-builders")
def schemasP           = orchestrationP.dir("packages/schemas")
def cloudWatchDashboardsP = rootProject.layout.projectDirectory.dir(
        "deployment/k8s/charts/aggregates/migrationAssistantWithArgo/files/cloudwatch-dashboards")
def configProcessorStagingP =
        layout.buildDirectory.dir("dockerContext/nodeStaging/configProcessor")
def workflowTemplatesStagingP =
        layout.buildDirectory.dir("dockerContext/nodeStaging/workflowTemplates")
def migrationResourcesStagingP =
        layout.buildDirectory.dir("dockerContext/nodeStaging/migrationResources")
def manageWebP = layout.projectDirectory.dir("web")
def manageWebBundleStagingP =
        layout.buildDirectory.dir("manageWebStatic")
def manageWebOpenApiP = manageWebP.file("openapi.json")

// Root-level tsconfig files that affect compilation
def rootTsConfigFiles = [
        orchestrationSpecsDirP.file("tsconfig.base.json"),
        orchestrationSpecsDirP.file("tsconfig.json"),
        orchestrationSpecsDirP.file("tsconfig.workspaces.json")
]
def npmDependencyFiles = [
        orchestrationSpecsDirP.file("package.json"),
        orchestrationSpecsDirP.file("package-lock.json")
]

def configureNpmTask = { task ->
    task.dependsOn installDependencies
    task.inputs.files(npmDependencyFiles)
}

def configureWorkflowTemplateTask = { task ->
    configureNpmTask(task)

    task.inputs.dir(workflowTemplatesP.dir("src"))
    task.inputs.dir(argoWorkflowBuildersP.dir("src"))
    task.inputs.dir(schemasP.dir("src"))
    task.inputs.dir(schemasP.dir("generated"))

    task.inputs.files(
        workflowTemplatesP.file("package.json"),
        workflowTemplatesP.file("tsconfig.json")
    )

    task.inputs.files(rootTsConfigFiles)
}

def configureConfigProcessorTask = { task ->
    configureNpmTask(task)

    task.inputs.dir(configProcessorP.dir("src"))
    task.inputs.dir(schemasP.dir("src"))
    task.inputs.dir(schemasP.dir("generated"))

    task.inputs.files(
        configProcessorP.file("package.json"),
        configProcessorP.file("tsconfig.json"),
    )

    task.inputs.files(rootTsConfigFiles)
}

// Input-only checks need a success marker for Gradle to skip unchanged runs.
def configureSuccessfulCheckOutput = { task ->
    def resultP = layout.buildDirectory.file("npmChecks/${task.name}.passed")
    task.outputs.file(resultP)

    task.doLast {
        def resultFile = resultP.get().asFile
        resultFile.parentFile.mkdirs()
        resultFile.text = "passed\n"
    }
}

tasks.register('installDependencies', NpmTask) {
    description = 'Install npm dependencies for orchestrationSpecs'
    workingDir = orchestrationSpecsDirP.asFile
    args = ['ci', '--force']

    inputs.files(
        orchestrationSpecsDirP.file("package.json"),
        orchestrationSpecsDirP.file("package-lock.json"),
        orchestrationSpecsDirP.file("tsconfig.base.json"),
        orchestrationSpecsDirP.file("tsconfig.json"),
        orchestrationSpecsDirP.file("tsconfig.workspaces.json"),
    )
    outputs.dir(orchestrationSpecsDirP.dir("node_modules"))
}

tasks.register('typeCheckWorkflowTemplates', NpmTask) {
    description = 'Check the workflow templates from their TypeScript definitions'
    workingDir = workflowTemplatesP.asFile
    args = ['run', 'type-check-all']
    configureWorkflowTemplateTask(delegate)
    inputs.files(
        orchestrationSpecsDirP.file("tsconfig.typecheck.templates.json"),
        argoWorkflowBuildersP.file("package.json"),
        argoWorkflowBuildersP.file("tsconfig.json"),
        schemasP.file("package.json"),
        schemasP.file("tsconfig.json")
    )
    configureSuccessfulCheckOutput(delegate)
}

tasks.register('testWorkflowTemplates', NpmTask) {
    description = 'Check the workflow templates from their TypeScript definitions'
    workingDir = workflowTemplatesP.asFile
    args = ['run', 'test-all']

    configureWorkflowTemplateTask(delegate)
    inputs.dir(workflowTemplatesP.dir("resources"))
    inputs.dir(workflowTemplatesP.dir("tests"))
    inputs.dir(argoWorkflowBuildersP.dir("tests/unit"))
    inputs.dir(schemasP.dir("tests"))
    inputs.files(
        workflowTemplatesP.file("jest.config.js"),
        argoWorkflowBuildersP.file("package.json"),
        argoWorkflowBuildersP.file("tsconfig.json"),
        argoWorkflowBuildersP.file("jest.config.js"),
        schemasP.file("package.json"),
        schemasP.file("tsconfig.json"),
        schemasP.file("jest.config.js"),
        cloudWatchDashboardsP.file("capture-replay-dashboard.json"),
        cloudWatchDashboardsP.file("reindex-from-snapshot-dashboard.json")
    )
    configureSuccessfulCheckOutput(delegate)
}

tasks.register('makeAndStageWorkflowTemplates', NpmTask) {
    description = 'Build the workflow templates from their TypeScript definitions'
    workingDir = workflowTemplatesP.asFile
    args = ['run', 'make-templates', '--', '--outputDirectory', workflowTemplatesStagingP.get().asFile.absolutePath]

    configureWorkflowTemplateTask(delegate)
    inputs.dir(workflowTemplatesP.dir("resources"))
    inputs.file(workflowTemplatesP.file("makeTemplates.cjs"))
    outputs.dir(workflowTemplatesStagingP)

    doFirst {
        workflowTemplatesStagingP.get().asFile.mkdirs()
    }
}

tasks.register('typeCheckConfigProcessor', NpmTask) {
    description = 'type-check the config-processor TypeScript package'
    workingDir = configProcessorP.asFile
    args = ['run', 'type-check']

    configureConfigProcessorTask(delegate)
    inputs.files(
        orchestrationSpecsDirP.file("tsconfig.typecheck.processor.json"),
        schemasP.file("package.json"),
        schemasP.file("tsconfig.json")
    )
    configureSuccessfulCheckOutput(delegate)
}

tasks.register('testConfigProcessor', NpmTask) {
    description = 'Test the config-processor TypeScript package'
    workingDir = configProcessorP.asFile
    args = ['run', 'test']

    configureConfigProcessorTask(delegate)
    inputs.files(fileTree(configProcessorP.dir("tests").asFile) {
        exclude "integ/**"
    })
    inputs.files(
        configProcessorP.file("jest.config.js"),
        schemasP.file("package.json"),
        schemasP.file("tsconfig.json")
    )
    configureSuccessfulCheckOutput(delegate)
}

tasks.register('buildAndStageConfigProcessor', NpmTask) {
    description = 'Build and stage the config-processor TypeScript package directly to staging'
    workingDir = configProcessorP.asFile
    args = ['run', 'bundle', '--', configProcessorStagingP.get().asFile.absolutePath]

    configureConfigProcessorTask(delegate)
    inputs.dir(configProcessorP.dir("scripts"))
    inputs.file(configProcessorP.file("makeBundle.js"))
    outputs.dir(configProcessorStagingP)

    doFirst {
        configProcessorStagingP.get().asFile.mkdirs()
    }
}

tasks.named("test") {
    dependsOn("typeCheckWorkflowTemplates")
    dependsOn("testWorkflowTemplates")
    dependsOn("typeCheckConfigProcessor")
    dependsOn("testConfigProcessor")
}

tasks.register('buildAndStageMigrationResources', NpmTask) {
    description = 'Generate migration CRDs and ValidatingAdmissionPolicies into Docker staging'
    workingDir = orchestrationSpecsDirP.asFile
    args = ['run', 'stage-migration-resources', '--', '--outputDirectory', migrationResourcesStagingP.get().asFile.absolutePath]
    dependsOn installDependencies

    inputs.dir(schemasP.dir("src"))
    inputs.dir(schemasP.dir("generated"))
    inputs.files(
        schemasP.file("package.json"),
        orchestrationSpecsDirP.file("package.json"),
        orchestrationSpecsDirP.file("package-lock.json"),
        orchestrationSpecsDirP.file("tsconfig.base.json"),
        orchestrationSpecsDirP.file("tsconfig.json"),
        orchestrationSpecsDirP.file("tsconfig.workspaces.json"),
    )
    outputs.dir(migrationResourcesStagingP)

    doFirst {
        migrationResourcesStagingP.get().asFile.mkdirs()
    }
}

tasks.register('installManageWebDependencies', NpmTask) {
    description = 'Install locked dependencies for the native workflow manage web app'
    workingDir = manageWebP.asFile
    args = ['ci']

    inputs.file(manageWebP.file("package.json"))
    inputs.file(manageWebP.file("package-lock.json"))
    outputs.dir(manageWebP.dir("node_modules"))
}

tasks.register('generateManageWebOpenApi', NpmTask) {
    description = 'Generate the workflow manage OpenAPI contract from FastAPI'
    workingDir = manageWebP.asFile
    args = ['run', 'generate:openapi']

    inputs.files(
            manageWebP.file("scripts/generated-api.sh"),
            manageWebP.file("package.json"),
            project.file("lib/console_link/Pipfile.lock"),
            project.file("lib/console_link/console_link/workflow/web/app.py"),
            project.file("lib/console_link/console_link/workflow/web/contracts.py"),
            project.file("lib/console_link/console_link/workflow/web/openapi.py"))
    outputs.file(manageWebOpenApiP)
}

tasks.register('generateManageWebClient', NpmTask) {
    description = 'Generate the workflow manage TypeScript API contract from OpenAPI'
    workingDir = manageWebP.asFile
    args = ['run', 'generate:client']
    dependsOn installManageWebDependencies
    dependsOn generateManageWebOpenApi

    inputs.file(manageWebOpenApiP)
    inputs.file(manageWebP.file("package.json"))
    outputs.file(manageWebP.file("src/api/schema.generated.ts"))
}

tasks.register('testManageWeb', NpmTask) {
    description = 'Run native workflow manage React unit tests'
    workingDir = manageWebP.asFile
    args = ['test']
    dependsOn generateManageWebClient

    inputs.dir(manageWebP.dir("src"))
    inputs.file(manageWebP.file("vite.config.ts"))
    outputs.upToDateWhen { false }
}

tasks.register('buildManageWeb', NpmTask) {
    description = 'Type-check and compile the native workflow manage React app'
    workingDir = manageWebP.asFile
    args = ['run', 'build']
    dependsOn generateManageWebClient

    inputs.dir(manageWebP.dir("src"))
    inputs.file(manageWebP.file("index.html"))
    inputs.file(manageWebP.file("tsconfig.json"))
    inputs.file(manageWebP.file("tsconfig.app.json"))
    inputs.file(manageWebP.file("vite.config.ts"))
    outputs.dir(manageWebP.dir("dist"))
}

tasks.register('buildAndStageManageWeb', Sync) {
    description = 'Build, test, and stage the native workflow manage web bundle'
    dependsOn buildAndStageConfigProcessor
    dependsOn testManageWeb
    dependsOn buildManageWeb
    from(manageWebP.dir("dist"))
    into(manageWebBundleStagingP)
}

def buildAndStageConfigProcessorProvider = tasks.named("buildAndStageConfigProcessor")
def nodeSetupProvider = tasks.named("nodeSetup")
def nodeExt = extensions.getByType(NodeExtension)
def byocPutTrafficFixtureTask = project(":libraries:kafkaUtils").tasks.named("generateByocPutTrafficFixture")

tasks.register("confirmConfigProcessorStagingPath") {
    // make sure both bits of work are done
    dependsOn(buildAndStageConfigProcessorProvider)
    dependsOn(nodeSetupProvider)

    doLast {
        def nodeDir = nodeExt.resolvedNodeDir.get().asFile
        def nodeBin = new File(nodeDir, "bin/node")
        println "NODEJS_BIN=${nodeBin.absolutePath}"
        println "CONFIG_PROCESSOR_DIR=${configProcessorStagingP.get().asFile.absolutePath}"
    }
}

tasks.register('syncDockerBuildContext', Sync) {
    into layout.buildDirectory.dir("dockerContext")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn makeAndStageWorkflowTemplates
    dependsOn buildAndStageConfigProcessor
    dependsOn buildAndStageMigrationResources
    dependsOn buildAndStageManageWeb
    dependsOn byocPutTrafficFixtureTask

    // Explicitly declare inputs for all files being synced
    inputs.file(project.file("Dockerfile"))
    inputs.file(project.file("kafkaCmdRef.md"))
    inputs.file(project.file("kafkaExport.sh"))
    inputs.file(project.file("kafkaImport.sh"))
    inputs.file(project.file("loadServicesFromParameterStore.sh"))
    inputs.file(project.file("msk-iam-auth.properties"))
    inputs.file(project.file("setupVimSchemaChecker.sh"))
    inputs.file(project.file("start-console.sh"))
    inputs.file(project.file("workflowConfigToServicesConfig.jq"))
    inputs.dir(project.file("cluster_tools"))
    inputs.dir(project.file("lib/console_link/console_link"))
    inputs.file(project.file("lib/console_link/Pipfile"))
    inputs.file(project.file("lib/console_link/Pipfile.lock"))
    inputs.file(project.file("lib/console_link/setup.py"))
    inputs.dir(manageWebBundleStagingP)
    inputs.dir(project.file("lib/integ_test"))
    inputs.files(byocPutTrafficFixtureTask)

    // Copy your Dockerfile and any other docker-related files
    from(project.file("Dockerfile"))
    from(project.file("kafkaCmdRef.md"))
    from(project.file("kafkaExport.sh"))
    from(project.file("kafkaImport.sh"))
    from(project.file("loadServicesFromParameterStore.sh"))
    from(project.file("msk-iam-auth.properties"))
    from(project.file("setupVimSchemaChecker.sh"))
    from(project.file("start-console.sh"))
    from(project.file("workflowConfigToServicesConfig.jq"))

    def commonExcludes = [
            "**/.venv/**",
            "**/.vscode/**",
            "**/node_modules/**",
            "**/__pycache__/**",
            "**/.pytest_cache/**"
    ]
    from(project.file("cluster_tools")) {
        into "cluster_tools"
        exclude commonExcludes
    }
    from(project.file("lib/console_link/console_link")) {
        into "lib/console_link/console_link"
        exclude commonExcludes
    }
    from(project.file("lib/console_link/Pipfile")) {
        into "lib/console_link"
        exclude commonExcludes
    }
    from(project.file("lib/console_link/Pipfile.lock")) {
        into "lib/console_link"
        exclude commonExcludes
    }
    from(project.file("lib/console_link/setup.py")) {
        into "lib/console_link"
        exclude commonExcludes
    }
    from(manageWebBundleStagingP) {
        into "lib/console_link/console_link/workflow/web/static"
    }
    from(project.file("lib/integ_test")) {
        into "lib/integ_test"
        exclude commonExcludes
    }
    from(byocPutTrafficFixtureTask) {
        into "lib/integ_test/resources/byoc"
    }

    // Preserve the nodeStaging directory if it exists
    preserve {
        include 'nodeStaging/**'
    }
}
