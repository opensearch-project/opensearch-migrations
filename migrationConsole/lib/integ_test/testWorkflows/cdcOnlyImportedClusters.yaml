# CDC-only test workflow: capture proxy + Kafka + replayer, no snapshot migration.
# Builds a minimal config with traffic section only and submits via workflow CLI.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cdc-only-imported-clusters
spec:
  serviceAccountName: argo-test-workflow-executor
  entrypoint: main
  parallelism: 100

  arguments:
    parameters:
      - name: snapshot-configmap
        value: "migrations-default-s3-config"
      - name: migration-image-configmap
        value: "migration-image-config"
      - name: monitor-retry-limit
        value: "120"
      - name: speedup-factor
        value: "20"
      - name: replayer-config-overrides
        value: "{}"
      - name: capture-proxy-config-overrides
        value: "{}"
      - name: capture-proxy-service-type
        value: "LoadBalancer"
      - name: capture-proxy-pod-replicas
        value: "1"
      - name: kafka-broker-replicas
        value: "3"
      - name: kafka-node-pool-spec-overrides
        value: "{}"
      - name: traffic-topic-partitions
        value: "2"
      - name: replayer-pod-replicas
        value: "1"
      - name: otel-trace-collector-endpoint
        value: ""

  templates:
    - name: main
      inputs:
        parameters:
          - name: source-configs
          - name: target-config
          - name: tupleS3Region
            valueFrom:
              configMapKeyRef:
                name: "{{workflow.parameters.snapshot-configmap}}"
                key: AWS_REGION
          - name: useLocalStack
            default: "false"
            valueFrom:
              configMapKeyRef:
                name: "{{workflow.parameters.snapshot-configmap}}"
                key: USE_LOCAL_STACK
                optional: true
          - name: tupleS3Endpoint
            default: ""
            valueFrom:
              configMapKeyRef:
                name: "{{workflow.parameters.snapshot-configmap}}"
                key: ENDPOINT_HTTP
                optional: true
          - name: tupleS3BucketName
            valueFrom:
              configMapKeyRef:
                name: "{{workflow.parameters.snapshot-configmap}}"
                key: BUCKET_NAME
          - name: imageMigrationConsoleLocation
            valueFrom:
              configMapKeyRef:
                name: "{{workflow.parameters.migration-image-configmap}}"
                key: migrationConsoleImage
          - name: imageMigrationConsolePullPolicy
            valueFrom:
              configMapKeyRef:
                name: "{{workflow.parameters.migration-image-configmap}}"
                key: migrationConsolePullPolicy
      steps:
        - - name: build-cdc-only-config
            template: build-cdc-only-config
            arguments:
              parameters:
                - name: source-configs
                  value: "{{inputs.parameters.source-configs}}"
                - name: target-config
                  value: "{{inputs.parameters.target-config}}"
                - name: tupleS3Region
                  value: "{{inputs.parameters.tupleS3Region}}"
                - name: useLocalStack
                  value: "{{inputs.parameters.useLocalStack}}"
                - name: tupleS3Endpoint
                  value: "{{inputs.parameters.tupleS3Endpoint}}"
                - name: tupleS3BucketName
                  value: "{{inputs.parameters.tupleS3BucketName}}"
                - name: imageMigrationConsoleLocation
                  value: "{{inputs.parameters.imageMigrationConsoleLocation}}"
                - name: imageMigrationConsolePullPolicy
                  value: "{{inputs.parameters.imageMigrationConsolePullPolicy}}"
                - name: otel-trace-collector-endpoint
                  value: "{{workflow.parameters.otel-trace-collector-endpoint}}"

        - - name: run-full-migration-with-workflow-cli
            templateRef:
              name: full-migration-with-workflow-cli
              template: main
            arguments:
              parameters:
                - name: migrationConfigBase64
                  value: "{{steps.build-cdc-only-config.outputs.parameters.migrationConfigBase64}}"
                - name: imageMigrationConsoleLocation
                  value: "{{inputs.parameters.imageMigrationConsoleLocation}}"
                - name: imageMigrationConsolePullPolicy
                  value: "{{inputs.parameters.imageMigrationConsolePullPolicy}}"
                - name: keepMigrationWorkflow
                  value: "true"

    - name: build-cdc-only-config
      inputs:
        parameters:
          - name: source-configs
          - name: target-config
          - name: tupleS3Region
          - name: useLocalStack
          - name: tupleS3Endpoint
          - name: tupleS3BucketName
          - name: imageMigrationConsoleLocation
          - name: imageMigrationConsolePullPolicy
          - name: otel-trace-collector-endpoint
      container:
        image: "{{inputs.parameters.imageMigrationConsoleLocation}}"
        imagePullPolicy: "{{inputs.parameters.imageMigrationConsolePullPolicy}}"
        command: [sh, -c]
        args:
          - |
            set -e

            SOURCE_CONFIGS='{{inputs.parameters.source-configs}}'
            TARGET_CONFIG='{{inputs.parameters.target-config}}'
            TUPLE_S3_REGION='{{inputs.parameters.tupleS3Region}}'
            USE_LOCAL_STACK='{{inputs.parameters.useLocalStack}}'
            TUPLE_S3_ENDPOINT='{{inputs.parameters.tupleS3Endpoint}}'
            TUPLE_S3_BUCKET='{{inputs.parameters.tupleS3BucketName}}'
            OTEL_TRACE_COLLECTOR_ENDPOINT='{{inputs.parameters.otel-trace-collector-endpoint}}'
            REPLAYER_CONFIG_OVERRIDES='{{workflow.parameters.replayer-config-overrides}}'
            CAPTURE_PROXY_CONFIG_OVERRIDES='{{workflow.parameters.capture-proxy-config-overrides}}'
            KAFKA_NODE_POOL_SPEC_OVERRIDES='{{workflow.parameters.kafka-node-pool-spec-overrides}}'

            # Transform source cluster config (same field renames as fullMigrationImportedClusters)
            SOURCE_CLUSTER=$(echo "$SOURCE_CONFIGS" | jq '
              .[0].source
              | .version = (.version | gsub("_"; " "))
              | if has("allow_insecure") then .allowInsecure = .allow_insecure | del(.allow_insecure) else . end
              | if has("sigv4") then .authConfig = {sigv4: .sigv4} | del(.sigv4) else . end
              | if has("basic_auth") then .authConfig = {basic: {secretName: .basic_auth.k8s_secret_name}} | del(.basic_auth) else . end
              | del(.no_auth) | del(.snapshotRepo)
            ')

            TARGET_CLUSTER=$(echo "$TARGET_CONFIG" | jq '
              del(.version)
              | if has("allow_insecure") then .allowInsecure = .allow_insecure | del(.allow_insecure) else . end
              | if has("sigv4") then .authConfig = {sigv4: .sigv4} | del(.sigv4) else . end
              | if has("basic_auth") then .authConfig = {basic: {secretName: .basic_auth.k8s_secret_name}} | del(.basic_auth) else . end
              | del(.no_auth)
            ')

            # speedupFactor is parameterized for testing
            CDC_CONFIG=$(jq -n \
              --argjson source "$SOURCE_CLUSTER" \
              --argjson target "$TARGET_CLUSTER" \
              --arg tupleS3Bucket "$TUPLE_S3_BUCKET" \
              --arg tupleS3Region "$TUPLE_S3_REGION" \
              --argjson useLocalStack "$USE_LOCAL_STACK" \
              --arg tupleS3Endpoint "$TUPLE_S3_ENDPOINT" \
              --arg otelTraceCollectorEndpoint "$OTEL_TRACE_COLLECTOR_ENDPOINT" \
              --argjson captureProxyPodReplicas '{{workflow.parameters.capture-proxy-pod-replicas}}' \
              --argjson kafkaBrokerReplicas '{{workflow.parameters.kafka-broker-replicas}}' \
              --argjson kafkaNodePoolSpecOverrides "$KAFKA_NODE_POOL_SPEC_OVERRIDES" \
              --argjson trafficTopicPartitions '{{workflow.parameters.traffic-topic-partitions}}' \
              --argjson replayerPodReplicas '{{workflow.parameters.replayer-pod-replicas}}' \
              --argjson replayerOverrides "$REPLAYER_CONFIG_OVERRIDES" \
              --argjson captureProxyOverrides "$CAPTURE_PROXY_CONFIG_OVERRIDES" \
              '{
                "skipApprovals": true,
                "sourceClusters": { "source1": $source },
                "targetClusters": { "target1": $target },
                "snapshotMigrationConfigs": [],
                "traffic": {
                  "kafkaClusters": {
                    "default": {
                      "autoCreate": {
                        "nodePoolSpecOverrides": (
                          $kafkaNodePoolSpecOverrides + {
                            "replicas": $kafkaBrokerReplicas
                          }
                        )
                      },
                      "topics": {
                        "capture-proxy": {
                          "specOverrides": {
                            "partitions": $trafficTopicPartitions
                          }
                        }
                      }
                    }
                  },
                  "proxies": {
                    "capture-proxy": {
                      "kafka": "default",
                      "kafkaTopic": "capture-proxy",
                      "source": "source1",
                      "proxyConfig": ({
                        "listenPort": 9201,
                        "noCapture": false,
                        "podReplicas": $captureProxyPodReplicas,
                        "serviceType": "{{workflow.parameters.capture-proxy-service-type}}"
                      } + (if $otelTraceCollectorEndpoint != "" then {
                        "otelTraceCollectorEndpoint": $otelTraceCollectorEndpoint
                      } else {} end) + $captureProxyOverrides)
                    }
                  },
                  "replayers": {
                    "replay1": {
                      "fromCapturedTraffic": "capture-proxy",
                      "toTarget": "target1",
                      "replayerConfig": ({
                        "speedupFactor": {{workflow.parameters.speedup-factor}},
                        "podReplicas": $replayerPodReplicas,
                        "useLocalStack": $useLocalStack
                      } + (if $tupleS3Bucket != "" then {
                        "tupleS3Bucket": $tupleS3Bucket,
                        "tupleS3Region": $tupleS3Region,
                        "tupleS3Prefix": "tuples/"
                      } else {} end)
                      + (if $tupleS3Endpoint != "" then {
                        "tupleS3Endpoint": $tupleS3Endpoint
                      } else {} end)
                      + (if $otelTraceCollectorEndpoint != "" then {
                        "otelTraceCollectorEndpoint": $otelTraceCollectorEndpoint
                      } else {} end)
                      + $replayerOverrides)
                    }
                  }
                }
              }')

            echo "CDC-only migration config:"
            echo "$CDC_CONFIG" | jq .
            echo "$CDC_CONFIG" | base64 | tr -d '\n' > /tmp/migration-config-base64
      outputs:
        parameters:
          - name: migrationConfigBase64
            valueFrom:
              path: /tmp/migration-config-base64
