plugins {
    id 'org.opensearch.migrations.java-library-conventions'
    id 'io.freefair.lombok'
    id 'java-test-fixtures'
}

dependencies {
    api project(':RfsCommon')

    implementation libs.jackson.databind
    implementation libs.reactor.core
    implementation libs.slf4j.api

    testFixturesImplementation libs.reactor.core

    testImplementation libs.reactor.test
    testImplementation libs.junit.jupiter.api
    testImplementation libs.junit.jupiter.params
    testImplementation libs.mockito.core
    testImplementation(testFixtures(project(':RfsPipeline')))
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.log4j.slf4j2.impl
    testRuntimeOnly libs.log4j.core
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'rfsMemoryStressTest'
    }
}

tasks.register('rfsMemoryStressTest', Test) {
    group = 'verification'
    description = 'Runs the isolated child-JVM soak test for RFS source-memory admission.'
    useJUnitPlatform {
        includeTags 'rfsMemoryStressTest'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    def durationOverride = System.getProperty('rfs.sourceMemoryStress.seconds')
    if (durationOverride != null) {
        systemProperty 'rfs.sourceMemoryStress.seconds', durationOverride
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}
