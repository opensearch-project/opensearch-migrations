version: 2

# Grouping notes:
#   * Each ecosystem has TWO groups:
#       - a "*-version" group (applies-to: version-updates, the default) that
#         batches the scheduled weekly bumps into a single PR.
#       - a "*-security" group (applies-to: security-updates) that batches
#         Dependabot security alerts into a single PR. WITHOUT this, security
#         updates ignore groups entirely and open one PR per advisory.
#   * Multiple manifests of the same ecosystem are folded into one update entry
#     via `directories:` (plural) so a single config covers every lockfile.
#   * The GitHub Advisory Database has no docker or helm advisories, so those
#     ecosystems only get version updates today. Their "*-security" groups
#     keep the convention in case that changes.
#
# Pins Dependabot can't see:
#   * Most MA images take their base image from an `ARG X=image:tag` default
#     used as `FROM ${X}`, overridden by buildImages/build.gradle (including the
#     custom-es-images entries). Dependabot only reads literal `FROM image:tag`
#     lines, so those pins aren't updated here. They mostly float on OS-level
#     tags such as amazonlinux:2023 and amazoncorretto:21-al2023-headless.
#   * The third-party charts that MA installs are pinned under `charts:` in
#     deployment/k8s/charts/aggregates/migrationAssistantWithArgo/values.yaml,
#     and those charts plus their images are listed again in that chart's
#     infra/mirror/private-ecr-manifest.yaml. Neither file is in a format
#     Dependabot understands, and the two have to change together.
#   The weekly "Dependency Staleness Report" workflow reports newer upstream
#   versions for these pins. The "Image Vulnerability Scan" workflow scans the
#   built images.

updates:
  - package-ecosystem: "npm"
    directories:
      - "/deployment/migration-assistant-solution"
      - "/orchestrationSpecs"
      - "/transformation/standardJavascriptTransforms"
      - "/TrafficCapture/SolrTransformations/transforms"
      - "/schema-viewer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      npm-version:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/eslint__js"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript-eslint"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      gradle-version:
        applies-to: version-updates
        patterns:
          - "*"
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "com.avast.gradle.docker-compose"
      # Stay on Netty 4.1, but let 4.1.x patch releases (incl. security fixes) through.
      - dependency-name: "io.netty:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # reactor-netty 1.3+ requires Netty 4.2; allow 1.2.x patch releases.
      - dependency-name: "io.projectreactor.netty:*" # reactor-netty 1.3+ requires Netty 4.2
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "io.projectreactor:reactor-test" # reactor-test 3.8+ requires Netty 4.2
      - dependency-name: "io.opentelemetry.semconv:*"
      - dependency-name: "org.apache.commons:commons-compress"
      - dependency-name: "org.apache.lucene:*"
      - dependency-name: "org.gradle.toolchains.foojay-resolver-convention"
      - dependency-name: "org.jcommander:jcommander"
      - dependency-name: "org.opensearch:*"
      - dependency-name: "org.opensearch.plugin:opensearch-security" # Version is derived from openSearch base version in build.gradle
      - dependency-name: "org.opensearch.plugin:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "errorprone"
      - dependency-name: "org.junit:junit-bom"
      - dependency-name: "org.junit.platform:*"
      - dependency-name: "org.junit.jupiter:*"
      # GraalVM 25.1.x currently breaks the GraalPy venv tests on CI's Java 21 runtime.
      - dependency-name: "org.graalvm.polyglot:*"
        versions:
          - "[25.0.4,)"
      - dependency-name: "org.graalvm.python:python-embedding"
        versions:
          - "[25.0.4,)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      github-actions-version:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directories:
      - "/migrationConsole/lib/console_link"
      - "/migrationConsole/cluster_tools"
      - "/migrationConsole/lib/integ_test"
      - "/libraries/testAutomation"
      - "/test/cleanupDeployment"
      - "/TrafficCapture/dockerSolution/src/main/docker/elasticsearchTestConsole"
      - "/solrMigrationDevSandbox"
      - "/transformation/transformationPlugins/jsonMessageTransformers/jsonPythonTransformerProvider/custom_transform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      pip-version:
        applies-to: version-updates
        patterns:
          - "*"
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Only Dockerfiles with literal `FROM image:tag` lines are listed. See "Pins
  # Dependabot can't see" above. Left out on purpose:
  #   - custom-solr-images: amazoncorretto:8-alpine has to stay on Java 8 for
  #     Solr 6, so a major bump is the only update Dependabot could offer.
  #   - dev-tools/jenkinsdocker: jenkins/jenkins:lts isn't a version tag, so
  #     Dependabot has nothing to compare.
  #   - deployment/k8s: Dockerfile.transforms is FROM scratch.
  - package-ecosystem: "docker"
    directories:
      # grafana/k6 is only the runtime base. The image replaces its k6 binary
      # with the one from `xk6 build v<version>`, so bump that line too.
      - "/TrafficCapture/trafficLoadTest"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      docker-version:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Chart.yaml `dependencies:`. Dependabot also reads image pins in values.yaml
  # in these directories, but testClusters has none it can parse. Left out on
  # purpose:
  #   - charts/aggregates/migrationAssistantWithArgo: no Chart.yaml dependencies.
  #     Its values.yaml image pins have to stay in step with the mirror manifest.
  #     See "Pins Dependabot can't see" above.
  #   - charts/components/k6LoadTest: the k6-operator chart has to match the
  #     operator release that TrafficCapture/trafficLoadTest/k6Operator patches
  #     and builds from a pinned commit.
  - package-ecosystem: "helm"
    directories:
      - "/deployment/k8s/charts/aggregates/testClusters"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      helm-version:
        applies-to: version-updates
        patterns:
          - "*"
      helm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # The source and target chart majors track the Elasticsearch and
      # OpenSearch majors that the tests deploy.
      - dependency-name: "elasticsearch"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "opensearch"
        update-types:
          - "version-update:semver-major"
