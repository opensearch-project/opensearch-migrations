---
name: Sanitize Github Repo Details
on:
  workflow_call:
    outputs:
      branch_name:
        description: "Branch name"
        value: ${{ jobs.sanitize.outputs.branch_name }}
      pr_repo_url:
        description: "PR repository URL"
        value: ${{ jobs.sanitize.outputs.pr_repo_url }}
      commit_hash:
        description: "Commit hash to build"
        value: ${{ jobs.sanitize.outputs.commit_hash }}

jobs:
  sanitize:
    runs-on: ubuntu-22.04
    outputs:
      branch_name: ${{ steps.sanitize.outputs.branch_name }}
      pr_repo_url: ${{ steps.sanitize.outputs.pr_repo_url }}
      commit_hash: ${{ steps.sanitize.outputs.commit_hash }}
    steps:
      - name: Sanitize repo and branch
        id: sanitize
        # Event values go through env, never as ${{ }} inside the script.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          clean_branch_name=$(printf '%s' "$HEAD_REF" | tr -cd '[:alnum:]_\-\./')
          clean_repo_base=$(printf '%s' "$HEAD_REPO" | tr -cd '[:alnum:]_\-\./')
          clean_repo_url="https://github.com/$clean_repo_base.git"
          clean_commit_hash=$(printf '%s' "$HEAD_SHA" | tr -cd '[:alnum:]')

          echo "Sanitized repo: $clean_repo_url"
          echo "Sanitized branch: $clean_branch_name"
          echo "Sanitized commit: $clean_commit_hash"

          {
            echo "branch_name=$clean_branch_name"
            echo "pr_repo_url=$clean_repo_url"
            echo "commit_hash=$clean_commit_hash"
          } >> "$GITHUB_OUTPUT"
