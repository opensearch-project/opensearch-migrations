    uses: ./.github/workflows/aws-ci-job.yml
    concurrency:
      group: aws-integ-eks-cfn-create-vpc-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || (github.event_name == 'schedule' && 'release') || 'main' }}
