---
# AWS integration tests in the CI test account. Each test is a script under ci/aws/tests/ run by aws-ci-job.yml in its
# own stage; its teardown always runs.
#   Pushes to main run the "all" set. One concurrency group per test: one runs and one waits; a newer commit replaces
#   the waiting one.
#   Release canary: the latest x.y.z release tag, with the ci/aws scripts from this run's ref. Scheduled once a day for
#   the "all" set; manual runs can choose it for any test.
#   Pushes, scheduled and manual runs use osm-ci-main.
#   PRs: a maintainer (CODEOWNERS) adds the test's run-* label, which runs it on the PR's code at that moment with
#        osm-ci-pr. A later push runs nothing until a maintainer adds the label again. rfs-default,
#        solutions-cfn-create-vpc and the AOSS time-series/vector tests have no PR label.
name: AWS integ tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test:
        description: 'Test to run'
        type: choice
        options:
          - all
          - eks-integ
          - eks-cfn-create-vpc
          - eks-cfn-import-vpc
          - eks-cdc-full-e2e
          - eks-cdc-aoss-e2e
          - eks-cdc-k6-load
          - eks-aoss-search
          - eks-aoss-timeseries
          - eks-aoss-vector
          - eks-byos
          - eks-isolated
          - full-es68
          - rfs-default
          - solutions-cfn-create-vpc
        default: eks-integ
      release-canary:
        description: 'Test the latest release tag instead of this branch'
        type: boolean
        default: false
  # Only `labeled`: a maintainer's label approves the PR's code at that moment (aws-ci-pr-gate.yml).
  pull_request_target:
    types: [labeled]
  schedule:
    # Once a day: the release canary for every test in "all". Off the hour, as GitHub delays runs at the top of the hour.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  # On PRs, nothing reads PR data until at least one test's gate allows the run (sanitize-repo-details.yml reads the
  # PR's branch name). Unlabeled PRs only run the gates, which read the event in JavaScript and call the GitHub API.
  sanitize-input:
    needs: [eks-integ-gate, eks-cfn-create-vpc-gate, eks-cfn-import-vpc-gate, eks-cdc-full-e2e-gate, eks-cdc-aoss-e2e-gate, eks-cdc-k6-load-gate, eks-aoss-search-gate, eks-byos-gate, eks-isolated-gate, full-es68-gate]
    if: |
      !cancelled() && (github.event_name != 'pull_request_target' || contains(needs.*.outputs.allowed, 'true'))
    uses: ./.github/workflows/sanitize-repo-details.yml

  resolve-ref:
    needs: sanitize-input
    if: "!cancelled() && needs.sanitize-input.result == 'success'"
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.ref.outputs.commit }}
      scripts_ref: ${{ steps.ref.outputs.scripts_ref }}
    steps:
      - id: ref
        env:
          CANARY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release-canary) }}
          COMMIT: ${{ needs.sanitize-input.outputs.commit_hash }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          if [[ "$CANARY" == true ]]; then
            tag=$(git ls-remote --tags "$REPO_URL" | { grep -oE 'refs/tags/[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's|refs/tags/||' | sort -V | tail -1)
            [[ -n "$tag" ]] || { echo "::error::No x.y.z release tag found"; exit 1; }
            echo "Release canary: testing $tag with the ci/aws scripts from $GITHUB_SHA"
            echo "commit=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "scripts_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "scripts_ref=" >> "$GITHUB_OUTPUT"
          fi

  eks-integ-gate:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/aws-ci-pr-gate.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      label: run-eks-tests

  eks-integ-test:
    needs: [resolve-ref, eks-integ-gate]
    if: |
      always() && needs.resolve-ref.result == 'success' && (
        github.event_name == 'push' || github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && (inputs.test == 'eks-integ' || inputs.test == 'all')) ||
        needs.eks-integ-gate.outputs.allowed == 'true')
    uses: ./.github/workflows/aws-ci-job.yml
    concurrency:
      group: aws-integ-eks-integ-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || (github.event_name == 'schedule' && 'release') || 'main' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    with:
      pool: ${{ github.event_name == 'pull_request_target' && 'pr' || 'main' }}
      release: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release-canary) }}
      commit: ${{ needs.resolve-ref.outputs.commit }}
      scripts-ref: ${{ needs.resolve-ref.outputs.scripts_ref }}
      setup-env: true
      run: '"$CI_AWS"/tests/eks-integ-test.sh --source-version ES_7.10 --target-version OS_1.3 --test-ids 0001,0002'
      cleanup: '"$CI_AWS"/shared/eks-cleanup.sh'
      run-timeout-minutes: 210
      timeout-minutes: 300
      test-name: eks-integ
    secrets:
      MIGRATIONS_CI_MAIN_ROLE: ${{ secrets.MIGRATIONS_CI_MAIN_ROLE }}
      MIGRATIONS_CI_PR_ROLE: ${{ secrets.MIGRATIONS_CI_PR_ROLE }}

  eks-cfn-create-vpc-gate:
