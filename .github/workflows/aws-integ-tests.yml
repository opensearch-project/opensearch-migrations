  all-aws-integ-checks-pass:
    # One results table for the run, and the aggregate check. Tests that didn't run (not selected, or no label on a
    # PR, which also skips resolve-ref) count as passing.
    needs: [resolve-ref, eks-integ-test, eks-cfn-create-vpc-test, eks-cfn-import-vpc-test, eks-cdc-full-e2e-test, eks-cdc-aoss-e2e-test, eks-cdc-k6-load-test, eks-aoss-search-test, eks-aoss-timeseries-test, eks-aoss-vector-test, eks-byos-test, eks-isolated-test, full-es68-test, rfs-default-test, solutions-cfn-create-vpc-test]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Results
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name | endswith("-test / run"))' | jq -s .)
          rows=$(jq -r --argjson jobs "$jobs" '
            to_entries[] | select(.key != "resolve-ref" and .value.result != "skipped") | .key as $k
            | ($jobs | map(select(.name == "\($k) / run")) | first) as $j
            | [ ($k | rtrimstr("-test")),
                ({"success": "✅", "failure": "❌", "cancelled": "⏹️"}[.value.result] // "➖") + " " + .value.result,
                (if $j and $j.completed_at then "\((($j.completed_at | fromdate) - ($j.started_at | fromdate)) / 60 | floor) min" else "" end),
                (if $j then "[job](\($j.html_url))" else "" end) ]
            | "| " + join(" | ") + " |"' <<< "$NEEDS")
          skipped=$(jq '[to_entries[] | select(.key != "resolve-ref" and .value.result == "skipped")] | length' <<< "$NEEDS")
          {
            echo "## AWS integ tests"
            echo
            if [[ -n "$rows" ]]; then
              echo "| Test | Result | Duration | Job |"
              echo "|---|---|---|---|"
              echo "$rows"
              echo
            fi
            echo "$skipped tests not run (not selected, or no label on the PR). Each job's diagnostics are in its Collect logs step."
          } >> "$GITHUB_STEP_SUMMARY"

          resolve=$(jq -r '.["resolve-ref"].result' <<< "$NEEDS")
          if [[ "$resolve" == failure || "$resolve" == cancelled ||
                ( "$GITHUB_EVENT_NAME" != pull_request_target && "$resolve" != success ) ]]; then
            echo "::error::resolve-ref $resolve, so no test ran"; exit 1
          fi
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$NEEDS" > /dev/null; then
            echo "::error::One or more AWS tests failed or were cancelled"; exit 1
          fi
