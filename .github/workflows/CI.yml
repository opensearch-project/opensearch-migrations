name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

env:
  python-version: '3.11'
  java-version: '21'
  gradle-version: '8.12.1'
  node-version: '22.x'
  gradle-test-parallelization: '30'

# Prevent multiple simultaneous runs except on main repo
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.repository == 'opensearch-project/opensearch-migrations' && github.ref == 'refs/heads/main') }}

jobs:
  gradle-extended-check:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        tasks:
          - spotlessCheck
          - publishToMavenLocal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
        with:
          gradle-cache-enabled: true
      - name: Run Gradle Build
        run: ./gradlew ${{matrix.tasks}}
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''

  gradle-build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
        with:
          gradle-cache-enabled: false
      - name: Run Gradle build on macOS
        run: ./gradlew build
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''

  python-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flake8
      - name: Analysing the code with flake8
        run: |
          flake8 $(git ls-files '*.py')

  python-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        py-project:
          - migrationConsole/lib/console_link
          - migrationConsole/cluster_tools
          - solrMigrationDevSandbox
          - libraries/testAutomation
    env:
      WORKING_DIR: ${{ startsWith(matrix.py-project, 'migrationConsole/') && format('./{0}', matrix.py-project) || startsWith(matrix.py-project, 'libraries/') && format('./{0}', matrix.py-project) || matrix.py-project == 'solrMigrationDevSandbox' && format('./{0}', matrix.py-project) || format('./TrafficCapture/dockerSolution/src/main/docker/{0}', matrix.py-project) }}
      WORKFLOW_TEST_KUBE_CONTEXT: kind-console-link-test
      # The secrets context is unavailable in a step `if`, so gate on this instead.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env

      # Set up Kind cluster for workflow integration tests (only for console_link project)
      - name: Set up Kind cluster
        if: matrix.py-project == 'migrationConsole/lib/console_link'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: console-link-test

      # Verify Kind cluster is ready (only for console_link project)
      - name: Verify Kind cluster
        if: matrix.py-project == 'migrationConsole/lib/console_link'
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get namespaces

      - name: Install workflow test cluster dependencies
        if: matrix.py-project == 'migrationConsole/lib/console_link'
        run: ./scripts/setupWorkflowTestCluster.sh

      - name: Install dependencies (Pipfile)
        run: |
          python3 -m pip install pipenv==2026.5.0
          pipenv install --deploy --dev
          pipenv graph

      - name: Run tests (Pipfile)
        run: |
          pipenv run test
          pipenv run coverage xml

      - name: Get Sanitized Name
        env:
          PY_PROJECT: ${{ matrix.py-project }}
        run: echo "SANITIZED_PY_PROJECT=${PY_PROJECT//\//-}" >> $GITHUB_ENV
      - name: Upload coverage to Codecov
        if: always() && env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          fail_ci_if_error: true
          flags: python
          skip_validation: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - name: List Docker images
        if: always()
        run: |
          echo "Recording Docker images. These include standard images pre-cached by GitHub Actions when Docker is run as root."
          docker image list --format '{{ if ne .Repository "<none>" }}{{ .Repository }}{{ if ne .Tag "<none>" }}:{{ .Tag }}{{ end }}{{ else }}{{ .ID }}{{ end }}'

  jenkins-kind-setup-script-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Jenkins kind setup scripts
        run: ./jenkins/tests/configureKindClusterTest.sh

  generate-test-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # Generate a JSON array from 0 to gradle-test-parallelization-1
          indices=()
          for i in $(seq 0 $((${{ env.gradle-test-parallelization }}-1))); do
            indices+=($i)
          done
          echo "matrix=$(IFS=,; echo "[${indices[*]}]")" >> $GITHUB_OUTPUT

  seed-gradle-test-docker-cache:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Each list maps to one independently invalidated Docker cache.
        include:
          - name: infrastructure
            image_list: .github/gradle-test-images/infrastructure.txt
          - name: search
            image_list: .github/gradle-test-images/search.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          sudo docker system prune -af
          df -h
      - name: Restore or initialize Gradle test Docker cache
        id: docker-cache
        uses: AndreKurait/docker-cache@7a3887908bdb97935395833df69b060cfcca0f7f # 0.7.0
        with:
          key: gradle-test-docker-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles(matrix.image_list) }}
      - name: Pull images for Gradle tests
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: .github/scripts/seed-gradle-test-docker-cache.sh "${{ matrix.image_list }}"

  gradle-tests:
    needs: [generate-test-matrix, seed-gradle-test-docker-cache]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJson(needs.generate-test-matrix.outputs.matrix) }}
    env:
      # The secrets context is unavailable in a step `if`, so gate on this instead.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
        with:
          gradle-cache-enabled: true
          gradle-cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          sudo docker system prune -af
          df -h
      - name: Restore Gradle test infrastructure Docker cache
        uses: AndreKurait/docker-cache@7a3887908bdb97935395833df69b060cfcca0f7f # 0.7.0
        with:
          key: gradle-test-docker-${{ runner.os }}-infrastructure-${{ hashFiles('.github/gradle-test-images/infrastructure.txt') }}
          read-only: true
      - name: Restore Gradle test search Docker cache
        uses: AndreKurait/docker-cache@7a3887908bdb97935395833df69b060cfcca0f7f # 0.7.0
        with:
          key: gradle-test-docker-${{ runner.os }}-search-${{ hashFiles('.github/gradle-test-images/search.txt') }}
          read-only: true

      - name: Run Gradle tests with striping
        run: |
          MAX_WORKERS=$(( $(nproc) - 1 ))
          ./gradlew allTests mergeJacocoReports \
          --max-workers $MAX_WORKERS \
          -Dtest.striping.total=${{ env.gradle-test-parallelization }} \
          -Dtest.striping.index=${{ matrix.index }} \
          -x spotlessCheck --stacktrace --continue
        env:
          OS_MIGRATIONS_GRADLE_SCAN_TOS_AGREE_AND_ENABLED: ''
      - name: Detect Memory Dumps
        if: failure()
        run: |
          if find . -type f -name "*.hprof" | grep -q '.'; then
            echo "::group::Memory Dumps Detected"
            echo "::warning::Memory dumps were found and uploaded as artifacts. Review these files to diagnose OOM issues."
            echo "To download and inspect these files, navigate to 'Actions' -> 'Artifacts'."
            echo "::endgroup::"
          fi
      - name: Upload memory dump
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: warn
          name: memory-dumps-gradle-tests-stripe-${{ matrix.index }}
          path: ./**/*.hprof

      - name: Upload test reports for stripe ${{ matrix.index }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: test-reports-gradle-tests-stripe-${{ matrix.index }}
          path: |
            **/build/reports/tests/

      - name: Upload coverage to Codecov
        if: always() && env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          fail_ci_if_error: true
          flags: gradle
          skip_validation: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: List Docker images
        if: always()
        run: |
          echo "Recording Docker images. These include standard images pre-cached by GitHub Actions when Docker is run as root."
          docker image list --format '{{ if ne .Repository "<none>" }}{{ .Repository }}{{ if ne .Tag "<none>" }}:{{ .Tag }}{{ end }}{{ else }}{{ .ID }}{{ end }}'
      - name: Show disk usage
        if: always()
        run: |
          df -h
          docker system df -v

  node-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        npm-project:
          - ./deployment/cdk/opensearch-service-migration
          - ./deployment/migration-assistant-solution
          - ./TrafficCapture/SolrTransformations/transforms
          - ./orchestrationSpecs
          - ./migrationConsole/web
    env:
      # The secrets context is unavailable in a step `if`, so gate on this instead.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    defaults:
      run:
        working-directory: ${{ matrix.npm-project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
      - name: Install workflow web Python dependencies
        if: matrix.npm-project == './migrationConsole/web'
        working-directory: ./migrationConsole/lib/console_link
        run: pipenv install --deploy
      - name: Install NPM dependencies
        run: npm ci
      - name: Run NPM tests
        run: npm run test
      - name: Run orchestration CRD integration tests
        if: matrix.npm-project == './orchestrationSpecs'
        run: npm run test:integ:crds
      - name: Upload coverage to Codecov
        if: always() && env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          fail_ci_if_error: true
          flags: node
          skip_validation: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  mountable-transforms-k8s-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          cluster_name: mountable-transforms
          node_image: kindest/node:v1.35.1
          config: deployment/k8s/tests/kindImageVolumeConfig.yaml
          wait: 120s
      - name: Run mountable transforms image volume smoke test
        env:
          KIND_CLUSTER_NAME: mountable-transforms
          KUBE_CONTEXT: kind-mountable-transforms
          KIND_REGISTRY_PORT: "5002"
        run: deployment/k8s/tests/mountableTransformsImageVolumeTest.sh

  link-checker:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --accept=200,403,429  "**/*.html" "**/*.md" "**/*.txt" "**/*.json"
            --offline
            --exclude "file:///github/workspace/*"
            --exclude "file://.kiro/*"
            --exclude "http://localhost*"
            --exclude "https://localhost*"
            --exclude "http://capture-proxy*"
            --exclude "https://capture-proxy*"
            --exclude-path "orchestrationSpecs/packages/argo-workflow-builders/tests/integ/artifacts"
            --exclude "file://.*artifacts/parity-catalog.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  gcp-terraform-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform test (GCP module)
        # Plan-time tests only; no cloud credentials required.
        working-directory: deployment/terraform/gcp
        run: |
          terraform init -backend=false
          terraform test

  codeql-analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
        - language: javascript-typescript
        - language: python
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
    - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
      with:
        category: "/language:${{matrix.language}}"

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-22.04
    services:
      sonarqube:
        image: sonarqube:25.10.0.114319-community
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -s -u admin:admin http://localhost:9000/api/system/health | grep -o GREEN"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=60
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-env
      with:
        gradle-cache-enabled: true
    - name: Cache SonarQube Scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: ~/.sonar/cache
        key: sonar-cache
        restore-keys: sonar-cache
    - name: Generate SonarQube Token
      run: |
        echo "Generating a SonarQube token..."
        RESPONSE=$(curl -s -X POST -u "admin:admin" "http://localhost:9000/api/user_tokens/generate" \
          -d "name=github-action-token" -d "type=GLOBAL_ANALYSIS_TOKEN")

        SONAR_TOKEN=$(echo "$RESPONSE" | jq -r '.token')

        if [ "$SONAR_TOKEN" == "null" ]; then
          echo "❌ Failed to generate SonarQube token!"
          exit 1
        fi

        echo "::add-mask::$SONAR_TOKEN"
        echo "SONAR_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV
    - name: Run SonarQube Scanner
      run: |
        set -euo pipefail
        SCANNER_VERSION="8.1.0.6389"
        SCANNER_ZIP="sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
        # Maven Central mirrors the SonarSource scanner releases and has been
        # reliable from GitHub-hosted runners; binaries.sonarsource.com has
        # started returning 403 from some egress IPs.
        SCANNER_URL="https://repo1.maven.org/maven2/org/sonarsource/scanner/cli/sonar-scanner-cli/${SCANNER_VERSION}/${SCANNER_ZIP}"
        SCANNER_SHA256="bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b"

        # Retry on transient failures (CDN flakes, partial downloads).
        # --fail makes curl exit non-zero on HTTP errors so we don't silently feed an
        # error page into unzip, --retry-all-errors covers the body-cut-off case where
        # curl saw 200 OK headers but the connection died mid-stream.
        curl --fail --location --silent --show-error \
             --retry 5 --retry-delay 5 --retry-all-errors \
             --max-time 120 \
             -o sonar-scanner-cli.zip "$SCANNER_URL"

        # Verify checksum to catch any corruption that curl could not detect.
        echo "${SCANNER_SHA256}  sonar-scanner-cli.zip" | sha256sum -c -

        # Test zip integrity before extracting so a bad download fails loudly here
        # instead of leaking partial files into $HOME.
        unzip -tq sonar-scanner-cli.zip
        unzip -q sonar-scanner-cli.zip -d "$HOME"

        export PATH="$HOME/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin:$PATH"
        sonar-scanner \
          -Dsonar.projectKey=local_project \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.login=$SONAR_TOKEN
    - name: Wait for issues to be processed
      run: sleep 60
    - name: Collect issues from the server
      run: |
        curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/issues/search?componentKeys=local_project" -o issues.json

        echo "::group::SonarQube Issues"
        jq -r '.issues[] | "File: \(.component):\(.line), Rule: \(.rule), Message: \(.message)"' issues.json | sort
        echo "::endgroup::"

        jq -c '.issues | sort_by(.creationDate) | reverse | .[]' issues.json | while read -r issue; do
          FILE=$(echo "$issue" | jq -r '.component | split(":")[1]')
          LINE=$(echo "$issue" | jq -r '.line')
          MESSAGE=$(echo "$issue" | jq -r '.message')
          RULE=$(echo "$issue" | jq -r '.rule')

          echo "::error file=$FILE,line=$LINE,title=$RULE::$MESSAGE"
        done

        ISSUE_COUNT=$(jq '.issues | length' issues.json)
        BASELINE_ISSUE_COUNT=0
        if [ "$ISSUE_COUNT" -gt "$BASELINE_ISSUE_COUNT" ]; then
          echo "❌ Build failed: Found $ISSUE_COUNT issues, which is more than the baseline of $BASELINE_ISSUE_COUNT."
          exit 1
        else
          echo "✅ Build passed: Found $ISSUE_COUNT issues, which is within the baseline of $BASELINE_ISSUE_COUNT."
        fi
    - name: Upload SonarQube Artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: sonar-reports
        path: issues.json

  all-ci-checks-pass:
    needs:
      - python-tests
      - jenkins-kind-setup-script-tests
      - seed-gradle-test-docker-cache
      - gradle-tests
      - link-checker
      - node-tests
      - mountable-transforms-k8s-test
      - python-lint
      - gradle-extended-check
      - gradle-build-macos
      - codeql-analyze
      - sonarqube-analysis
      - gcp-terraform-test
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - if: ${{ contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
        run: |
          echo "One or more job cancelled or failed" && exit 1
      - run: |
          echo '## :heavy_check_mark: All continuous integration checks pass' >> $GITHUB_STEP_SUMMARY
