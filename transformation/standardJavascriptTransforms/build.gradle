import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'base'
    id 'com.github.node-gradle.node' version '7.1.0'
}

node {
    version = '22.14.0'
    download = true

    // Use this project's directories for node artifacts
    workDir = project.layout.buildDirectory.dir("nodejs")
    npmWorkDir = project.layout.buildDirectory.dir("npm")
}

def jsSrcDir = layout.projectDirectory.dir("src")
def jsDistDir = layout.buildDirectory.dir("dist")

tasks.register('installDependencies', NpmTask) {
    description = "Install Node.js dependencies"
    args = ['ci']
}

tasks.register('test', NpmTask) {
    description = "Run JavaScript tests with coverage"
    args = ['run', 'test']
    dependsOn installDependencies
}

tasks.register('lint', NpmTask) {
    description = "Run ESLint on JavaScript files"
    args = ['run', 'lint']
    dependsOn installDependencies
}

tasks.register('packageJs', Sync) {
    description = "Package JavaScript files for distribution"
    from jsSrcDir
    into jsDistDir

    // Explicit inputs/outputs for incremental build support
    inputs.dir(jsSrcDir)
    outputs.dir(jsDistDir)
}

tasks.register('createNpmPackage', NpmTask) {
    description = "Create local npm package (.tgz file)"
    args = ['pack']
    dependsOn test
}

assemble.dependsOn packageJs
check.dependsOn test

configurations {
    jsResources
}

artifacts {
    jsResources(layout.buildDirectory.dir("dist")) {
        builtBy(packageJs)
    }
}
