// Run from the repository root: ./gradlew :RFS:jmh -I RFS/benchmarks/bulk-request.gradle
allprojects {
    afterEvaluate { p ->
        if (p.path == ':RFS') {
            // The generated-code task lacks the Error Prone plugin's compiler classpath.
            p.tasks.named('jmhCompileGeneratedClasses') {
                options.errorprone.enabled = false
            }
            p.jmh {
                includes = ['.*BulkRequestBenchmark.*']
                fork = 2
                profilers = ['gc']
                jvmArgsAppend = ['-Xms1g', '-Xmx1g',
                    "-Dlog4j2.configurationFile=${p.file('benchmarks/log4j2.xml')}"]
                resultFormat = 'JSON'
                resultsFile = p.file("${p.buildDir}/reports/jmh/bulk-request.json")
                zip64 = true
            }
        }
    }
}
