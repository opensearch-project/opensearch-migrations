plugins {
    id 'org.opensearch.migrations.java-library-conventions'
    id 'io.freefair.lombok'
}

dependencies {
    implementation project(':RfsCommon')
    implementation project(':RfsHttp')
    implementation project(':RfsPipeline')
    implementation project(':SearchSnapshotExtractor')

    implementation libs.jackson.databind
    implementation libs.jackson.core
    implementation libs.jackson.dataformat.smile
    implementation libs.slf4j.api

    // The Azure SDK defaults to a netty transport that wants a newer netty than the
    // repo-wide pin in boms-netty. The JDK HttpClient transport covers everything the
    // snapshot reader does, so netty is excluded and the JDK transport supplied instead.
    implementation(libs.azure.storage.blob) {
        exclude group: 'com.azure', module: 'azure-core-http-netty'
    }
    implementation(libs.azure.identity) {
        exclude group: 'com.azure', module: 'azure-core-http-netty'
    }
    implementation libs.azure.core.http.jdk.httpclient

    testImplementation testFixtures(project(':RFS'))
    testImplementation testFixtures(project(':coreUtilities'))
    testImplementation testFixtures(project(':testHelperFixtures'))

    testImplementation libs.hamcrest
    testImplementation libs.mockito.core
    testImplementation libs.mockito.junit.jupiter
    testImplementation libs.junit.jupiter.api
    testImplementation libs.junit.jupiter.params
    testImplementation libs.log4j.core
    testImplementation libs.log4j.slf4j2.impl
    testImplementation libs.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.azure

    testRuntimeOnly libs.junit.jupiter.engine
}
