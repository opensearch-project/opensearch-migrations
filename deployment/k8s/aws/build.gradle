plugins {
    id 'base'
}

def repositoryRoot = rootProject.layout.projectDirectory

tasks.register('testMirrorToEcrUtils', Exec) {
    description = 'Tests the bounded ECR mirror worker pool and digest fast paths'
    group = 'verification'
    workingDir repositoryRoot.asFile
    commandLine 'bash', repositoryRoot.file('test/mirrorToEcrUtils.sh').asFile
}

tasks.register('testBootstrapMirror', Exec) {
    description = 'Tests bootstrap mirror scheduling, concurrency, and ECR polling'
    group = 'verification'
    workingDir repositoryRoot.asFile
    commandLine 'bash', repositoryRoot.file('test/bootstrapMirror.sh').asFile
}

tasks.register('testBootstrapGrantEksAccessOnly', Exec) {
    description = 'Tests the source and assembled bootstrap grant-only flow'
    group = 'verification'
    workingDir repositoryRoot.asFile
    commandLine 'bash', repositoryRoot.file('test/awsBootstrapGrantEksAccessOnly.sh').asFile
}

tasks.register('testBootstrapCfnResume', Exec) {
    description = 'Tests reconnecting to an in-progress CloudFormation deployment'
    group = 'verification'
    workingDir repositoryRoot.asFile
    commandLine 'bash', repositoryRoot.file('test/awsBootstrapCfnResume.sh').asFile
}

tasks.named('check') {
    dependsOn 'testMirrorToEcrUtils', 'testBootstrapMirror',
            'testBootstrapGrantEksAccessOnly', 'testBootstrapCfnResume'
}
