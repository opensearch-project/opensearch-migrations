plugins {
    id 'base'
}

def repositoryRoot = rootProject.layout.projectDirectory

def bashTests = [
    testMirrorToEcrUtils           : [
        'test/mirrorToEcrUtils.sh',
        'Tests the bounded ECR mirror worker pool and digest fast paths',
    ],
    testBootstrapMirror            : [
        'test/bootstrapMirror.sh',
        'Tests bootstrap mirror scheduling, concurrency, and ECR polling',
    ],
    testBootstrapGrantEksAccessOnly: [
        'test/awsBootstrapGrantEksAccessOnly.sh',
        'Tests the source and assembled bootstrap grant-only flow',
    ],
    testBootstrapCfnResume         : [
        'test/awsBootstrapCfnResume.sh',
        'Tests reconnecting to an in-progress CloudFormation deployment',
    ],
    testBootstrapEnvironmentExports: [
        'test/awsBootstrapEnvironmentExports.sh',
        'Tests bootstrapping from Terraform migration_environment exports',
    ],
]

bashTests.each { taskName, spec ->
    def (script, desc) = spec
    tasks.register(taskName, Exec) {
        description = desc
        group = 'verification'
        workingDir repositoryRoot.asFile
        commandLine 'bash', repositoryRoot.file(script).asFile
    }
}

tasks.named('check') {
    dependsOn bashTests.keySet()
}
