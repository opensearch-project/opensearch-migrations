# Example overrides for the main EKS general workload NodePool (`general-work-pool`).
# Pass with:
#   ./deployment/k8s/aws/aws-bootstrap.sh --helm-values deployment/k8s/aws/examples/nodepool-overrides.yaml ...
#
# The chart leaves instance selection unconstrained by default (see workloadsNodePool in the
# chart's values.yaml). This example narrows it to on-demand, current-generation compute, general
# purpose and memory optimized instances up to 4xlarge, and caps the pool's total size (the chart
# sets no limits by default). Omitted map fields fall back to the chart defaults.
# List fields replace the full default list, so provide the complete desired list when overriding.

workloadsNodePool:
  architectures: ["amd64", "arm64"]
  capacityTypes: ["on-demand"]
  instanceCategories: ["c", "m", "r"]
  minInstanceGeneration: 5
  instanceSizes: ["medium", "large", "xlarge", "2xlarge", "4xlarge"]
  limits:
    cpu: "64000m"
    memory: "128Gi"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
