{{- if .Values.registry.enabled }}
# Shared state for the mixed write-then-read ring buffer and chaos control bus. k6 speaks RESP
# directly through its compiled xk6-redis extension.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app: valkey
    component: k6-load-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
        component: k6-load-test
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag }}"
          imagePullPolicy: {{ .Values.registry.image.pullPolicy }}
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app: valkey
    component: k6-load-test
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
