# One ready-to-run TestRun per scenario, rendered as JSON into this ConfigMap's data (NOT applied
# by helm — these are examples, applied on demand). The load test itself is not in this chart: the
# scenarios, libs, schemas and load-profile presets ride in the migrations/k6_scripts data image,
# mounted read-only at /scripts by a Kubernetes `image:` volume on BOTH the initializer (which runs
# `k6 archive`) and the runner pods. The pods themselves run stock grafana/k6. A run therefore
# names two things: the script's path under /scripts, and the preset, via K6_PRESET. To run one:
#   kubectl get cm k6-testrun-examples -o "jsonpath={.data.ingest}" | kubectl create -f -
# Override defaults by changing K6_PRESET or adding further runner.env entries (later wins).
{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
{{- $pull := .Values.image.pullPolicy }}
{{- $scripts := .Values.scriptsImage }}
{{- /* A digest pins exact content and wins over the tag — see the values.yaml comment. */ -}}
{{- $scriptsRef := ternary
      (printf "%s@%s" $scripts.repository $scripts.digest)
      (printf "%s:%s" $scripts.repository ($scripts.tag | default .Chart.AppVersion))
      (ne (toString $scripts.digest) "") }}
{{- $volume := dict "name" "scripts" "image" (dict "reference" $scriptsRef "pullPolicy" $scripts.pullPolicy) }}
{{- $mount := dict "name" "scripts" "mountPath" "/scripts" }}
{{- $parallelism := .Values.testRun.parallelism | int }}
{{- $separate := .Values.testRun.separate }}
{{- $cleanup := .Values.testRun.cleanup }}
{{- $otel := list
      (dict "name" "K6_OUT" "value" "opentelemetry")
      (dict "name" "K6_OTEL_GRPC_EXPORTER_ENDPOINT" "value" "otel-collector:4317")
      (dict "name" "K6_OTEL_GRPC_EXPORTER_INSECURE" "value" "true") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-testrun-examples
  namespace: {{ .Release.Namespace }}
  labels:
    app: k6-load-test
data:
{{- range $scenario := (list "ingest" "search" "mixed") }}
  {{- $initializer := dict "image" $image "imagePullPolicy" $pull
        "volumes" (list $volume) "volumeMounts" (list $mount) }}
  {{- $runner := dict "image" $image "imagePullPolicy" $pull
        "volumes" (list $volume) "volumeMounts" (list $mount)
        "env" (concat (list (dict "name" "K6_PRESET" "value" (printf "%s-steady" $scenario))) $otel) }}
  {{- $spec := dict "parallelism" $parallelism "separate" $separate
        "script" (dict "localFile" (printf "/scripts/scenarios/%s.js" $scenario))
        "initializer" $initializer "runner" $runner }}
  {{- if $cleanup }}{{- $_ := set $spec "cleanup" $cleanup }}{{- end }}
  {{- $testrun := dict
        "apiVersion" "k6.io/v1alpha1" "kind" "TestRun"
        "metadata" (dict "generateName" "k6-run-" "labels" (dict "app" "k6-load-test" "k6-scenario" $scenario))
        "spec" $spec }}
  {{ $scenario }}: |-
{{ $testrun | toJson | indent 4 }}
{{- end }}
