# One ready-to-run TestRun per scenario, rendered as JSON into this ConfigMap's data (NOT applied
# by helm — these are examples, applied on demand). Since the scenario tree is flat, the whole
# k6-scenarios ConfigMap mounts directly at /scripts (no `items` projection). Each example also
# bakes in the runner image, K6_OUT metrics, and a default preset via envFrom. To run one:
#   kubectl get cm k6-testrun-examples -o "jsonpath={.data.ingest}" | kubectl create -f -
# Override defaults by swapping the envFrom preset name or adding runner.env entries (env wins).
{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
{{- $pull := .Values.image.pullPolicy }}
{{- $parallelism := .Values.testRun.parallelism | int }}
{{- $separate := .Values.testRun.separate }}
{{- $cleanup := .Values.testRun.cleanup }}
{{- $otel := list
      (dict "name" "K6_OUT" "value" "opentelemetry")
      (dict "name" "K6_OTEL_GRPC_EXPORTER_ENDPOINT" "value" "otel-collector:4317")
      (dict "name" "K6_OTEL_GRPC_EXPORTER_INSECURE" "value" "true") }}
{{- $volume := dict "name" "scenarios" "configMap" (dict "name" "k6-scenarios") }}
{{- $mount := dict "name" "scenarios" "mountPath" "/scripts" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-testrun-examples
  namespace: {{ .Release.Namespace }}
  labels:
    app: k6-load-test
data:
{{- range $scenario := (list "ingest" "search" "mixed") }}
  {{- $initializer := dict "image" $image "imagePullPolicy" $pull "volumeMounts" (list $mount) "volumes" (list $volume) }}
  {{- $runner := dict "image" $image "imagePullPolicy" $pull "volumeMounts" (list $mount) "volumes" (list $volume)
        "envFrom" (list (dict "configMapRef" (dict "name" (printf "k6-preset-%s-steady" $scenario))))
        "env" $otel }}
  {{- $spec := dict "parallelism" $parallelism "separate" $separate
        "script" (dict "localFile" (printf "/scripts/SCENARIO_%s.js" $scenario))
        "initializer" $initializer "runner" $runner }}
  {{- if $cleanup }}{{- $_ := set $spec "cleanup" $cleanup }}{{- end }}
  {{- $testrun := dict
        "apiVersion" "k6.io/v1alpha1" "kind" "TestRun"
        "metadata" (dict "generateName" "k6-run-" "labels" (dict "app" "k6-load-test" "k6-scenario" $scenario))
        "spec" $spec }}
  {{ $scenario }}: |-
{{ $testrun | toJson | indent 4 }}
{{- end }}
