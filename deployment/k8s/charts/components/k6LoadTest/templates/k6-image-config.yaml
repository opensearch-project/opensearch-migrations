# Image config the migration console reads to set TestRun spec.runner.image / imagePullPolicy.
# Kept in this (separate) chart — not in migration-image-config — so the console only learns of a
# k6 image when the load-test chart is installed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-image-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: k6-load-test
data:
  k6Image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
  k6PullPolicy: "{{ .Values.image.pullPolicy }}"
