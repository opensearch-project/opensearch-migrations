# One Argo WorkflowTemplate per scenario. A WorkflowTemplate is inert until something instantiates
# it, which is why the run definition can live here as a real cluster object instead of as a JSON
# string inside a ConfigMap: creating a TestRun starts a load test, but creating a WorkflowTemplate
# does not. Submitting a run is then a ~10-line Workflow that names the template and its parameters:
#
#   kubectl create -n ma -f - <<'EOF'
#   apiVersion: argoproj.io/v1alpha1
#   kind: Workflow
#   metadata: {generateName: k6-ingest-}
#   spec:
#     workflowTemplateRef: {name: k6-ingest}
#     arguments: {parameters: [{name: parallelism, value: "2"}]}
#   EOF
#
# The workflow's single task creates the TestRun and blocks until the k6-operator reports a terminal
# stage, so the operator keeps doing the hard part (splitting the load into execution segments across
# `parallelism` runner pods and releasing them together) while Argo owns submission and waiting.
#
# The TestRun takes the workflow's own name, so a run has ONE identifier: `kubectl logs -l
# k6_cr=<name>` reaches the k6 pods, and deleting the workflow cascades to the TestRun through the
# owner reference.
{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
{{- $starter := printf "%s:%s" .Values.starterImage.repository .Values.starterImage.tag }}
{{- $scripts := .Values.scriptsImage }}
{{- /* A digest pins exact content and wins over the tag — see the values.yaml comment. */ -}}
{{- $scriptsRef := ternary
      (printf "%s@%s" $scripts.repository $scripts.digest)
      (printf "%s:%s" $scripts.repository ($scripts.tag | default .Chart.AppVersion))
      (ne (toString $scripts.digest) "") }}
{{- /*
  Runner env entries that are safe to state here, with the value each scenario would otherwise fall
  back to in JS (`CFG.X || 'default'`).

  Only keys that NO preset in k6-config/*.env sets may appear here. runnerEnv is not a defaults
  layer: lib/config.js resolves a run as `{...preset, ...__ENV}`, so an entry here BEATS the
  selected preset and cannot be overridden by it. Listing a preset-owned key (DURATION, INGEST_RATE,
  EXECUTOR, RAMP_STAGES, VUs, BULK_BATCH_SIZE, SEED_DOC_COUNT, REGISTRY_ENABLED, …) would force one
  value on every preset — the ramp and burst profiles deliberately omit DURATION, for instance,
  because RAMP_STAGES carries their timing.
*/ -}}
{{- $envDefaults := dict
      "ingest" (list
        (dict "name" "SCHEMA" "value" "nyc_taxis")
        (dict "name" "NO_CONNECTION_REUSE" "value" "false")
        (dict "name" "CONTROL_ENABLED" "value" "false")
        (dict "name" "CONTROL_CMD_KEY" "value" "control_cmd")
        (dict "name" "BULK_FRACTION" "value" "0.70"))
      "search" (list
        (dict "name" "SCHEMA" "value" "nyc_taxis")
        (dict "name" "NO_CONNECTION_REUSE" "value" "false")
        (dict "name" "SEARCH_FLAT_FRACTION" "value" "0.60")
        (dict "name" "SEARCH_AGG_FRACTION" "value" "0.20")
        (dict "name" "SEARCH_UPDATE_FRACTION" "value" "0.10")
        (dict "name" "SEARCH_WRITE_FRACTION" "value" "0.05"))
      "mixed" (list
        (dict "name" "SCHEMA" "value" "nyc_taxis")
        (dict "name" "NO_CONNECTION_REUSE" "value" "false")
        (dict "name" "CONTROL_ENABLED" "value" "false")
        (dict "name" "CONTROL_CMD_KEY" "value" "control_cmd")
        (dict "name" "REGISTRY_CAP" "value" "1000")
        (dict "name" "REGISTRY_KEY" "value" "recent_ids")
        (dict "name" "BULK_FRACTION" "value" "0.70")
        (dict "name" "SEARCH_FLAT_FRACTION" "value" "0.60")
        (dict "name" "SEARCH_AGG_FRACTION" "value" "0.20")
        (dict "name" "SEARCH_UPDATE_FRACTION" "value" "0.10")) }}
{{- range $scenario := (list "ingest" "search" "mixed") }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: k6-{{ $scenario }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: k6-load-test
    k6-scenario: {{ $scenario }}
spec:
  serviceAccountName: {{ $.Values.workflow.serviceAccountName }}
  entrypoint: run
  # Every per-run knob is a parameter with a default supplied here, so a caller overrides only what
  # it cares about and never has to know the images. `runnerEnv` carries the WHOLE runner env as a
  # one-line JSON array (JSON is valid YAML, so it splices into the manifest below): the console
  # reads this default and replaces entries by name, which keeps one definition of the static vars
  # and avoids two env entries of the same name.
  arguments:
    parameters:
      - name: parallelism
        value: {{ $.Values.testRun.parallelism | int | quote }}
      - name: separate
        value: {{ $.Values.testRun.separate | quote }}
      - name: arguments
        value: ""
      - name: runnerImage
        value: {{ $image | quote }}
      - name: starterImage
        value: {{ $starter | quote }}
      - name: scriptsRef
        value: {{ $scriptsRef | quote }}
      - name: scriptsPullPolicy
        value: {{ $scripts.pullPolicy | quote }}
      - name: runnerEnv
        value: {{ toJson (concat (list
              (dict "name" "K6_PRESET" "value" (printf "%s-steady" $scenario))
              (dict "name" "K6_OUT" "value" "opentelemetry")
              (dict "name" "K6_OTEL_GRPC_EXPORTER_ENDPOINT" "value" "otel-collector:4317")
              (dict "name" "K6_OTEL_GRPC_EXPORTER_INSECURE" "value" "true")
              (dict "name" "CAPTURE_PROXY_URL" "value" $.Values.captureProxyUrl))
              (index $envDefaults $scenario)) | quote }}
  templates:
    - name: run
      # A TestRun that never reaches a terminal stage (for example runner pods that cannot pull an
      # image) would otherwise block forever, since neither condition can match.
      # NOTE: this needs to be on top level of the template.
      activeDeadlineSeconds: {{ $.Values.workflow.activeDeadlineSeconds | int }}
      resource:
        action: create
        # Ties the TestRun's lifetime to the workflow: stopping a run means deleting the workflow.
        setOwnerReference: true
        successCondition: status.stage == finished
        failureCondition: status.stage == error
        manifest: |
          apiVersion: k6.io/v1alpha1
          kind: TestRun
          metadata:
            name: "{{`{{workflow.name}}`}}"
            labels:
              app: k6-load-test
              k6-scenario: {{ $scenario }}
          spec:
            parallelism: {{`{{workflow.parameters.parallelism}}`}}
            separate: {{`{{workflow.parameters.separate}}`}}
            arguments: "{{`{{workflow.parameters.arguments}}`}}"
            script:
              localFile: /scripts/scenarios/{{ $scenario }}.js
            # Pinned to the controller's version — the operator would otherwise pull a floating
            # `latest-starter`. It carries no scripts: it only signals the runners to begin.
            starter:
              image: "{{`{{workflow.parameters.starterImage}}`}}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
            # The initializer runs `k6 archive`, so it needs the same scenarios at the same path as
            # the runners. It gets no env: K6_PRESET is resolved at run time, and an unknown preset
            # should fail in the runner with the list the image actually ships.
            initializer:
              image: "{{`{{workflow.parameters.runnerImage}}`}}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              volumes:
                - name: scripts
                  image:
                    reference: "{{`{{workflow.parameters.scriptsRef}}`}}"
                    pullPolicy: "{{`{{workflow.parameters.scriptsPullPolicy}}`}}"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
            runner:
              image: "{{`{{workflow.parameters.runnerImage}}`}}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              env: {{`{{workflow.parameters.runnerEnv}}`}}
              volumes:
                - name: scripts
                  image:
                    reference: "{{`{{workflow.parameters.scriptsRef}}`}}"
                    pullPolicy: "{{`{{workflow.parameters.scriptsPullPolicy}}`}}"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
{{- end }}
