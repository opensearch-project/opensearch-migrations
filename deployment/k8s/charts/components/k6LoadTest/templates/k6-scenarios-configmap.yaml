# The scenario code + data (files/k6/scripts/*) as a flat ConfigMap. The tree was flattened to a
# single directory with unique filenames, so keys are plain filenames (no "/") and the ConfigMap
# mounts directly at /scripts — no `items` projection needed. Total size is well under 1 MiB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scenarios
  namespace: {{ .Release.Namespace }}
  labels:
    app: k6-load-test
data:
{{- range $path, $bytes := .Files.Glob "files/k6/scripts/*" }}
  {{ base $path }}: |-
{{ $bytes | toString | indent 4 }}
{{- end }}
