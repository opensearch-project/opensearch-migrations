# k6 load-test component. Installed separately from any migration (opt-in), so a normal
# migrationAssistant deployment contains no operator, scenarios, RBAC, or CLI capability.

# A run pulls TWO images: the stock k6 runtime, and a data-only image carrying the load test.
# Neither the operator nor this chart holds any scenario content.

# Runner image — grafana/k6, unmodified, used as both spec.initializer.image and
# spec.runner.image. Being an upstream artifact it goes through the normal mirroring path
# (infra/mirror/k6-ecr-manifest.yaml on EKS). For local setup, point it at a mirror, e.g.
# --set image.repository=mirror.gcr.io/grafana/k6
image:
  repository: grafana/k6
  tag: "latest"
  pullPolicy: IfNotPresent

# Scripts image — migrations/k6_scripts, a `FROM scratch` data image built from
# TrafficCapture/trafficLoadTest, mounted read-only at /scripts on the initializer and every runner
# via a Kubernetes `image:` volume (the same mechanism as the migration's mountable transforms; it
# is why this chart requires k8s >= 1.35). It holds the scenarios, libs, document schemas and the
# k6-config presets — the ONLY place that content lives, so editing a scenario or preset means
# rebuilding and pushing this image, not a helm upgrade.
#
# It is NOT a released artifact (load testing is a dev/test capability, so it is not published
# publicly and not mirrored by aws-bootstrap.sh) — build and push it yourself (~25 KB), then point
# this at wherever it landed:
#   local minikube:  --set scriptsImage.repository=localhost:5001/migrations/k6_scripts
#   ECR (one repo, per-image tags):
#                    --set scriptsImage.repository=<acct>.dkr.ecr.<region>.amazonaws.com/<repo> \
#                    --set scriptsImage.tag=migrations_k6_scripts_latest
#
# `digest` pins the exact content and WINS over `tag` when set (repository@sha256:...), which is the
# reproducible way to reference it — a moving tag otherwise leaves the content up to each node's
# pull policy:
#   --set scriptsImage.digest=sha256:<hex>
scriptsImage:
  repository: migrations/k6_scripts
  tag: "latest"
  digest: ""
  pullPolicy: IfNotPresent

# k6-operator subchart — installs the TestRun CRD + controller. Disable to install the operator
# out-of-band and use only this chart's ConfigMaps/RBAC.
k6Operator:
  enabled: true

# Values passed to the k6-operator subchart (keyed by its chart name). We install into an existing
# namespace (the migration's), so namespace creation is disabled to avoid ownership conflicts.
k6-operator:
  namespace:
    create: false

# TestRun distribution defaults baked into the k6-testrun-examples ConfigMap. `parallelism` splits
# each scenario's load across that many runner pods (the operator shards the script's executors).
# `separate: true` is the operator's shorthand for REQUIRED node anti-affinity — it forces the runner
# pods onto distinct nodes. Only meaningful when parallelism > 1, and it needs at least `parallelism`
# schedulable nodes or the surplus pods stay Pending forever — so keep it false on single-node
# clusters (e.g. local minikube).
# `cleanup: post` makes the operator tear down the WHOLE run once it finishes — the runner/
# initializer/starter pods AND the TestRun CR itself (it logs "Cleaning up all resources" and deletes
# the object; metrics already shipped to Grafana persist). Left EMPTY by default: the CR is deleted
# near-instantly on completion, which races the `stage=finished` polling that `run_test.sh`,
# `workflow loadtest run --wait`, and the Test0050 integ test rely on — they'd see the CR vanish and time
# out. Set to "post" only for fire-and-forget runs you never wait on. Only "post" is valid non-empty.
testRun:
  parallelism: 1
  separate: false
  cleanup: ""

# Redis + Webdis sidecars, required only by the mixed (write-then-read) and chaos scenarios.
# Off by default; those scenarios degrade gracefully to flat searches when absent.
registry:
  enabled: false

# Grafana dashboard auto-import (via the kube-prometheus-stack Grafana sidecar). Harmless if that
# stack is absent — the ConfigMap simply isn't picked up.
dashboard:
  enabled: true

# ServiceAccount of the migration-console pod that submits TestRuns. This chart grants it RBAC on
# testruns.k6.io, so the `workflow loadtest` CLI is only functional once this chart is installed.
console:
  serviceAccountName: migration-console-access-role
