# k6 load-test component. Installed separately from any migration (opt-in), so a normal
# migrationAssistant deployment contains no operator, scenarios, RBAC, or CLI capability.

# A run pulls one load-test-only image containing the pinned k6 executable, its compiled extensions,
# and all scenarios under /scripts. The Dockerfile owns the k6 and extension versions.
#
# `digest` pins exact content and wins over `tag`.
image:
  repository: migrations/k6_runner
  tag: "latest"
  digest: ""
  pullPolicy: IfNotPresent

# Starter image — a tiny one-shot pod the operator runs to release the runners simultaneously once
# they are all up. It is the operator's own image, so its version must track the controller, which
# the subchart pins at `controller-v1.5.0`.
#
# The operator otherwise defaults this to the FLOATING `latest-starter` tag, which today resolves to
# `starter-v1.6.0` — a v1.6.0 starter driving a v1.5.0 controller. Pinning it here keeps the pair in
# step. Bump this and the subchart version together.
starterImage:
  repository: ghcr.io/grafana/k6-operator
  tag: "starter-v1.5.0"

# k6-operator subchart — installs the TestRun CRD + controller. Disable to install the operator
# out-of-band and use only this chart's ConfigMaps/RBAC.
k6Operator:
  enabled: true

# Values passed to the k6-operator subchart (keyed by its chart name). We install into an existing
# namespace (the migration's), so namespace creation is disabled to avoid ownership conflicts.
k6-operator:
  namespace:
    create: false

# TestRun distribution defaults, rendered as parameter defaults on every k6-<profile>
# WorkflowTemplate. `parallelism` splits each run's load across that many runner pods (the
# operator shards the script's executors). `useSeparatePodPerTestInstance` is this chart's clearer
# name for the operator's `separate` field, which the workflow parameter and the TestRun CR keep:
# it is the shorthand for REQUIRED node anti-affinity — it forces the runner pods onto distinct
# nodes when true. Only meaningful when
# parallelism > 1, and it needs at least `parallelism` schedulable nodes or the surplus pods stay
# Pending forever — so keep it false on single-node clusters (e.g. local minikube).
#
# There is no `cleanup` knob: the workflow owns its TestRun, so deleting the workflow takes the CR
# and its pods with it. The operator's own `cleanup: post` is deliberately not used — it deletes the
# CR the instant it finishes, which would race the workflow's own wait on that same status.
testRun:
  parallelism: 1
  useSeparatePodPerTestInstance: false

# Where a run aims its traffic. This is deployment topology — the proxy's service name and namespace
# — not a load profile, so it belongs to the chart rather than to the k6-config/*.env presets, which
# describe only the shape of the load. Keeping it here means pointing runs at a differently named
# proxy is a `helm install` flag instead of a rebuild of the migrations/k6_runner image.
#
# Precedence: `loadtest run --target` / `-p CAPTURE_PROXY_URL=` beats this per run, and this is the
# default of the CAPTURE_PROXY_URL parameter on every rendered WorkflowTemplate.
captureProxyUrl: https://capture-proxy:9201

# Optional Secret imported into every runner with envFrom. The default deliberately names a
# normally-absent Secret and is optional in the pod spec, so unauthenticated runs are unchanged.
# A caller with credentials creates a per-run Secret and overrides authSecretName; keeping secret
# values out of Workflow parameters prevents them from being exposed in Argo/TestRun objects.
authSecretName: k6-load-test-auth

# ---------------------------------------------------------------------------
# Scenario knobs and load profiles.
# ---------------------------------------------------------------------------
# Together these render the WorkflowTemplates: one per profile, each stating EVERY setting its
# scenario reads as a named Argo parameter with a value. There is no defaults layer under it and
# none over it — what the template says is what the run gets:
#
#   kubectl get workflowtemplate k6-ingest-burst -o yaml     # the whole configuration of that run
#   argo submit --from workflowtemplate/k6-ingest-burst -p INGEST_RATE=80
#
# A parameter that a submission does not pass keeps the value below. `K6_PRESET` is NOT set on this
# path: lib/config.js still reads k6-config/*.env, but only for a local `k6 run`, never in-cluster.
#
# `scenarios.<name>.env` states every key that scenario (and the libs it imports) reads, at the same
# value as the script's own `CFG.X || 'default'` fallback. A unit test fails if the two disagree, or
# if a scenario reads a key that is not listed here.
#
# `profiles.<name>.env` then lists ONLY what that profile changes, which keeps the load shape
# readable. The rendered template is fully resolved either way. Each profile mirrors the
# k6-config/<name>.env file of the same name; a unit test fails if they drift.
#
# A profile ADDS to its scenario block; it can never blank a value out. `EXECUTOR` decides which
# timing knob exists, so neither `DURATION` nor a stage list is scenario-wide — each profile states
# the one it uses. That is not only tidier: a knob the profile does not state cannot be overridden,
# so `--duration 30s` on a ramping profile is refused instead of silently changing nothing.
# (It is also the only shape that renders correctly. Helm's `merge` fills in an empty destination
# value from the source, so a profile stating `DURATION: ""` would get the scenario's value written
# back over it, silently. A unit test fails if any profile blanks a value its scenario states.)
#
# Values are always strings. A value must not contain a single quote — the templates substitute
# parameters into single-quoted YAML scalars, so one would break the manifest. Helm fails the render
# with a named key if it finds one.
scenarios:
  ingest:
    env:
      SCHEMA: nyc_taxis                  # document set: nyc_taxis | logs_data
      INDEX_NAME: ""                     # blank = same as SCHEMA
      INGEST_RATE: "50"                  # arrival rate (req/s), constant-arrival-rate only
      INGEST_VUS: "20"                   # pre-allocated VUs; each holds one keep-alive connection
      INGEST_MAX_VUS: "100"
      EXECUTOR: constant-arrival-rate    # decides the timing knob: DURATION, or a stage list
      BULK_BATCH_SIZE: "20"              # documents per _bulk call
      BULK_FRACTION: "0.70"              # share of iterations that send _bulk
      SEQUENCE_FRACTION: "0.15"          # share that run create→update→query→delete
      CONNECTION_MODE: pinned            # pinned (keep-alive) | spread (Connection: close)
      NO_CONNECTION_REUSE: "false"
      CONTROL_ENABLED: "false"           # chaos control bus (needs registry.enabled=true)
      CONTROL_CMD_KEY: control_cmd
      VALKEY_URL: redis://valkey:6379    # read by the control bus only
      AUTH_MODE: ""                      # blank = infer Basic/SigV4 credentials, else none
      AUTH_USERNAME: ""                  # per-run input — never give these a value here
      AUTH_PASSWORD: ""
      LATENCY_THRESHOLDS_ENABLED: "true" # false keeps request-error thresholds only
  search:
    env:
      SCHEMA: nyc_taxis
      INDEX_NAME: ""
      SEARCH_RATE: "50"
      SEARCH_VUS: "30"
      SEARCH_MAX_VUS: "150"
      EXECUTOR: constant-arrival-rate    # decides the timing knob: DURATION, or a stage list
      SEARCH_FLAT_FRACTION: "0.60"       # the query mix; the remainder runs deep paging
      SEARCH_AGG_FRACTION: "0.20"
      SEARCH_UPDATE_FRACTION: "0.10"
      SEARCH_WRITE_FRACTION: "0.05"
      DEEP_PAGING_ENABLED: "false"
      PAGING_MODE: scroll                # scroll | search_after
      SCROLL_PAGES: "3"
      SEARCH_AFTER_PAGES: "3"
      CONNECTION_MODE: pinned
      NO_CONNECTION_REUSE: "false"
      AUTH_MODE: ""
      AUTH_USERNAME: ""
      AUTH_PASSWORD: ""
  mixed:
    env:
      SCHEMA: nyc_taxis
      INDEX_NAME: ""
      INGEST_RATE: "30"                  # the two streams have independent rates and VU pools
      INGEST_VUS: "15"
      INGEST_MAX_VUS: "75"
      SEARCH_RATE: "20"
      SEARCH_VUS: "15"
      SEARCH_MAX_VUS: "75"
      EXECUTOR: constant-arrival-rate    # decides the timing knob: DURATION, or a stage list
      BULK_BATCH_SIZE: "20"
      BULK_FRACTION: "0.70"
      SEQUENCE_FRACTION: "0.15"
      SEARCH_FLAT_FRACTION: "0.60"
      SEARCH_AGG_FRACTION: "0.20"
      SEARCH_UPDATE_FRACTION: "0.10"
      CONSISTENCY_FRACTION: "0.10"       # share of searches that read back a just-written doc ID
      CONNECTION_MODE: pinned            # pinned (keep-alive) | spread (Connection: close)
      NO_CONNECTION_REUSE: "false"
      REGISTRY_ENABLED: "false"          # the Valkey ID ring that connects the two streams
      REGISTRY_KEY: recent_ids
      REGISTRY_CAP: "1000"
      MIN_RING_FILL: "0"                 # delay the search stream until the ring holds this many IDs
      VALKEY_URL: redis://valkey:6379
      CONTROL_ENABLED: "false"
      CONTROL_CMD_KEY: control_cmd
      AUTH_MODE: ""
      AUTH_USERNAME: ""
      AUTH_PASSWORD: ""

profiles:
  # ── ingest ────────────────────────────────────────────────────────────────
  ingest-steady:
    scenario: ingest
    description: Steady ingest — holds 50 req/s at the proxy for 5m.
    env:
      DURATION: 5m
  ingest-ramp:
    scenario: ingest
    description: Ingest 0→150 req/s over 2m, hold 3m, down 1m (6m total).
    env:
      EXECUTOR: ramping-arrival-rate
      RAMP_STAGES: '[{"duration":"2m","target":150},{"duration":"3m","target":150},{"duration":"1m","target":0}]'
      # A ramp needs more VU headroom than a constant rate: k6 must start VUs ahead of the curve
      # or it drops iterations.
      INGEST_VUS: "50"
      INGEST_MAX_VUS: "200"
  ingest-burst:
    scenario: ingest
    description: Ingest baseline 20 req/s, spike to 200 for 1m, recover (4m30s total).
    env:
      EXECUTOR: ramping-arrival-rate
      RAMP_STAGES: '[{"duration":"1m","target":20},{"duration":"30s","target":200},{"duration":"30s","target":200},{"duration":"30s","target":20},{"duration":"2m","target":20}]'
      INGEST_VUS: "60"
      INGEST_MAX_VUS: "250"

  # ── search ────────────────────────────────────────────────────────────────
  search-steady:
    scenario: search
    description: Steady search — holds 50 req/s at the proxy for 5m.
    env:
      DURATION: 5m
  search-deep-paging:
    scenario: search
    description: Search with scroll/search_after sequences on; lower rate, costlier iterations.
    env:
      DURATION: 5m
      SEARCH_RATE: "20"
      SEARCH_VUS: "20"
      SEARCH_MAX_VUS: "80"
      DEEP_PAGING_ENABLED: "true"
      SCROLL_PAGES: "5"
      SEARCH_AFTER_PAGES: "5"
  search-ramp:
    scenario: search
    description: Search 0→150 req/s over 2m, hold 3m, down 1m (6m total).
    env:
      EXECUTOR: ramping-arrival-rate
      RAMP_STAGES: '[{"duration":"2m","target":150},{"duration":"3m","target":150},{"duration":"1m","target":0}]'
      SEARCH_VUS: "50"
      SEARCH_MAX_VUS: "200"
  search-burst:
    scenario: search
    description: Search baseline 20 req/s, spike to 150 for 1m, recover (4m30s total).
    env:
      EXECUTOR: ramping-arrival-rate
      RAMP_STAGES: '[{"duration":"1m","target":20},{"duration":"30s","target":150},{"duration":"30s","target":150},{"duration":"30s","target":20},{"duration":"2m","target":20}]'
      SEARCH_VUS: "60"
      SEARCH_MAX_VUS: "200"

  # ── mixed ─────────────────────────────────────────────────────────────────
  # Every mixed profile turns the ID ring on, so it needs registry.enabled=true (Valkey).
  mixed-steady:
    scenario: mixed
    description: Concurrent ingest (30 req/s) and search (20 req/s) for 5m, with consistency reads.
    env:
      DURATION: 5m
      REGISTRY_ENABLED: "true"
  mixed-ramp:
    scenario: mixed
    description: Ingest 0→80 and search 0→50 req/s over 2m, hold 3m, down 1m (6m total).
    env:
      EXECUTOR: ramping-arrival-rate
      INGEST_RAMP_STAGES: '[{"duration":"2m","target":80},{"duration":"3m","target":80},{"duration":"1m","target":0}]'
      SEARCH_RAMP_STAGES: '[{"duration":"2m","target":50},{"duration":"3m","target":50},{"duration":"1m","target":0}]'
      INGEST_VUS: "30"
      INGEST_MAX_VUS: "150"
      SEARCH_VUS: "20"
      SEARCH_MAX_VUS: "100"
      REGISTRY_ENABLED: "true"
      # The ring fills during the ingest ramp-up. Hold the search stream back until it has ~50 IDs,
      # or the consistency reads miss for the first seconds of the run.
      MIN_RING_FILL: "50"
  mixed-burst:
    scenario: mixed
    description: Both streams spike together — ingest 20→150, search 15→100 (4m30s total).
    env:
      EXECUTOR: ramping-arrival-rate
      INGEST_RAMP_STAGES: '[{"duration":"1m","target":20},{"duration":"30s","target":150},{"duration":"30s","target":150},{"duration":"30s","target":20},{"duration":"2m","target":20}]'
      SEARCH_RAMP_STAGES: '[{"duration":"1m","target":15},{"duration":"30s","target":100},{"duration":"30s","target":100},{"duration":"30s","target":15},{"duration":"2m","target":15}]'
      INGEST_VUS: "60"
      INGEST_MAX_VUS: "250"
      SEARCH_VUS: "40"
      SEARCH_MAX_VUS: "150"
      REGISTRY_ENABLED: "true"
      MIN_RING_FILL: "50"

# k6's own output knobs, stated as parameters on every template so a run can turn metrics off or
# aim them elsewhere. These are k6 flags, not scenario configuration.
k6Output:
  K6_OUT: opentelemetry
  K6_OTEL_GRPC_EXPORTER_ENDPOINT: otel-collector:4317
  K6_OTEL_GRPC_EXPORTER_INSECURE: "true"

# Valkey is required only by the mixed write-then-read registry and chaos control bus. It is off by
# default; mixed runs degrade to flat searches when the registry is disabled or unavailable.
registry:
  enabled: false
  image:
    repository: valkey/valkey
    tag: 8.1.9-alpine
    pullPolicy: IfNotPresent

# Grafana dashboard auto-import (via the kube-prometheus-stack Grafana sidecar). Harmless if that
# stack is absent — the ConfigMap simply isn't picked up.
dashboard:
  enabled: true

# ServiceAccount of the migration-console pod that submits TestRuns. This chart grants it RBAC on
# testruns.k6.io, so the `loadtest` CLI is only functional once this chart is installed.
console:
  serviceAccountName: migration-console-access-role

# A run is an Argo Workflow that creates a TestRun and waits for the k6-operator to finish it, so the
# workflow's ServiceAccount needs the same RBAC on testruns.k6.io that the console has. Argo comes
# from the migrationAssistant chart, which creates these accounts; `extra` lists any further ones to
# bind (for example a per-environment executor).
workflow:
  serviceAccountName: argo-workflow-executor
  extraServiceAccountNames:
    - argo-test-workflow-executor
  # Upper bound on a single run, counted from TestRun creation. It only fires when the run never
  # reaches a terminal stage — for example runner pods stuck on an image pull — so keep it well above
  # the longest load test you expect.
  activeDeadlineSeconds: 7200
