# k6 load-test component. Installed separately from any migration (opt-in), so a normal
# migrationAssistant deployment contains no operator, scenarios, RBAC, or CLI capability.

# A run pulls TWO images: the stock k6 runtime, and a data-only image carrying the load test.
# Neither the operator nor this chart holds any scenario content.

# Runner image — grafana/k6, unmodified, used as both spec.initializer.image and
# spec.runner.image.
#
# `tag` is THE place the k6 version is pinned: it becomes the `runnerImage` parameter default on
# every WorkflowTemplate, so a run uses it unless a caller overrides it explicitly. Callers that
# need a different registry (a mirror, a private ECR) should override `image.repository` ONLY and
# leave the tag alone — otherwise the version is decided in several places at once and drifts.
# Upgrading k6 is a one-line change here.
#
# `repository` defaults to the Docker Hub name. Point it at a mirror when Docker Hub is rate-limited
# or unreachable — the tags are identical, so the pin still applies:
#   --set image.repository=mirror.gcr.io/grafana/k6
image:
  repository: grafana/k6
  tag: "2.2.0"
  pullPolicy: IfNotPresent

# Scripts image — migrations/k6_scripts, a `FROM scratch` data image built from
# TrafficCapture/trafficLoadTest, mounted read-only at /scripts on the initializer and every runner
# via a Kubernetes `image:` volume (the same mechanism as the migration's mountable transforms; it
# is why this chart requires k8s >= 1.35). It holds the scenarios, libs, document schemas and the
# k6-config presets — the ONLY place that content lives, so editing a scenario or preset means
# rebuilding and pushing this image, not a helm upgrade.
#
# It is NOT a released artifact (load testing is a dev/test capability, so it is not published
# publicly and not mirrored by aws-bootstrap.sh) — build and push it yourself (~25 KB), then point
# this at wherever it landed:
#   local minikube:  --set scriptsImage.repository=localhost:5001/migrations/k6_scripts
#   ECR (one repo, per-image tags):
#                    --set scriptsImage.repository=<acct>.dkr.ecr.<region>.amazonaws.com/<repo> \
#                    --set scriptsImage.tag=migrations_k6_scripts_latest
#
# `digest` pins the exact content and WINS over `tag` when set (repository@sha256:...), which is the
# reproducible way to reference it — a moving tag otherwise leaves the content up to each node's
# pull policy:
#   --set scriptsImage.digest=sha256:<hex>
scriptsImage:
  repository: migrations/k6_scripts
  tag: "latest"
  digest: ""
  pullPolicy: IfNotPresent

# Starter image — a tiny one-shot pod the operator runs to release the runners simultaneously once
# they are all up. It is the operator's own image, so its version must track the controller, which
# the subchart pins at `controller-v1.5.0`.
#
# The operator otherwise defaults this to the FLOATING `latest-starter` tag, which today resolves to
# `starter-v1.6.0` — a v1.6.0 starter driving a v1.5.0 controller. Pinning it here keeps the pair in
# step. Bump this and the subchart version together.
starterImage:
  repository: ghcr.io/grafana/k6-operator
  tag: "starter-v1.5.0"

# k6-operator subchart — installs the TestRun CRD + controller. Disable to install the operator
# out-of-band and use only this chart's ConfigMaps/RBAC.
k6Operator:
  enabled: true

# Values passed to the k6-operator subchart (keyed by its chart name). We install into an existing
# namespace (the migration's), so namespace creation is disabled to avoid ownership conflicts.
k6-operator:
  namespace:
    create: false

# TestRun distribution defaults, rendered as parameter defaults on every k6-<scenario>
# WorkflowTemplate. `parallelism` splits each scenario's load across that many runner pods (the
# operator shards the script's executors). `separate: true` is the operator's shorthand for REQUIRED
# node anti-affinity — it forces the runner pods onto distinct nodes. Only meaningful when
# parallelism > 1, and it needs at least `parallelism` schedulable nodes or the surplus pods stay
# Pending forever — so keep it false on single-node clusters (e.g. local minikube).
#
# There is no `cleanup` knob: the workflow owns its TestRun, so deleting the workflow takes the CR
# and its pods with it. The operator's own `cleanup: post` is deliberately not used — it deletes the
# CR the instant it finishes, which would race the workflow's own wait on that same status.
testRun:
  parallelism: 1
  separate: false

# Redis + Webdis sidecars, required only by the mixed (write-then-read) and chaos scenarios.
# Off by default; those scenarios degrade gracefully to flat searches when absent.
registry:
  enabled: false

# Grafana dashboard auto-import (via the kube-prometheus-stack Grafana sidecar). Harmless if that
# stack is absent — the ConfigMap simply isn't picked up.
dashboard:
  enabled: true

# ServiceAccount of the migration-console pod that submits TestRuns. This chart grants it RBAC on
# testruns.k6.io, so the `workflow loadtest` CLI is only functional once this chart is installed.
console:
  serviceAccountName: migration-console-access-role

# A run is an Argo Workflow that creates a TestRun and waits for the k6-operator to finish it, so the
# workflow's ServiceAccount needs the same RBAC on testruns.k6.io that the console has. Argo comes
# from the migrationAssistant chart, which creates these accounts; `extra` lists any further ones to
# bind (for example a per-environment executor).
workflow:
  serviceAccountName: argo-workflow-executor
  extraServiceAccountNames:
    - argo-test-workflow-executor
  # Upper bound on a single run, counted from TestRun creation. It only fires when the run never
  # reaches a terminal stage — for example runner pods stuck on an image pull — so keep it well above
  # the longest load test you expect.
  activeDeadlineSeconds: 7200
