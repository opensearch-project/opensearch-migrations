apiVersion: v2
name: k6-load-test
description: >-
  Standalone k6 load-testing component. Installs the k6-operator and stores the
  load-test scenarios as ConfigMaps so runs are submitted as TestRun CRs. This chart
  is intentionally NOT a dependency of any migration aggregate — it is an opt-in,
  separately-installed component so a normal migration deployment contains no k6.
version: 0.1.0
type: application
appVersion: "latest"

dependencies:
  - name: k6-operator
    version: "4.5.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: k6Operator.enabled
