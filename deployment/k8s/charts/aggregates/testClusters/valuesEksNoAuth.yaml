# No-auth preset for testClusters on EKS. Layer this AFTER valuesEks.yaml:
#
#   helm upgrade --install tc . -n ma -f values.yaml -f valuesEks.yaml -f valuesEksNoAuth.yaml
#
# The ES source's nginx front end then serves plain HTTP on 9200 with no authentication, and the
# OS target's security plugin is disabled, so clients use `curl http://<service>:9200/...` with no
# -u and no -k.

nginxFrontend:
  basicAuth:
    enabled: false
  tls:
    enabled: false

source:
  protocol: http
  # Restarts the pod when switching to or from this overlay (see valuesEks.yaml).
  podAnnotations:
    testclusters/nginx-frontend: plain

target:
  # opensearch-project/opensearch 2.32.0 chart
  securityConfig:
    enabled: false
  config:
    opensearch.yml: |
      cluster.name: opensearch-cluster
      network.host: 0.0.0.0
      plugins.security.disabled: true
