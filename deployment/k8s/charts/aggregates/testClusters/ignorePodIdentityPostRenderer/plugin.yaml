# Helm 4 post-renderer plugin wrapping patchElasticsearchEntrypointToIgnorePodIdentity.py.
# Helm 4's --post-renderer takes an installed plugin's name rather than an executable path:
#   helm plugin install deployment/k8s/charts/aggregates/testClusters/ignorePodIdentityPostRenderer
#   helm upgrade --install ... --post-renderer ignore-pod-identity
# Helm 3 takes the script path directly:
#   helm upgrade --install ... --post-renderer .../ignorePodIdentityPostRenderer/patchElasticsearchEntrypointToIgnorePodIdentity.py
apiVersion: v1
type: postrenderer/v1
name: ignore-pod-identity
version: 0.1.0
runtime: subprocess
runtimeConfig:
  platformCommand:
    - command: ${HELM_PLUGIN_DIR}/patchElasticsearchEntrypointToIgnorePodIdentity.py
