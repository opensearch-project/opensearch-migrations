# k6 load-test WorkflowTemplate (superseded by the TS builder we will add later).
# Applied verbatim by the k6-apply-workflowtemplate Job — this file is NOT rendered
# by Helm, so it uses Argo's own {{...}} substitution syntax directly.
#
# A run is specified by two names baked into the migrations/k6 image: `scenario` (script at
# /scripts/scenarios/<scenario>.js) and `configName` (env file at /scripts/k6-config/<configName>.env).
# Every value in the preset is overridable per run — named params (rate/duration/vus, default empty
# = "keep the preset value") plus a generic newline-separated KEY=VALUE `overrides` bag applied last.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: k6-load-test
  labels:
    app: k6-load-test
spec:
  serviceAccountName: argo-workflow-executor
  parallelism: 100
  entrypoint: run
  arguments:
    parameters:
      - name: scenario
        value: ingest              # ingest | search | mixed
      - name: configName
        value: ingest-steady       # any k6-config/*.env preset (without the .env suffix)
      - name: targetUrl
        value: ""                  # REQUIRED: Capture Proxy endpoint, e.g. https://<proxy>.ma.svc.cluster.local:9200
      # Named convenience overrides (empty = keep the preset's value)
      - name: rate
        value: ""
      - name: duration
        value: ""
      - name: vus
        value: ""
      # Opt-in features. Empty = keep the preset's value (mixed presets already set REGISTRY_ENABLED
      # and WEBDIS_URL); set true/false or a URL to force.
      - name: registryEnabled
        value: ""                  # true → mixed/consistency ring buffer (needs k6.registry.enabled)
      - name: controlEnabled
        value: ""                  # true → chaos pause/resume/set-rate control bus
      - name: webdisUrl
        value: ""                  # e.g. http://webdis:7379
      # Generic override bag: one KEY=VALUE per line, applied after the preset (wins).
      - name: overrides
        value: ""
      # Extra flags appended to `k6 run` (e.g. "--no-thresholds" for burst/chaos runs).
      - name: extraArgs
        value: ""
      # Image is read from the migration-image-config ConfigMap (kept in sync with the chart images).
      - name: k6Image
        valueFrom:
          configMapKeyRef:
            name: migration-image-config
            key: k6Image
      - name: k6PullPolicy
        valueFrom:
          configMapKeyRef:
            name: migration-image-config
            key: k6PullPolicy
  templates:
    - name: run
      metadata:
        labels:
          app: k6-load-test
      container:
        image: "{{workflow.parameters.k6Image}}"
        imagePullPolicy: "{{workflow.parameters.k6PullPolicy}}"
        # grafana/k6's default ENTRYPOINT is ["k6"]; override with a small POSIX-sh wrapper that
        # sources the preset, applies overrides in precedence order, then execs k6.
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            CFG="/scripts/k6-config/${CONFIG_NAME}.env"
            set -a
            # 1. baked-in preset = defaults (the preset files set CAPTURE_PROXY_URL / WEBDIS_URL / etc.)
            if [ -f "$CFG" ]; then . "$CFG"; else echo "no such config: $CFG" >&2; exit 2; fi
            # 2. named convenience overrides (empty = keep the preset)
            [ -n "${DURATION_OVERRIDE:-}" ] && DURATION="$DURATION_OVERRIDE"
            [ -n "${RATE_OVERRIDE:-}" ]     && { INGEST_RATE="$RATE_OVERRIDE"; SEARCH_RATE="$RATE_OVERRIDE"; }
            [ -n "${VUS_OVERRIDE:-}" ]      && { INGEST_VUS="$VUS_OVERRIDE"; SEARCH_VUS="$VUS_OVERRIDE"; }
            # 3. dedicated params (empty = keep the preset). Applied AFTER sourcing so they win —
            #    the preset files themselves set CAPTURE_PROXY_URL, so these must come after `. $CFG`.
            [ -n "${TARGET_URL:-}" ]             && CAPTURE_PROXY_URL="$TARGET_URL"
            [ -n "${WEBDIS_URL_PARAM:-}" ]       && WEBDIS_URL="$WEBDIS_URL_PARAM"
            [ -n "${REGISTRY_ENABLED_PARAM:-}" ] && REGISTRY_ENABLED="$REGISTRY_ENABLED_PARAM"
            [ -n "${CONTROL_ENABLED_PARAM:-}" ]  && CONTROL_ENABLED="$CONTROL_ENABLED_PARAM"
            # 4. generic override bag (one KEY=VALUE per line) — applied last, so it wins over all.
            #    Here-doc (not a pipe) keeps the loop in this shell so exports persist to exec.
            while IFS= read -r kv; do
              [ -n "$kv" ] && export "$kv"
            done <<OVR
            ${OVERRIDES}
            OVR
            set +a
            echo "k6: script=${SCRIPT_NAME} config=${CONFIG_NAME} target=${CAPTURE_PROXY_URL:-<unset>}"
            exec k6 run --out=opentelemetry ${EXTRA_ARGS} "/scripts/scenarios/${SCRIPT_NAME}.js"
        env:
          # Metrics: OTLP gRPC to the existing otel-collector DaemonSet Service (same namespace).
          - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
            value: "otel-collector:4317"
          - name: K6_OTEL_GRPC_EXPORTER_INSECURE
            value: "true"
          # Script selection (SCRIPT_NAME, NOT SCENARIO — the scripts read __ENV.SCENARIO for the
          # document type nyc_taxis|logs_data, a different axis).
          - name: SCRIPT_NAME
            value: "{{workflow.parameters.scenario}}"
          - name: CONFIG_NAME
            value: "{{workflow.parameters.configName}}"
          # Dedicated param inputs (consumed post-source under their real names, so *_PARAM/TARGET_URL
          # here avoid being clobbered by the preset during `. $CFG`).
          - name: TARGET_URL
            value: "{{workflow.parameters.targetUrl}}"
          # Named convenience overrides
          - name: RATE_OVERRIDE
            value: "{{workflow.parameters.rate}}"
          - name: DURATION_OVERRIDE
            value: "{{workflow.parameters.duration}}"
          - name: VUS_OVERRIDE
            value: "{{workflow.parameters.vus}}"
          # Generic bag + extra k6 flags
          - name: OVERRIDES
            value: "{{workflow.parameters.overrides}}"
          - name: EXTRA_ARGS
            value: "{{workflow.parameters.extraArgs}}"
          # Opt-in features (mixed / chaos)
          - name: REGISTRY_ENABLED_PARAM
            value: "{{workflow.parameters.registryEnabled}}"
          - name: CONTROL_ENABLED_PARAM
            value: "{{workflow.parameters.controlEnabled}}"
          - name: WEBDIS_URL_PARAM
            value: "{{workflow.parameters.webdisUrl}}"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi
      retryStrategy:
        limit: "0"                 # a k6 threshold breach is a finding, not a transient error
