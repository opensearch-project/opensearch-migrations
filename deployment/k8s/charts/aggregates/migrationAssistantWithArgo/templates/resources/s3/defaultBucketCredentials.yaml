{{- if or (eq .Values.cloudProvider "aws") (eq .Values.cloudProvider "") }}
{{- if .Values.defaultBucketConfiguration.useLocalStack }}
---
# LocalStack takes any credentials, but botocore won't sign without some, so console pods that
# read the default bucket directly need these. Created only under LocalStack; on real AWS the
# Secret is absent, consumers reference it optionally, and the pod's own credentials apply.
apiVersion: v1
kind: Secret
metadata:
  name: migrations-default-s3-creds
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
type: Opaque
stringData:
  accessKey: "test"
  secretKey: "test"
{{- end }}
{{- end }}
