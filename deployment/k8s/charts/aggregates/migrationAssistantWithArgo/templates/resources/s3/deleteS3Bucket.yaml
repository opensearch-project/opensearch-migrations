{{- if and (or (eq .Values.cloudProvider "aws") (eq .Values.cloudProvider "")) .Values.defaultBucketConfiguration.deleteOnUninstall }}
apiVersion: batch/v1
kind: Job
metadata:
  name: delete-s3-bucket-{{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-delete
    # The runtime cleanup hook at weight -10 stops workflows and resets capture/replay
    # resources first. Empty the bucket only after writers can no longer add objects.
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # No ttlSecondsAfterFinished: the TTL controller deletes failed jobs too. Keep a failed
  # hook pod for debugging (kubectl logs); helm's hook-delete-policy above still cleans up
  # on success and before the next install/upgrade.
  backoffLimit: 1
  # Large capture buckets can contain millions of tuple objects. Batched deletes
  # reduce the request count substantially, but the hook still needs enough time
  # to finish before Helm tears down its credentials and network access.
  activeDeadlineSeconds: 14400
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailJob
        onExitCodes:
          containerName: aws-cli
          operator: NotIn
          values: [0]
  template:
    metadata:
      labels:
        app: s3-bucket-delete
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: {{ .Values.defaultBucketConfiguration.serviceAccountName }}
      restartPolicy: Never
      containers:
        - name: aws-cli
          image: {{ .Values.defaultBucketConfiguration.bucketOperationImage }}
          imagePullPolicy: {{ .Values.defaultBucketConfiguration.bucketOperationImagePullPolicy }}
          env:
            {{- if .Values.defaultBucketConfiguration.useLocalStack }}
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            {{- end }}
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: migrations-default-s3-config
                  key: AWS_REGION
            - name: S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: migrations-default-s3-config
                  key: ENDPOINT_HTTP
                  optional: true
            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: migrations-default-s3-config
                  key: BUCKET_NAME
          command:
            - /bin/sh
            - -c
            - |
              set -e
              {{- include "migration.retryFunctions" . | nindent 14 }}
              {{ include "migration.s3Functions" . | nindent 12 }}

              # Setting up variables
              EMPTY_BEFORE_DELETE={{ .Values.defaultBucketConfiguration.emptyBeforeDelete }}
              MAX_RETRIES=3
              RETRY_INTERVAL=5
              S3_ENDPOINT_FLAG=$(get_s3_endpoint_flag)

              if [ -n "${S3_ENDPOINT_URL}" ]; then
                echo "Using endpoint: $S3_ENDPOINT_URL"
              fi
              echo "Target bucket for deletion: $BUCKET_NAME"


              # Wait for S3 to be available
              retry_count=0
              while ! check_s3_available; do
                retry_count=$((retry_count + 1))
                if [ $retry_count -ge $MAX_RETRIES ]; then
                  echo "S3 endpoint not available after $MAX_RETRIES attempts. Exiting."
                  exit 1
                fi
                echo "S3 endpoint not available yet. Retrying in $RETRY_INTERVAL seconds... (Attempt $retry_count/$MAX_RETRIES)"
                sleep $RETRY_INTERVAL
              done

              echo "S3 endpoint is available. Proceeding with bucket operations."

              # Delete S3 bucket (if it exists) and contents (if enabled)
              if bucket_exists "$BUCKET_NAME"; then
                echo "Bucket $BUCKET_NAME exists."

                if [ "${EMPTY_BEFORE_DELETE}" = "true" ]; then
                  echo "The defaultBucketConfiguration.emptyBeforeDelete value is enabled. Deleting all contents of $BUCKET_NAME..."

                  delete_objects_in_batches() {
                    LIST_OPERATION="$1"
                    LIST_QUERY="$2"
                    CONTENT_DESCRIPTION="$3"
                    BATCH_FILE="/tmp/s3-delete-batch.json"
                    RESULT_FILE="/tmp/s3-delete-result.json"
                    BATCH_NUMBER=0
                    DELETED_COUNT=0

                    # Repeatedly list and remove the first page. S3 list operations
                    # are strongly consistent, so each successful batch advances
                    # toward an empty bucket without managing continuation tokens.
                    while true; do
                      if ! aws $S3_ENDPOINT_FLAG s3api "$LIST_OPERATION" \
                          --bucket "$BUCKET_NAME" \
                          --no-paginate \
                          --max-keys 1000 \
                          --query "$LIST_QUERY" \
                          --output json > "$BATCH_FILE"; then
                        echo "Failed to list $CONTENT_DESCRIPTION in $BUCKET_NAME." >&2
                        return 1
                      fi

                      BATCH_SIZE=$(grep -c '"Key":' "$BATCH_FILE" || true)
                      if [ "$BATCH_SIZE" -eq 0 ]; then
                        break
                      fi

                      BATCH_NUMBER=$((BATCH_NUMBER + 1))
                      if ! aws $S3_ENDPOINT_FLAG s3api delete-objects \
                          --bucket "$BUCKET_NAME" \
                          --delete "file://$BATCH_FILE" > "$RESULT_FILE"; then
                        echo "Failed to delete $CONTENT_DESCRIPTION batch $BATCH_NUMBER." >&2
                        return 1
                      fi

                      # DeleteObjects can return HTTP success while reporting
                      # individual key failures in the response body.
                      if grep -q '"Errors":' "$RESULT_FILE"; then
                        echo "S3 reported failures while deleting $CONTENT_DESCRIPTION:" >&2
                        cat "$RESULT_FILE" >&2
                        return 1
                      fi

                      DELETED_COUNT=$((DELETED_COUNT + BATCH_SIZE))
                      echo "Deleted $CONTENT_DESCRIPTION batch $BATCH_NUMBER ($BATCH_SIZE entries; $DELETED_COUNT total)."
                    done
                  }

                  empty_bucket() {
                    # Remove retained versions and delete markers first. Starting
                    # with current objects in a versioned bucket would create a
                    # new delete marker for every key and increase the cleanup
                    # work. Sweep current objects afterward for unversioned
                    # buckets and S3-compatible implementations.
                    delete_objects_in_batches \
                      list-object-versions \
                      '{Objects:[Versions[].{Key:Key,VersionId:VersionId},DeleteMarkers[].{Key:Key,VersionId:VersionId}][],Quiet:`true`}' \
                      "object versions and delete markers"
                    delete_objects_in_batches \
                      list-objects-v2 \
                      '{Objects:Contents[].{Key:Key},Quiet:`true`}' \
                      "current objects"
                  }
                  retry 2 5 "empty bucket $BUCKET_NAME" -- empty_bucket
                fi

                echo "Attempting to delete bucket $BUCKET_NAME..."
                delete_bucket() {
                  DELETE_OUTPUT=$(aws $S3_ENDPOINT_FLAG s3 rb s3://$BUCKET_NAME 2>&1)
                  rc=$?
                  if [ $rc -ne 0 ]; then
                    echo "$DELETE_OUTPUT" >&2
                  fi
                  return $rc
                }
                # Non-fatal: persistent failure (e.g. BucketNotEmpty) is diagnosed below.
                DELETE_STATUS=0
                retry 2 5 "delete bucket $BUCKET_NAME" -- delete_bucket || DELETE_STATUS=$?
                if [ $DELETE_STATUS -eq 0 ]; then
                  echo "Bucket $BUCKET_NAME deleted successfully."
                else
                  echo "Bucket deletion failed:"
                  echo "$DELETE_OUTPUT"

                  if echo "$DELETE_OUTPUT" | grep -q "BucketNotEmpty"; then
                    echo "Bucket $BUCKET_NAME is not empty."
                    if [ "${EMPTY_BEFORE_DELETE}" != "true" ]; then
                      echo "Tip: Set defaultBucketConfiguration.emptyBeforeDelete=true to force-delete all objects before bucket deletion."
                    fi
                  fi
                fi
              else
                echo "Bucket $BUCKET_NAME does not exist. Skipping deletion."
              fi
{{- end }}
