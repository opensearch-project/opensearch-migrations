          "description": "Hours for the 5-minute mean replay lag to reach the selected floor at the current 10-minute lag-reduction rate; 0 when lag is already at or below the floor. Gaps are intentional while lag is above the floor and not falling by more than 0.01 s/s. This is not a Kafka backlog drain time.",
