          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container=\"proxy\",container!=\"POD\",image!=\"\"}[$__rate_interval])) and on (pod) (kube_pod_status_ready{namespace=\"$namespace\",condition=\"true\"} == 1)",
