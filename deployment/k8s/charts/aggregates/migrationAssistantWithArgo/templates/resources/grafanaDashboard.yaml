{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: capture-replay-observability-dashboard
  labels:
    grafana_dashboard: "1"
data:
  capture-replay-observability.json: |
    {
      "id": null,
      "uid": "capture-replay-observability",
      "title": "Capture and Replay Observability",
      "tags": [
        "capture",
        "replay",
        "kubernetes"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "15s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "type": "text",
          "title": "",
          "gridPos": {
            "h": 2,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**How to read this dashboard.** Prometheus twin of the CloudWatch *capture-replay* dashboard, same layout. Rates are fleet totals per second. Gauges marked *fleet* are sums over per-process series (pod_uuid); *hottest pod* is the largest single process. Per-process series from restarted pods linger up to 5 minutes (exporter metric_expiration), so fleet gauge sums can briefly over-count after churn. Durations show the windowed mean; p95 lines come from buckets topped at 10 s. MiB = 1,048,576 bytes. AWS/ES domain and NLB panels are CloudWatch-only. Proxy panels are empty when the capture proxy is scaled to 0."
          },
          "id": 1
        },
        {
          "type": "stat",
          "title": "Captured requests/s",
          "description": "Fully parsed HTTP requests observed by the capture proxy, fleet total per second. Empty when the proxy is scaled to 0.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(fullRequest_count_total[$__rate_interval]))",
              "legendFormat": "Captured req/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 0,
            "y": 2
          },
          "options": {
            "graphMode": "area",
            "colorMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          },
          "id": 2
        },
        {
          "type": "stat",
          "title": "Replayed tuples/s",
          "description": "Source/target tuples compared by the replayers (tupleComparison), fleet total per second, including tuples whose source response is missing.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(tupleComparison_total[$__rate_interval]))",
              "legendFormat": "Replayed tuples/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 3,
            "y": 2
          },
          "options": {
            "graphMode": "area",
            "colorMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          },
          "id": 3
        },
        {
          "type": "stat",
          "title": "Mean replay lag (s)",
          "description": "Windowed mean of lagBetweenSourceAndTargetRequests (sum/count rates), in seconds.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[$__rate_interval])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[$__rate_interval])) / 1000",
              "legendFormat": "Mean lag (s)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 7,
            "y": 2
          },
          "options": {
            "graphMode": "area",
            "colorMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          },
          "id": 4
        },
        {
          "type": "stat",
          "title": "Catch-up ETA to floor (hours)",
          "description": "Hours for the 5-minute mean replay lag to reach the selected floor at the current lag-reduction rate; 0 when lag is already at or below it.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(((((sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[5m])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[5m])) / 1000) - ${catchup_floor_seconds:raw}) / 3600) / (-deriv((sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[5m])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[5m])) / 1000)[10m:1m]))) and on() ((sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[5m])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[5m])) / 1000) > ${catchup_floor_seconds:raw}) and on() (deriv((sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[5m])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[5m])) / 1000)[10m:1m]) < -0.01)) or on() (0 * (sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[5m])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[5m])) / 1000) and on() ((sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[5m])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[5m])) / 1000) <= ${catchup_floor_seconds:raw}))",
              "legendFormat": "Hours to floor (0 = caught up)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 10,
            "y": 2
          },
          "options": {
            "graphMode": "area",
            "colorMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          },
          "id": 5
        },
        {
          "type": "stat",
          "title": "Actual speedup (5 min)",
          "description": "1 minus the 10-minute derivative of the 5-minute mean replay lag. Above 1 means replay is gaining on real time; 1 is real time; below 1 means lag is growing.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - deriv((sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[5m])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[5m])) / 1000)[10m:1m])",
              "legendFormat": "Speedup"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 13,
            "y": 2
          },
          "options": {
            "graphMode": "area",
            "colorMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          },
          "id": 6
        },
        {
          "type": "stat",
          "title": "Status-code match %",
          "description": "Matching tuples divided by all tuples (including those without a source response), over the rate window.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(tupleComparison_total{statusCodesMatch=\"true\"}[$__rate_interval])) / sum(rate(tupleComparison_total[$__rate_interval]))",
              "legendFormat": "Match %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 16,
            "y": 2
          },
          "options": {
            "graphMode": "area",
            "colorMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          },
          "id": 7
        },
        {
          "type": "text",
          "title": "Target CPU / JVM pressure (max node %)",
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 20,
            "y": 2
          },
          "options": {
            "mode": "markdown",
            "content": "CloudWatch-only: AWS/ES `CPUUtilization` / `JVMMemoryPressure` for the target domain are not in Prometheus."
          },
          "id": 8
        },
        {
          "type": "row",
          "title": "End-to-end flow",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": [],
          "id": 9
        },
        {
          "type": "timeseries",
          "title": "Requests through the pipeline (per second)",
          "description": "Fleet-total per-second rates at each stage, from capture to tuple comparison.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(fullRequest_count_total[$__rate_interval]))",
              "legendFormat": "Proxy requests captured/s"
            },
            {
              "refId": "B",
              "expr": "sum(rate(capturePublishingRecordsAccepted_records_total[$__rate_interval]))",
              "legendFormat": "Proxy Kafka records published/s"
            },
            {
              "refId": "C",
              "expr": "sum(rate(kafkaSourceRecordsRead_records_total[$__rate_interval]))",
              "legendFormat": "Replayer Kafka records read/s"
            },
            {
              "refId": "D",
              "expr": "sum(rate(targetTransactionCount_total[$__rate_interval]))",
              "legendFormat": "Replayer target transactions/s"
            },
            {
              "refId": "E",
              "expr": "sum(rate(tupleComparison_total[$__rate_interval]))",
              "legendFormat": "Tuples compared/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 6
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 10
        },
        {
          "type": "timeseries",
          "title": "Bytes through the pipeline (MiB/s)",
          "description": "Application-observed bytes at each stage, MiB = 1,048,576 bytes. The CloudWatch version also plots the capture NLB's ProcessedBytes, which has no Prometheus source.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(bytesRead_bytes_total[$__rate_interval])) / 1048576",
              "legendFormat": "Proxy request bytes (client → proxy)"
            },
            {
              "refId": "B",
              "expr": "sum(rate(bytesWritten_bytes_total[$__rate_interval])) / 1048576",
              "legendFormat": "Proxy response bytes (proxy → client)"
            },
            {
              "refId": "C",
              "expr": "sum(rate(capturePublishingBytesAccepted_bytes_total[$__rate_interval])) / 1048576",
              "legendFormat": "Proxy → Kafka published"
            },
            {
              "refId": "D",
              "expr": "sum(rate(kafkaBytesRead_bytes_total[$__rate_interval])) / 1048576",
              "legendFormat": "Kafka → replayer read"
            },
            {
              "refId": "E",
              "expr": "sum(rate(bytesWrittenToTarget_bytes_total[$__rate_interval])) / 1048576",
              "legendFormat": "Replayer → target requests"
            },
            {
              "refId": "F",
              "expr": "sum(rate(bytesReadFromTarget_bytes_total[$__rate_interval])) / 1048576",
              "legendFormat": "Target → replayer responses"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: MiB/s",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 6
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 11
        },
        {
          "type": "timeseries",
          "title": "Replay lag, schedule slip and speedup",
          "description": "Windowed mean replay lag and schedule slip (histogram sum/count rates) with the selected catch-up floor; p95 lag from buckets. Percentiles come from histogram buckets whose highest finite bound is 30 s, or 1 h for lifetimes, lag and waits on a slow peer: once more than 5% of observations exceed that bound the p95 line pins there, so trust the mean above it. Right axis: 1 minus the 10-minute derivative of the 5-minute mean lag (speedup ×).",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[$__rate_interval])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[$__rate_interval])) / 1000",
              "legendFormat": "Mean replay lag (s)"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(lagBetweenSourceAndTargetRequests_milliseconds_bucket[$__rate_interval]))) / 1000",
              "legendFormat": "p95 replay lag (s)"
            },
            {
              "refId": "C",
              "expr": "sum(rate(scheduleLag_milliseconds_sum[$__rate_interval])) / sum(rate(scheduleLag_milliseconds_count[$__rate_interval])) / 1000",
              "legendFormat": "Mean schedule slip (s)"
            },
            {
              "refId": "D",
              "expr": "vector(${catchup_floor_seconds:raw})",
              "legendFormat": "Catch-up floor (s)"
            },
            {
              "refId": "E",
              "expr": "1 - deriv((sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_sum[5m])) / sum(rate(lagBetweenSourceAndTargetRequests_milliseconds_count[5m])) / 1000)[10m:1m])",
              "legendFormat": "Actual speedup (5 min)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Actual speedup (5 min)"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 12
        },
        {
          "type": "row",
          "title": "Throughput — Capture proxy | Kafka → replayer consumer | Replayer intake | Replayer → target",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "panels": [],
          "id": 13
        },
        {
          "type": "text",
          "title": "",
          "transparent": true,
          "gridPos": {
            "h": 1,
            "w": 6,
            "x": 0,
            "y": 14
          },
          "options": {
            "mode": "markdown",
            "content": "### Capture proxy"
          },
          "id": 14
        },
        {
          "type": "text",
          "title": "",
          "transparent": true,
          "gridPos": {
            "h": 1,
            "w": 6,
            "x": 6,
            "y": 14
          },
          "options": {
            "mode": "markdown",
            "content": "### Kafka → replayer consumer"
          },
          "id": 15
        },
        {
          "type": "text",
          "title": "",
          "transparent": true,
          "gridPos": {
            "h": 1,
            "w": 6,
            "x": 12,
            "y": 14
          },
          "options": {
            "mode": "markdown",
            "content": "### Replayer intake"
          },
          "id": 16
        },
        {
          "type": "text",
          "title": "",
          "transparent": true,
          "gridPos": {
            "h": 1,
            "w": 6,
            "x": 18,
            "y": 14
          },
          "options": {
            "mode": "markdown",
            "content": "### Replayer → target"
          },
          "id": 17
        },
        {
          "type": "timeseries",
          "title": "Proxy → Kafka publishing",
          "description": "Records accepted by the Kafka producer and acknowledged by Kafka, per second; right axis: records awaiting acknowledgement. Per-process series from restarted pods linger for up to the exporter's 5 minute metric_expiration, so fleet sums of gauges can briefly over-count after pod churn.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(capturePublishingRecordsAccepted_records_total[$__rate_interval]))",
              "legendFormat": "Records accepted/s"
            },
            {
              "refId": "B",
              "expr": "sum(rate(capturePublishingCompletions_records_total{outcome=\"acknowledged\"}[$__rate_interval]))",
              "legendFormat": "Acknowledged/s"
            },
            {
              "refId": "C",
              "expr": "sum(capturePublishingRecordsAwaitingAcknowledgement_records)",
              "legendFormat": "Records awaiting ack (fleet)"
            },
            {
              "refId": "D",
              "expr": "max(sum by (exported_instance) (capturePublishingRecordsAwaitingAcknowledgement_records))",
              "legendFormat": "Records awaiting ack (hottest pod)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Records awaiting ack (fleet)"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Records awaiting ack (hottest pod)"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 0,
            "y": 15
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 18
        },
        {
          "type": "timeseries",
          "title": "Replayer consumer: read vs committed (records/s)",
          "description": "Kafka records read and committed by the replayers, and commit resolutions by outcome, per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(kafkaSourceRecordsRead_records_total[$__rate_interval]))",
              "legendFormat": "Read/s"
            },
            {
              "refId": "B",
              "expr": "sum(rate(kafkaSourceRecordsCommitted_records_total[$__rate_interval]))",
              "legendFormat": "Committed/s"
            },
            {
              "refId": "C",
              "expr": "sum by (outcome) (rate(kafkaSourceCommitResolutions_events_total[$__rate_interval]))",
              "legendFormat": "Commit resolutions/s \u007b\u007boutcome\u007d\u007d"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 6,
            "y": 15
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 19
        },
        {
          "type": "timeseries",
          "title": "Source response framing (per second)",
          "description": "How captured source requests/responses were reconstituted and framed, per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(replayIntakeRequestsReconstituted_requests_total[$__rate_interval]))",
              "legendFormat": "Requests reconstituted"
            },
            {
              "refId": "B",
              "expr": "sum(rate(replayIntakeResponsesProvenComplete_responses_total[$__rate_interval]))",
              "legendFormat": "Responses proven complete"
            },
            {
              "refId": "C",
              "expr": "sum(rate(replayIntakeResponsesUnprovenComplete_responses_total[$__rate_interval]))",
              "legendFormat": "Responses unproven complete"
            },
            {
              "refId": "D",
              "expr": "sum by (incompleteReason) (rate(replayIntakeResponsesIncomplete_responses_total[$__rate_interval]))",
              "legendFormat": "Incomplete \u007b\u007bincompleteReason\u007d\u007d"
            },
            {
              "refId": "E",
              "expr": "sum(rate(replayIntakeSourceConnectionsExpired_connections_total[$__rate_interval]))",
              "legendFormat": "Source connections expired"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 12,
            "y": 15
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 20
        },
        {
          "type": "timeseries",
          "title": "Target connections",
          "description": "Open target connections (fleet total gauge); right axis: connection lifecycle events per second. Per-process series from restarted pods linger for up to the exporter's 5 minute metric_expiration, so fleet sums of gauges can briefly over-count after pod churn.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(activeTargetConnections)",
              "legendFormat": "Open target connections (fleet)"
            },
            {
              "refId": "B",
              "expr": "sum(rate(connectionsOpened_total[$__rate_interval]))",
              "legendFormat": "Opened/s"
            },
            {
              "refId": "C",
              "expr": "sum(rate(connectionsClosedCount_total[$__rate_interval]))",
              "legendFormat": "Closed/s"
            },
            {
              "refId": "D",
              "expr": "sum(rate(requestConnectingExceptionCount_total[$__rate_interval]))",
              "legendFormat": "Connect exceptions/s"
            },
            {
              "refId": "E",
