          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 114},
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Capture requests and active connections by proxy",
          "description": "Per-proxy parsed request rate and active frontside connections for currently ready pods. A newly ready pod with little traffic joined after long-lived NLB flows were assigned; a pod with many connections but little request completion is overloaded or slow to drain. Compare with proxy CPU. The NLB balances TCP flows, not HTTP request rate.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(sum by (exported_instance) (rate(fullRequest_count_total[$__rate_interval])), \"pod\", \"$1\", \"exported_instance\", \"([^_]+)_.*\") and on (pod) (kube_pod_status_ready{namespace=\"$namespace\",condition=\"true\"} == 1)",
              "legendFormat": "\u007b\u007bpod\u007d\u007d requests/s"
            },
            {
              "refId": "B",
              "expr": "label_replace(sum by (exported_instance) (activeConnection_count), \"pod\", \"$1\", \"exported_instance\", \"([^_]+)_.*\") and on (pod) (kube_pod_status_ready{namespace=\"$namespace\",condition=\"true\"} == 1)",
              "legendFormat": "\u007b\u007bpod\u007d\u007d connections"
            }
          ],
          "fieldConfig": {
            "defaults": {"min": 0},
            "overrides": [
