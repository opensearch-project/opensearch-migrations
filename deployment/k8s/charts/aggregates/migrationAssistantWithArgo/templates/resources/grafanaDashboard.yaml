            {"refId": "B", "expr": "sum by (resourceType) (resourceOwnedBuffers_buffers)", "legendFormat": "\u007b\u007bresourceType\u007d\u007d buffers"},
            {"refId": "C", "expr": "sum by (resourceType) (resourceOwnedBytes_bytes)", "legendFormat": "\u007b\u007bresourceType\u007d\u007d bytes"}
          ],
          "fieldConfig": {"defaults": {"min": 0}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 106}
