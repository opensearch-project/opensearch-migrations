          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {"refId": "A", "expr": "sum(increase({__name__=~\"replayFatalFailures_failures_total|replayIntakeCaptureProtocolViolations_violations_total|tupleDurabilityTerminalFailures_writes_total|resourceOwnershipInvariantFailures_failures_total\"}[15m]))", "legendFormat": "terminal events"}
          ],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 106}
        },
        {
          "type": "row",
