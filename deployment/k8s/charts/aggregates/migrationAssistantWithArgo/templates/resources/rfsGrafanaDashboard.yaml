        {
          "type": "text",
          "id": 18,
          "title": "",
          "transparent": true,
          "gridPos": {
            "h": 1,
            "w": 8,
            "x": 16,
            "y": 23
          },
          "options": {
            "mode": "markdown",
            "content": "### Request shape"
          }
        },
        {
          "type": "timeseries",
          "id": 19,
          "title": "Document and bulk request bytes (MiB/s)",
          "description": "Three different byte boundaries, shown as absolute rates. Migrated document source is the original document-source payload successfully advanced by the pipeline; it excludes bulk action metadata and NDJSON framing. Uncompressed bulk NDJSON is the assembled request body for every attempt, including metadata, framing, and retries. Bulk request body sent is that same body after optional compression. Compare the two request lines to see compression; compare document send/re-send rates above to separate retries from request overhead.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(max by (exported_instance) (rate(pipelineBytesMigrated_bytes_total{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) * 9.53674e-07) or vector(0)",
              "legendFormat": "Migrated document source",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "(sum(max by (exported_instance) (rate(bulkRequestBytes_bytes_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / 1048576) or vector(0)",
              "legendFormat": "Uncompressed bulk NDJSON",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "C",
              "expr": "(sum(max by (exported_instance) (rate(bulkRequestSentBytes_bytes_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / 1048576) or vector(0)",
              "legendFormat": "Bulk request body sent",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: MiB/s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 20,
          "title": "RFS CPU utilization (%)",
          "description": "Bulk-loader CPU usage divided by its configured CPU limit. This panel and RFS memory are vertically aligned under the request allowance panel so worker resource saturation can be compared with unused allowance. Both dashboards show the fleet's share of total configured CPU; Grafana also shows the hottest pod. CloudWatch cannot calculate the hottest pod because EKS aggregates CPU by node before export.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(max by (pod) (rate(container_cpu_usage_seconds_total{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"}[$__rate_interval]))) / sum((max by (pod) (container_spec_cpu_quota{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"})) / (max by (pod) (container_spec_cpu_period{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"})))",
              "legendFormat": "% (fleet capacity)",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "100 * max((max by (pod) (rate(container_cpu_usage_seconds_total{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"}[$__rate_interval]))) / ((max by (pod) (container_spec_cpu_quota{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"})) / (max by (pod) (container_spec_cpu_period{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"}))))",
              "legendFormat": "% (hottest pod)",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 21,
          "title": "Bulk request size",
          "description": "Mean documents per bulk request and mean KiB per request before and after compression. Falling request sizes can explain lower MiB/s even when request rate is steady; retries and batch splits can change the observed size.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (exported_instance) (rate(bulkRequestDocuments_count_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance) (rate(bulkRequestDocuments_count_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))",
              "legendFormat": "Documents per request",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "(sum(max by (exported_instance) (rate(bulkRequestBytes_bytes_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance) (rate(bulkRequestBytes_bytes_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1024",
              "legendFormat": "KiB per request (NDJSON)",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "C",
              "expr": "(sum(max by (exported_instance) (rate(bulkRequestSentBytes_bytes_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance) (rate(bulkRequestSentBytes_bytes_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1024",
              "legendFormat": "KiB per request (sent)",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 22,
          "title": "Shards completed (cumulative)",
          "description": "Work items (shards) completed since the beginning of the displayed time window. A process migrates one shard and records its duration once. Set the dashboard start before the run began to see progress from zero to the snapshot's total shard count.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(max by (exported_instance) (pipelineShardDuration_milliseconds_count{otel_scope_name=\"documentMigration\"}) unless max by (exported_instance) (pipelineShardDuration_milliseconds_count{otel_scope_name=\"documentMigration\"} offset 1m)) or vector(0)",
              "legendFormat": "Completed this minute",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 30
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "transformations": [
            {
              "id": "calculateField",
              "options": {
                "mode": "cumulativeFunctions",
                "cumulative": {
                  "reducer": "sum"
                },
                "replaceFields": true,
                "alias": "Shards completed"
              }
            }
          ],
          "interval": "1m"
        },
        {
          "type": "timeseries",
          "id": 23,
          "title": "RFS memory utilization (%)",
          "description": "Bulk-loader working-set memory divided by its configured memory limit: fleet capacity and hottest pod. It is vertically aligned with RFS CPU and the request allowance panel above.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(max by (pod) (container_memory_working_set_bytes{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"})) / sum(max by (pod) (container_spec_memory_limit_bytes{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"}))",
              "legendFormat": "% (fleet capacity)",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "100 * max((max by (pod) (container_memory_working_set_bytes{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"})) / (max by (pod) (container_spec_memory_limit_bytes{job=\"otel-collector\",exported_job=~\"cadvisor|kubelet-cadvisor\",namespace=\"$namespace\",container=\"bulk-loader\",container!=\"POD\",image!=\"\"})))",
              "legendFormat": "% (hottest pod)",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 30
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "id": 24,
          "title": "Retry and recovery",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "panels": [
            {
              "type": "timeseries",
              "id": 25,
              "title": "Delay between retries for each batch (s)",
              "description": "For each retrying batch, time from the end of its previous HTTP attempt until its next attempt was sent. This is per batch/retry chain, not per connection. It includes planned backoff and any later wait for retry capacity or a target-request slot. No line means no retries happened in the selected window. The panel shows the mean and p95.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(sum(max by (exported_instance) (rate(bulkAttemptGap_milliseconds_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance) (rate(bulkAttemptGap_milliseconds_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "Mean",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.95, sum by (le) (max by (exported_instance,le) (rate(bulkAttemptGap_milliseconds_bucket{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "p95",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 0,
                "y": 37
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 26,
              "title": "Target-unavailable document attempts per minute",
              "description": "Document attempts that could not be written because the target was unavailable, grouped by reason: a write block, unavailable shards, HTTP 503, or connection failure/reset. This does not include HTTP 429 throttles; correlate the overview's paused-document gauge with its limit-cut panel for those. A document is counted again on each attempt, so this is refusal volume rather than a distinct-document count.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (reason)(max by (exported_instance,reason) (rate(bulkDocsTargetUnavailable_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) * 60",
                  "legendFormat": "{{`{{reason}}`}}",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 8,
                "y": 37
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "suffix: /min",
                  "min": 0,
                  "custom": {
                    "stacking": {
                      "mode": "normal",
                      "group": "A"
                    },
                    "fillOpacity": 40
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 27,
              "title": "Bulk attempt duration (s)",
              "description": "Time from sending a bulk HTTP request until its response or transport error. The panel shows the mean, p50, and p99. Durations approaching the configured bulk response timeout indicate responses are arriving too slowly.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(sum(max by (exported_instance,outcome) (rate(bulkAttemptDuration_milliseconds_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance,outcome) (rate(bulkAttemptDuration_milliseconds_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "Mean",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.5, sum by (le) (max by (exported_instance,outcome,le) (rate(bulkAttemptDuration_milliseconds_bucket{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "p50",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "C",
                  "expr": "histogram_quantile(0.99, sum by (le) (max by (exported_instance,outcome,le) (rate(bulkAttemptDuration_milliseconds_bucket{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "p99",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 16,
                "y": 37
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 28,
              "title": "Batch completion time and oldest unfinished batch (s)",
              "description": "A batch is one request-sized group of documents followed through all of its retries. Mean completion time runs from the first attempt until the batch succeeds or gives up. Oldest unfinished is the highest age of any still-open batch in a worker. If the oldest rises while other batches complete, some early work may be starved.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(sum(max by (exported_instance) (rate(bulkBatchAge_milliseconds_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance) (rate(bulkBatchAge_milliseconds_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "Mean completion time",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "B",
                  "expr": "max((max by (exported_instance) (bulkOldestOpenBatchAge_milliseconds{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0)) / 1000",
                  "legendFormat": "Oldest unfinished (highest worker)",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 0,
                "y": 43
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 29,
              "title": "Retry budget tokens and exhaustion",
              "description": "Tokens remaining in each worker's shared retry budget (500 initially), shown for the lowest and highest worker. The right axis counts times retries had to wait because a worker ran out. A low minimum means at least one worker is seeing sustained failures even if the rest are healthy.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "min((max by (exported_instance) (retryBudgetTokens_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
                  "legendFormat": "Lowest worker",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "B",
                  "expr": "max((max by (exported_instance) (retryBudgetTokens_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
                  "legendFormat": "Highest worker",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "C",
                  "expr": "(sum(max by (exported_instance) (rate(retryBudgetEmpty_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) * 60) or vector(0)",
                  "legendFormat": "Ran out per minute",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 8,
                "y": 43
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "suffix: tokens",
                  "min": 0
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byFrameRefID",
                      "options": "C"
                    },
                    "properties": [
                      {
                        "id": "custom.axisPlacement",
                        "value": "right"
                      },
                      {
                        "id": "unit",
                        "value": "suffix: /min"
                      }
                    ]
                  }
                ]
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            }
          ]
        },
        {
          "type": "row",
          "id": 30,
          "title": "Failure diagnosis",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "panels": [
            {
              "type": "timeseries",
              "id": 31,
              "title": "Documents given up after retries (per minute)",
              "description": "Documents abandoned after repeated unknown status, no-response, or item failures. This explains the RETRYABLE_EXHAUSTED portion of the overview's manual-action graph. Throttling and temporary target unavailability do not give documents up by themselves.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (reason)(max by (exported_instance,reason) (rate(bulkDocsGaveUp_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) * 60",
                  "legendFormat": "{{`{{reason}}`}}",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 0,
                "y": 38
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "suffix: /min",
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 32,
              "title": "Item errors per second",
              "description": "Per-document errors returned inside otherwise successful bulk HTTP responses. Retried errors may reflect target state; terminal errors were attributed to the document and recorded for manual action.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (errorType)(max by (exported_instance,errorType,retryable) (rate(bulkItemErrors_count_total{otel_scope_name=\"documentMigration\",retryable=\"true\"}[$__rate_interval])))",
                  "legendFormat": "{{`{{errorType}}`}} (retried)",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "B",
                  "expr": "sum by (errorType)(max by (exported_instance,errorType,retryable) (rate(bulkItemErrors_count_total{otel_scope_name=\"documentMigration\",retryable=\"false\"}[$__rate_interval])))",
                  "legendFormat": "{{`{{errorType}}`}} (terminal)",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 8,
                "y": 38
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "suffix: errors/s",
                  "min": 0,
                  "custom": {
                    "stacking": {
                      "mode": "normal",
                      "group": "A"
                    },
                    "fillOpacity": 40
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            }
          ]
        },
        {
          "type": "row",
          "id": 33,
          "title": "Flow-control internals (expert)",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 38
          },
          "panels": [
            {
              "type": "timeseries",
              "id": 34,
              "title": "Target request detail: first vs retry by outcome",
              "description": "Every bulk HTTP attempt split by first attempt or retry and by the exact internal outcome. Use this after the grouped overview graph identifies a problem and the distinction between first attempts and retries matters.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (attempt,outcome)(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval])))",
                  "legendFormat": "{{`{{attempt}}`}} {{`{{outcome}}`}}",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 0,
                "y": 39
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "suffix: attempts/s",
                  "min": 0,
                  "custom": {
                    "stacking": {
                      "mode": "normal",
                      "group": "A"
                    },
                    "fillOpacity": 40
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 35,
              "title": "Adaptive limit by worker",
              "description": "Each worker's current adaptive target-concurrency limit. Workers sharing an overloaded target should move downward together; one low outlier can instead indicate a slow shard or a worker-local problem.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(max by (exported_instance) (bulkLimit_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0)",
                  "legendFormat": "{{`{{exported_instance}}`}}",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 8,
                "y": 39
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "suffix: connections",
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 36,
              "title": "Adaptive limit state",
              "description": "Mean and highest current worker limit plus the mean threshold separating fast initial growth from slower congestion-avoidance growth. Use the operator overview for configured ceiling, utilization bands, actual in-flight requests, and target-driven cuts.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "avg((max by (exported_instance) (bulkLimit_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
                  "legendFormat": "Mean worker",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "B",
                  "expr": "max((max by (exported_instance) (bulkLimit_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
                  "legendFormat": "Highest worker",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "C",
                  "expr": "avg((max by (exported_instance) (bulkLimitThreshold_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
                  "legendFormat": "Growth threshold (mean)",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 16,
                "y": 39
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "suffix: connections",
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 37,
              "title": "Limit growth and source bottlenecks",
              "description": "Quiet resets restore fast growth after five minutes without target throttling. Growth skipped counts successful requests that did not increase the limit because the worker did not fill its existing allowance, often because shard reading was slower than target writes. Time to full limit is how long a worker took to first reach its configured maximum; no line means none reached it.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(sum(max by (exported_instance) (rate(bulkLimitQuietResets_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) * 60) or vector(0)",
                  "legendFormat": "Quiet resets/min",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "B",
                  "expr": "(sum(max by (exported_instance) (rate(bulkLimitGrowthSkipped_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) or vector(0)",
                  "legendFormat": "Growth skipped/s",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "C",
                  "expr": "(sum(max by (exported_instance) (rate(bulkTimeToFullLimit_milliseconds_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance) (rate(bulkTimeToFullLimit_milliseconds_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "Time to full limit (s)",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 0,
                "y": 45
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byFrameRefID",
                      "options": "C"
                    },
                    "properties": [
                      {
                        "id": "custom.axisPlacement",
                        "value": "right"
                      },
                      {
                        "id": "unit",
                        "value": "s"
                      }
                    ]
                  }
                ]
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 38,
              "title": "Retry delay breakdown (expert)",
              "description": "Mean duration of the internal waits that can contribute to a batch's retry delay: planned backoff (including Retry-After), waiting for retry-budget capacity after widespread failures, and waiting for the worker's adaptive target-request slot. These are event means, not counts of waiting requests.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(sum(max by (exported_instance,errorClass) (rate(bulkRetryDelay_milliseconds_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance,errorClass) (rate(bulkRetryDelay_milliseconds_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "Planned backoff",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "B",
                  "expr": "(sum(max by (exported_instance) (rate(retryBudgetWait_milliseconds_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance) (rate(retryBudgetWait_milliseconds_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "Retry-budget wait",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                },
                {
                  "refId": "C",
                  "expr": "(sum(max by (exported_instance) (rate(bulkSlotWait_milliseconds_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) / sum(max by (exported_instance) (rate(bulkSlotWait_milliseconds_count{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) / 1000",
                  "legendFormat": "Target-slot wait",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 8,
                "y": 45
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "id": 39,
              "title": "Batches split per minute (expert)",
              "description": "Number of request batches divided into smaller batches: status and no_response use binary splitting to isolate repeatedly failing documents; too_large reduces a request the target rejected for size. The actual request sizes reaching the target are shown in Throughput and request shape.",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (reason)(max by (exported_instance,reason) (rate(bulkBatchSplits_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval]))) * 60",
                  "legendFormat": "{{`{{reason}}`}}",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  }
                }
              ],
              "gridPos": {
                "h": 6,
                "w": 8,
                "x": 16,
                "y": 45
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "suffix: /min",
                  "min": 0,
                  "custom": {
                    "stacking": {
                      "mode": "normal",
                      "group": "A"
                    },
                    "fillOpacity": 40
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            }
          ]
        }
      ]
    }
{{- end }}
