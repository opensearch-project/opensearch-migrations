{{- /* Generated by deployment/k8s/scripts/generate-rfs-dashboards.py; regenerate rather than edit. */}}
{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: reindex-from-snapshot-dashboard
  labels:
    grafana_dashboard: "1"
data:
  reindex-from-snapshot.json: |
    {
      "id": null,
      "uid": "reindex-from-snapshot",
      "title": "Reindex from Snapshot",
      "tags": [
        "rfs",
        "backfill",
        "kubernetes"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus"
          },
          {
            "name": "namespace",
            "type": "constant",
            "query": "ma",
            "hide": 2
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "iconColor": "red",
            "name": "RFS events",
            "target": {
              "type": "tags",
              "tags": [
                "rfs"
              ],
              "matchAny": true,
              "limit": 100
            }
          }
        ]
      },
      "panels": [
        {
          "type": "text",
          "title": "",
          "gridPos": {
            "h": 2,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**How to read this dashboard.** The first section is aligned into three vertical stories: migration results, worker capacity, and target feedback. Read across a row to explain a rate change, then down a column for detail. The second section shows throughput and request shape; later sections are diagnosis and controller internals. Rates are fleet totals unless marked otherwise. CloudWatch fleet gauges are one-minute averages, so worker counts can be fractional during transitions. The controls are specified in RFS/docs/BULK_TRAFFIC_CONTROL.md."
          }
        },
        {
          "type": "row",
          "id": 2,
          "title": "Operator overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 2
          },
          "panels": []
        },
        {
          "type": "text",
          "id": 3,
          "title": "",
          "transparent": true,
          "gridPos": {
            "h": 1,
            "w": 8,
            "x": 0,
            "y": 3
          },
          "options": {
            "mode": "markdown",
            "content": "### Migration results"
          }
        },
        {
          "type": "text",
          "id": 4,
          "title": "",
          "transparent": true,
          "gridPos": {
            "h": 1,
            "w": 8,
            "x": 8,
            "y": 3
          },
          "options": {
            "mode": "markdown",
            "content": "### Worker capacity"
          }
        },
        {
          "type": "text",
          "id": 5,
          "title": "",
          "transparent": true,
          "gridPos": {
            "h": 1,
            "w": 8,
            "x": 16,
            "y": 3
          },
          "options": {
            "mode": "markdown",
            "content": "### Target feedback"
          }
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "Documents migrated per second",
          "description": "Documents successfully written to the target, fleet total per second. A sustained drop matters only after comparing it with the worker-capacity and target-feedback panels in the same row.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(max by (exported_instance) (rate(pipelineDocsMigrated_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "Documents/s",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: docs/s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "Workers by phase",
          "description": "Number of RFS worker processes in each lifecycle phase. The stack is ordered from the first phase at the bottom to the last at the top: starting, acquiring work, downloading and unpacking a shard, migrating documents, then recording completion. Many downloading workers with few migrating workers points to snapshot download/extraction rather than the target. If most workers are migrating, use the utilization and target-feedback panels below to judge whether adding workers could help. Each process handles one work item and exits. Grafana may briefly overcount a terminated process until Prometheus marks its series stale.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (exported_instance) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"starting\"}))",
              "legendFormat": "Starting",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "sum(max by (exported_instance) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"acquiring_work\"}))",
              "legendFormat": "Acquiring work",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "C",
              "expr": "sum(max by (exported_instance) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"downloading_shard\"}))",
              "legendFormat": "Downloading shard",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "D",
              "expr": "sum(max by (exported_instance) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"migrating\"}))",
              "legendFormat": "Migrating",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "E",
              "expr": "sum(max by (exported_instance) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"completing\"}))",
              "legendFormat": "Completing",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "fillOpacity": 40
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "Target request outcomes (attempts/s)",
          "description": "Bulk HTTP requests per second, grouped into operator-facing outcomes. The stack is ordered with requests accepted on the first try at the bottom, then requests accepted after retry, item errors, target throttling, no response, and other errors. A growing upper portion means more request work is being repeated or rejected. The detailed first-versus-retry outcome matrix is in the expert section.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",attempt=\"first\",outcome=\"ok\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "Accepted first try",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "(sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",attempt=\"retry\",outcome=\"ok\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "Accepted after retry",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "C",
              "expr": "(sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"item_errors\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "Response had item errors",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "D",
              "expr": "(sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"throttled_429\"}[$__rate_interval]))) + sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"admission_rejected\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "Target throttled",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "E",
              "expr": "(sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"timeout\"}[$__rate_interval]))) + sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"connection_reset\"}[$__rate_interval]))) + sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"connect_failed\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "No response",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "F",
              "expr": "(sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"payload_413\"}[$__rate_interval]))) + sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"other_4xx\"}[$__rate_interval]))) + sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"5xx\"}[$__rate_interval]))) + sum(max by (exported_instance,attempt,outcome) (rate(bulkAttempts_count_total{otel_scope_name=\"documentMigration\",outcome=\"other_status\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "Other errors",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: attempts/s",
              "min": 0,
              "custom": {
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "fillOpacity": 40
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "Documents requiring manual action (per minute)",
          "description": "Documents that did not migrate and were recorded as terminal failures, by failure class. NON_RETRYABLE is a document/request problem that retrying cannot fix; RETRYABLE_EXHAUSTED was given up after its retry policy. These are the documents an operator must inspect and replay or correct. Target throttles and temporary unavailability do not appear here unless a document ultimately fails.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(max by (exported_instance,failureClass) (rate(bulkDocumentsFailed_count_total{otel_scope_name=\"documentMigration\",failureClass=\"NON_RETRYABLE\"}[$__rate_interval]))) * 60) or vector(0)",
              "legendFormat": "Cannot be retried",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "(sum(max by (exported_instance,failureClass) (rate(bulkDocumentsFailed_count_total{otel_scope_name=\"documentMigration\",failureClass=\"RETRYABLE_EXHAUSTED\"}[$__rate_interval]))) * 60) or vector(0)",
              "legendFormat": "Retries exhausted",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /min",
              "min": 0,
              "custom": {
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "fillOpacity": 40
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "Workers by connection-limit utilization",
          "description": "The number of workers in each band of current adaptive connection limit divided by that worker's configured maximum. The stack height is the number of workers reporting. A new process starts with a low allowance while downloading and ramps after migration begins, so most workers in low bands without limit cuts—especially alongside the Downloading phase—means shard turnover rather than target pushback. One low worker while the others are at 100% suggests a slow shard; most workers in low bands while cuts are occurring means adding workers is unlikely to help.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((max by (exported_instance) (bulkWorkersByLimitUtilization_count{otel_scope_name=\"documentMigration\",range=\"0-24%\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
              "legendFormat": "0–24%",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "sum((max by (exported_instance) (bulkWorkersByLimitUtilization_count{otel_scope_name=\"documentMigration\",range=\"25-49%\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
              "legendFormat": "25–49%",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "C",
              "expr": "sum((max by (exported_instance) (bulkWorkersByLimitUtilization_count{otel_scope_name=\"documentMigration\",range=\"50-74%\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
              "legendFormat": "50–74%",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "D",
              "expr": "sum((max by (exported_instance) (bulkWorkersByLimitUtilization_count{otel_scope_name=\"documentMigration\",range=\"75-99%\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
              "legendFormat": "75–99%",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "E",
              "expr": "sum((max by (exported_instance) (bulkWorkersByLimitUtilization_count{otel_scope_name=\"documentMigration\",range=\"100%\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
              "legendFormat": "100%",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "fillOpacity": 40
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "Adaptive-limit cuts per minute (fleet total)",
          "description": "The fleet-wide event count across all RFS worker processes, grouped by the feedback that caused each worker to reduce its allowed target concurrency: HTTP 429 (including request-level admission control), item-level admission rejection inside a successful bulk HTTP response, or response timeout. Workers independently probe upward again after cutting; under sustained target saturation, recurring cuts form an expected sawtooth and need not decay to zero. Correlate cuts with the adaptive allowance and utilization bands to see the size and breadth of target pushback.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(max by (exported_instance,signal) (rate(bulkLimitCuts_count_total{otel_scope_name=\"documentMigration\",signal=\"throttled_429\"}[$__rate_interval]))) * 60) or vector(0)",
              "legendFormat": "HTTP 429 / request rejected",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "(sum(max by (exported_instance,signal) (rate(bulkLimitCuts_count_total{otel_scope_name=\"documentMigration\",signal=\"admission_rejected\"}[$__rate_interval]))) * 60) or vector(0)",
              "legendFormat": "Item-level admission rejection",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "C",
              "expr": "(sum(max by (exported_instance,signal) (rate(bulkLimitCuts_count_total{otel_scope_name=\"documentMigration\",signal=\"timeout\"}[$__rate_interval]))) * 60) or vector(0)",
              "legendFormat": "Response timeout",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /min",
              "min": 0,
              "custom": {
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "fillOpacity": 40
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 12,
          "title": "Documents sent vs migrated per second",
          "description": "Documents included in bulk requests on every attempt, documents successfully migrated, and the subset sent again during retries. Sent can briefly lead migrated while requests are in flight. Sustained re-sends or a widening sent-versus-migrated gap means retries or failures are consuming target capacity.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(max by (exported_instance) (rate(bulkRequestDocuments_count_sum{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "Sent",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "(sum(max by (exported_instance) (rate(pipelineDocsMigrated_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "Migrated",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "C",
              "expr": "(sum(max by (exported_instance) (rate(bulkDocsResent_count_total{otel_scope_name=\"documentMigration\"}[$__rate_interval])))) or vector(0)",
              "legendFormat": "Re-sent",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: docs/s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 13,
          "title": "Requests in flight vs adaptive allowance",
          "description": "Fleet totals for bulk requests currently in flight, the workers' current adaptive allowances, their configured maximums, and requests waiting for an allowance slot. The configured maximum is only a ceiling, not a count of connections that RFS tries to keep open. An allowance grows only after a successful request that used its last available slot or had another request waiting. If in-flight work stays below the current allowance with no waiters, snapshot reading or request assembly is not producing enough concurrent work to justify growth, so raising the maximum will not help. Allowances well below the maximum while waiters and limit cuts are present instead show target backpressure.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((max by (exported_instance) (bulkInFlight_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
              "legendFormat": "Requests in flight",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "B",
              "expr": "sum((max by (exported_instance) (bulkLimit_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
              "legendFormat": "Current adaptive limit",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "C",
              "expr": "sum((max by (exported_instance) (bulkLimitMax_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
              "legendFormat": "Configured maximum",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "refId": "D",
              "expr": "sum((max by (exported_instance) (bulkSlotWaiters_count{otel_scope_name=\"documentMigration\"})) and on (exported_instance) (max by (exported_instance,phase) (rfsWorkerPhase_count{otel_scope_name=\"documentMigration\",phase=\"exited\"}) == 0))",
              "legendFormat": "Waiting for a limit slot",
              "datasource": {
                "type": "prometheus",
