{{- if index .Values.conditionalPackageInstalls "azurite" }}
{{- /*
  Azurite's published development account key (devstoreaccount1), not a secret. The migration
  tools read it through azureCredentialsSecretName (env AZURE_STORAGE_ACCOUNT_KEY). It carries
  only accountKey: a Secret with both accountKey and sasToken makes AzureRepo fail at runtime.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.azureStorageConfiguration.localCredentialsSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  accountKey: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
{{- end }}
