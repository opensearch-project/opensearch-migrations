{{- if or (index .Values.conditionalPackageInstalls "azurite") (eq .Values.cloudProvider "azure") }}
{{- $account := include "migration.azureAccountName" . }}
{{- $container := include "migration.azureContainerName" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: migrations-default-azure-config
  labels:
    workflows.argoproj.io/configmap-type: Parameter
data:
  AZURE_STORAGE_ACCOUNT: {{ $account | quote }}
  AZURE_CONTAINER_NAME: {{ $container | quote }}
  # Base URL without the account: the snapshot readers append /<account> themselves.
  ENDPOINT: {{ include "migration.azureBaseEndpoint" . | quote }}
  BUCKET_URI: {{ printf "azure://%s/%s" $account $container | quote }}
  # Present only because Argo v4 requires every configMapKeyRef key; see gcsSnapshotConfigMap.yaml.
  SNAPSHOT_ROLE_ARN: ""
  AWS_REGION: ""
{{- end }}
