{{- if and (eq .Values.cloudProvider "azure") .Values.azure.monitor.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-metadata
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1" # Make accessible earlier for charts that mount
data:
  TENANT_ID: {{ required "Missing required value: .Values.azure.monitor.tenantId" .Values.azure.monitor.tenantId | quote }}
  CLIENT_ID: {{ required "Missing required value: .Values.azure.monitor.clientId" .Values.azure.monitor.clientId | quote }}
  DCE_URL: {{ required "Missing required value: .Values.azure.monitor.dceUrl" .Values.azure.monitor.dceUrl | quote }}
  DCR_IMMUTABLE_ID: {{ required "Missing required value: .Values.azure.monitor.dcrImmutableId" .Values.azure.monitor.dcrImmutableId | quote }}
  TABLE_NAME: {{ required "Missing required value: .Values.azure.monitor.tableName" .Values.azure.monitor.tableName | quote }}
{{- end }}
