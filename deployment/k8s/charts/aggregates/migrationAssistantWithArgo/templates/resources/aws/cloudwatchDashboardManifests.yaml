{{- if get .Values.conditionalPackageInstalls "ack-cloudwatch-controller" }}
{{- $region := required "Missing required value: .Values.aws.region" .Values.aws.region }}
{{- $account := required "Missing required value: .Values.aws.account" (toString .Values.aws.account) }}
{{- $stage := required "Missing required value: .Values.stageName" .Values.stageName }}
# The Dashboard CRs the installer applies and the pre-delete cleanup deletes. They cannot be chart
# resources (the CRD arrives with the ACK child chart), and inlining them into the Jobs' shell scripts
# exceeds the 128 KiB limit on a single exec argument, so the Jobs mount them from this hook ConfigMap.
# It is created ahead of both Jobs; the release namespace deletion removes it after uninstall.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cloudwatch-dashboard-manifests
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-delete
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  dashboards.yaml: |
{{ include "cloudwatch.dashboardCRs" (dict "region" $region "account" $account "stage" $stage "root" $) | indent 4 }}
{{- end }}
