{{- define "cloudwatch.dashboardCRs" -}}
{{- $deletionPolicy := (index .root.Values.charts "ack-cloudwatch-controller").deletionPolicy | default "delete" -}}
apiVersion: cloudwatch.services.k8s.aws/v1alpha1
kind: Dashboard
metadata:
  name: ma-{{ .stage }}-{{ .region }}-capturereplay
  namespace: {{ .root.Release.Namespace }}
  annotations:
    services.k8s.aws/deletion-policy: {{ $deletionPolicy }}
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/adoption-fields: {{ dict "dashboardName" (printf "MA-%s-%s-CaptureReplay" .stage .region) | toJson | quote }}
spec:
  dashboardName: "MA-{{ .stage }}-{{ .region }}-CaptureReplay"
  {{- /* fromJson | toJson compacts the body: these CRs are inlined into installer Job scripts, and a single exec argument is limited to 128 KiB. */}}
  {{- /* The generator emits quoted placeholders where CloudWatch needs numbers, so the quotes are replaced too. */}}
  {{- $storage := .root.Values.kafkaObservability.storage }}
  {{- $body := .root.Files.Get "files/cloudwatch-dashboards/capture-replay-dashboard.json" }}
  {{- $body = $body | replace "placeholder-region" .region | replace "placeholder-stage" .stage | replace "placeholder-qualifier" .stage }}
  {{- $body = $body | replace "placeholder-cluster" .root.Values.aws.eksClusterName | replace "placeholder-namespace" .root.Release.Namespace }}
  {{- range $placeholder, $freePercent := dict "warning" $storage.warningFreePercent "critical" $storage.criticalFreePercent "inode" $storage.inodeFreePercent }}
  {{- $body = $body | replace (printf "\"placeholder-%s-utilization\"" $placeholder) (toString (sub 100 (int $freePercent))) }}
  {{- end }}
  dashboardBody: {{ $body | fromJson | toJson | toJson }}
---
apiVersion: cloudwatch.services.k8s.aws/v1alpha1
kind: Dashboard
metadata:
  name: ma-{{ .stage }}-{{ .region }}-reindexfromsnapshot
  namespace: {{ .root.Release.Namespace }}
  annotations:
    services.k8s.aws/deletion-policy: {{ $deletionPolicy }}
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/adoption-fields: {{ dict "dashboardName" (printf "MA-%s-%s-ReindexFromSnapshot" .stage .region) | toJson | quote }}
spec:
  dashboardName: "MA-{{ .stage }}-{{ .region }}-ReindexFromSnapshot"
  dashboardBody: {{ .root.Files.Get "files/cloudwatch-dashboards/reindex-from-snapshot-dashboard.json" | replace "placeholder-region" .region | replace "placeholder-account-id" .account | replace "placeholder-stage" .stage | replace "placeholder-qualifier" .stage | fromJson | toJson | toJson }}
{{- end -}}
