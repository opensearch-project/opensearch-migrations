{{- define "cloudwatch.dashboardCRs" -}}
{{- $deletionPolicy := (index .root.Values.charts "ack-cloudwatch-controller").deletionPolicy | default "delete" -}}
apiVersion: cloudwatch.services.k8s.aws/v1alpha1
kind: Dashboard
metadata:
  name: ma-{{ .stage }}-{{ .region }}-capturereplay
  namespace: {{ .root.Release.Namespace }}
  annotations:
    services.k8s.aws/deletion-policy: {{ $deletionPolicy }}
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/adoption-fields: {{ dict "dashboardName" (printf "MA-%s-%s-CaptureReplay" .stage .region) | toJson | quote }}
spec:
  dashboardName: "MA-{{ .stage }}-{{ .region }}-CaptureReplay"
  {{- /* fromJson | toJson compacts the body: these CRs are inlined into installer Job scripts, and a single exec argument is limited to 128 KiB. */}}
  {{- /* The generator emits quoted placeholders where CloudWatch needs numbers, so the quotes are replaced too. */}}
  {{- $storage := .root.Values.kafkaObservability.storage }}
  {{- $body := .root.Files.Get "files/cloudwatch-dashboards/capture-replay-dashboard.json" }}
  {{- $body = $body | replace "placeholder-region" .region | replace "placeholder-stage" .stage | replace "placeholder-qualifier" .stage }}
  {{- $body = $body | replace "placeholder-cluster" .root.Values.aws.eksClusterName | replace "placeholder-namespace" .root.Release.Namespace }}
  {{- range $placeholder, $freePercent := dict "warning" $storage.warningFreePercent "critical" $storage.criticalFreePercent "inode" $storage.inodeFreePercent }}
  {{- $body = $body | replace (printf "\"placeholder-%s-utilization\"" $placeholder) (toString (sub 100 (int $freePercent))) }}
  {{- end }}
  dashboardBody: {{ $body | fromJson | toJson | toJson }}
---
apiVersion: cloudwatch.services.k8s.aws/v1alpha1
kind: Dashboard
metadata:
  name: ma-{{ .stage }}-{{ .region }}-reindexfromsnapshot
  namespace: {{ .root.Release.Namespace }}
  annotations:
    services.k8s.aws/deletion-policy: {{ $deletionPolicy }}
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/adoption-fields: {{ dict "dashboardName" (printf "MA-%s-%s-ReindexFromSnapshot" .stage .region) | toJson | quote }}
spec:
  dashboardName: "MA-{{ .stage }}-{{ .region }}-ReindexFromSnapshot"
  dashboardBody: {{ .root.Files.Get "files/cloudwatch-dashboards/reindex-from-snapshot-dashboard.json" | replace "placeholder-region" .region | replace "placeholder-account-id" .account | replace "placeholder-stage" .stage | replace "placeholder-qualifier" .stage | fromJson | toJson | toJson }}
{{- if .root.Values.kafkaObservability.cloudWatchAlarms.enabled }}
---
{{ include "cloudwatch.kafkaPvcAlarm" (dict "root" .root "stage" .stage "region" .region "severity" "Warning" "threshold" .root.Values.kafkaObservability.storage.warningFreePercent) }}
---
{{ include "cloudwatch.kafkaPvcAlarm" (dict "root" .root "stage" .stage "region" .region "severity" "Critical" "threshold" .root.Values.kafkaObservability.storage.criticalFreePercent) }}
{{- end }}
{{- end -}}

{{- define "cloudwatch.kafkaPvcAlarm" -}}
{{- $deletionPolicy := (index .root.Values.charts "ack-cloudwatch-controller").deletionPolicy | default "delete" -}}
{{- $alarmName := printf "MA-%s-%s-KafkaPVC%s" .stage .region .severity -}}
apiVersion: cloudwatch.services.k8s.aws/v1alpha1
kind: MetricAlarm
metadata:
  name: ma-{{ .stage }}-{{ .region }}-kafkapvc-{{ lower .severity }}
  namespace: {{ .root.Release.Namespace }}
  annotations:
    services.k8s.aws/deletion-policy: {{ $deletionPolicy }}
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/adoption-fields: {{ dict "name" $alarmName | toJson | quote }}
spec:
  name: {{ $alarmName | quote }}
  alarmDescription: >-
    Minimum remaining free percentage across Migration Assistant-managed Kafka PVCs is below
    the configured {{ lower .severity }} threshold. The metric queries group by persistentvolumeclaim
    so new dual-role broker PVCs enter evaluation automatically.
  actionsEnabled: true
{{- with .root.Values.kafkaObservability.cloudWatchAlarms.snsActionArns }}
  alarmActions:
{{ toYaml . | indent 4 }}
{{- end }}
  comparisonOperator: LessThanThreshold
  threshold: {{ .threshold }}
  evaluationPeriods: 3
  datapointsToAlarm: 2
  treatMissingData: missing
  metrics:
    - id: available
      expression: >-
        SELECT MIN(kubelet_volume_stats_available_bytes)
        FROM SCHEMA("OpenSearchMigrations", EKSClusterName, qualifier, namespace, persistentvolumeclaim)
        WHERE EKSClusterName = '{{ .root.Values.aws.eksClusterName }}'
          AND qualifier = '{{ .stage }}'
          AND namespace = '{{ .root.Release.Namespace }}'
        GROUP BY persistentvolumeclaim
      period: 60
      returnData: false
    - id: capacity
      expression: >-
        SELECT MAX(kubelet_volume_stats_capacity_bytes)
        FROM SCHEMA("OpenSearchMigrations", EKSClusterName, qualifier, namespace, persistentvolumeclaim)
        WHERE EKSClusterName = '{{ .root.Values.aws.eksClusterName }}'
          AND qualifier = '{{ .stage }}'
          AND namespace = '{{ .root.Release.Namespace }}'
        GROUP BY persistentvolumeclaim
      period: 60
      returnData: false
    - id: freepct
      expression: 100 * available / capacity
      returnData: false
    - id: minimumfreepct
      expression: MIN(freepct)
      label: Minimum Kafka PVC free percentage
      returnData: true
{{- end -}}
