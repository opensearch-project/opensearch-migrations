{{- if .Values.cluster.useCustomKarpenterNodePool }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-work-pool
spec:
  weight: 100
  {{- with .Values.workloadsNodePool.limits }}
  limits:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: {{ .Values.aws.nodeClassName }}
      requirements:
        {{- if .Values.workloadsNodePool.capacityTypes }}
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ .Values.workloadsNodePool.capacityTypes | toJson }}
        {{- end }}
        {{- if .Values.workloadsNodePool.instanceCategories }}
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: {{ .Values.workloadsNodePool.instanceCategories | toJson }}
        {{- end }}
        {{- if .Values.workloadsNodePool.minInstanceGeneration }}
        - key: eks.amazonaws.com/instance-generation
          operator: Gte
          values: [{{ .Values.workloadsNodePool.minInstanceGeneration | quote }}]
        {{- end }}
        {{- if .Values.workloadsNodePool.architectures }}
        - key: kubernetes.io/arch
          operator: In
          values: {{ .Values.workloadsNodePool.architectures | toJson }}
        {{- end }}
        {{- if .Values.workloadsNodePool.instanceSizes }}
        - key: eks.amazonaws.com/instance-size
          operator: In
          values: {{ .Values.workloadsNodePool.instanceSizes | toJson }}
        {{- end }}
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
  {{- with .Values.workloadsNodePool.disruption }}
  disruption:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
