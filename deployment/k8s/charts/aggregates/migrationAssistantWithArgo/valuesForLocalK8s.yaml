# Development-specific values for local kubernetes environments
# For S3 local testing: cloudProvider=aws (default here) uses LocalStack
# For GCS local testing: overlay with cloudProvider=gcp and gcsBucketConfiguration.useLocalGcs=true

cloudProvider: aws

conditionalPackageInstalls:
  kyverno: true
  fake-gcs-server: true  # deploy fake-gcs-server; used when cloudProvider=gcp for local GCS testing

# Kyverno policy toggles (requires kyverno to be installed)
kyvernoPolicies:
  zeroResourceRequests: true
  mountLocalAwsCreds: false
  mountLocalAwsCredsPath: "~/.aws"

# GCS local testing — override cloudProvider=gcp to activate
gcsBucketConfiguration:
  create: false
  bucketName: "migration-test-bucket"
  useLocalGcs: true

# Override image pull policy for dev - always pull latest
images:
  captureProxy:
    repository: localhost:5000/migrations/capture_proxy
    pullPolicy: Always
  trafficReplayer:
    repository: localhost:5000/migrations/traffic_replayer
    pullPolicy: Always
  reindexFromSnapshot:
    repository: localhost:5000/migrations/reindex_from_snapshot
    pullPolicy: Always
  migrationConsole:
    repository: localhost:5000/migrations/migration_console
    pullPolicy: Always
  installer:
    repository: localhost:5000/migrations/migration_console
    pullPolicy: Always

# Kyverno chart configuration
charts:
  # Preserve local developer install speed for charts that previously did not
  # use helm --wait before installer.defaultWaitForInstallation became true.
  aws-privateca-issuer:
    waitForInstallation: false

  ack-acmpca-controller:
    waitForInstallation: false

  opentelemetry-operator:
    waitForInstallation: false

  cert-manager:
    values:
      replicaCount: 1
      podDisruptionBudget:
        enabled: false
      cainjector:
        replicaCount: 1
        podDisruptionBudget:
          enabled: false
      webhook:
        replicaCount: 1
        podDisruptionBudget:
          enabled: false

  kyverno:
    values:
      webhooksCleanup:
        image:
          registry: ""
          repository: localhost:5000/migrations/migration_console
          tag: latest


  localstack:
    waitForInstallation: false
    values:
      persistence:
        enabled: true

  strimzi-kafka-operator:
    waitForInstallation: false
    values:
      # Recommended baseline resources to ensure the JVM has enough heap for metadata
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"

  argo-workflows:
    waitForInstallation: false
    values:
      # LocalStack uses static credentials for S3 artifact storage
      useStaticCredentials: true
      artifactRepository:
        s3:
          insecure: true
          accessKeySecret:
            name: argo-artifact-s3-creds
            key: accessKey
          secretKeySecret:
            name: argo-artifact-s3-creds
            key: secretKey
      controller:
        replicas: 1
        pdb:
          enabled: false
      server:
        replicas: 1
        pdb:
          enabled: false

  fluent-bit:
    waitForInstallation: false
    values:
      # Each node's Fluent Bit writes to that node's own host directory instead of the shared
      # logs PVC (a ReadWriteOnce volume only one node's Fluent Bit could mount). kindTesting.sh
      # mounts a directory on this machine there for every node. Lists replace whole, so the
      # lua-scripts entries from values.yaml are repeated.
      extraVolumes:
        - name: logs-pv
          hostPath:
            path: /var/log/migrations
            type: DirectoryOrCreate
        - name: lua-scripts
          configMap:
            name: fluentbit-lua-scripts
      extraVolumeMounts:
        - name: logs-pv
          mountPath: /shared_logs
        - name: lua-scripts
          mountPath: /fluentbit/scripts
          readOnly: true

  kube-prometheus-stack:
    waitForInstallation: false

  grafana:
    waitForInstallation: false

  jaeger:
    waitForInstallation: false

# Logs go to each node's host directory (see fluent-bit above), not the shared logs PVC, and the
# console reads every node's logs from the nodes' shared parent directory.
logs:
  sharedLogsVolume:
    enabled: false
  hostLogsVolume:
    enabled: true
