conditionalPackageInstalls:
  localstack: false
  # EKS keeps the Prometheus stack but excludes optional tracing/UI add-ons by default.
  grafana: false
  jaeger: false
  aws-privateca-issuer: true     # pre-install on EKS; lightweight, idle without a PCA ARN
  ack-acmpca-controller: false   # opt-in only — creates real AWS PCA with cost implications
  ack-cloudwatch-controller: true

aws:
  configureAwsEksResources: true
  region: ""
  account: ""

cluster:
  dedicatedKarpenterNodePoolForMigrationConsole: true
  # When true, deploys a custom Karpenter NodePool (general-work-pool), configured by
  # workloadsNodePool in values.yaml (WhenEmpty consolidation), instead
  # of using the EKS Auto Mode general-purpose pool. Recommended for production stability.
  useCustomKarpenterNodePool: true

tracing:
  backend: xray
  env:
    - name: AWS_REGION
      valueFrom:
        configMapKeyRef:
          name: aws-metadata
          key: AWS_REGION


defaultBucketConfiguration:
  useLocalStack: false
  deleteOnUninstall: true
  emptyBeforeDelete: true
  endpoint: ""
  snapshotRoleArn: ""
  bucketOperationImagePullPolicy: "IfNotPresent"

