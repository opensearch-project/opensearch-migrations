metrics:
  env:
    - name: AWS_REGION
      valueFrom:
        configMapKeyRef:
          name: aws-metadata
          key: AWS_REGION
  collectorConfig: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      prometheus:
        config:
          scrape_configs:
            - job_name: 'cadvisor'
              scrape_interval: 5s
              scheme: https
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                # Only scrape the local node (important for DaemonSet)
                - source_labels: [__meta_kubernetes_node_name]
                  action: keep
                  regex: ${K8S_NODE_NAME}
                # Change path from /metrics to /metrics/cadvisor
                - target_label: __metrics_path__
                  replacement: /metrics/cadvisor
                # Keep node name as a label
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
    processors:
      batch:
        timeout: 10s
        send_batch_size: 8192
        send_batch_max_size: 10000
      cumulativetodelta:
      resource/metrics:
        attributes:
          - key: qualifier
            value: ${env:QUALIFIER}
            action: upsert
      resource/remove_default_attributes:
        attributes:
          - key: telemetry.sdk.name
            action: delete
          - key: telemetry.sdk.version
            action: delete
          - key: telemetry.sdk.language
            action: delete
          - key: service.name
            action: delete
          - key: service.instance.id
            action: delete
      # Fleet CPU for CloudWatch is summed per node before export: the EMF exporter drops datapoints that collide
      # on [container, namespace] in one batch, which two pods of one container on one node always do. Converting
      # to delta first keeps the sum correct when a pod's cumulative counter disappears or restarts.
      cumulativetodelta/cadvisor:
        include:
          metrics: [container_cpu_usage_seconds_total]
          match_type: strict
      metricstransform/cadvisor:
        transforms:
          - include: container_cpu_usage_seconds_total
            action: update
            operations:
              - action: aggregate_labels
                label_set: [container, namespace]
                aggregation_type: sum
      resource/remove_telemetry_sdk_attributes:
        attributes:
          - key: telemetry.sdk.name
            action: delete
          - key: telemetry.sdk.version
            action: delete
          - key: telemetry.sdk.language
            action: delete
    extensions:
      health_check:
        endpoint: :13133
    exporters:
      debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200
      awsemf/app:
        namespace: 'OpenSearchMigrations'
        dimension_rollup_option: NoDimensionRollup
        resource_to_telemetry_conversion:
          enabled: true
      awsemf/cadvisor:
        namespace: 'OpenSearchMigrations'
        dimension_rollup_option: NoDimensionRollup
        metric_declarations:
          - dimensions: [[container, namespace], [container, namespace, pod]]
            metric_name_selectors:
              - container_memory_working_set_bytes
          # Already summed to one point per node and container by metricstransform/cadvisor, so no pod dimension.
          - dimensions: [[container, namespace]]
            metric_name_selectors:
              - container_cpu_usage_seconds_total
          # Broker disk throughput, which on EKS is EBS throughput against each volume's provisioned limit.
          # Kept only for brokers, whose StatefulSet pod names are stable and bounded. Device is a dimension
          # because the exporter drops points that collide on the same dimensions in one batch.
          - dimensions: [[container, namespace, pod, device]]
            label_matchers:
              - label_names: [container]
                regex: '^kafka$'
            metric_name_selectors:
              - container_fs_writes_bytes_total
              - container_fs_reads_bytes_total
      prometheus:
        endpoint: "0.0.0.0:8889"
        send_timestamps: true
        metric_expiration: 5m
        enable_open_metrics: true
    service:
      extensions: [health_check]
      pipelines:
        metrics/app:
          receivers: [otlp]
          processors: [batch, resource/remove_default_attributes, resource/metrics, cumulativetodelta]
          exporters: [awsemf/app]
        metrics/app-prometheus:
          receivers: [otlp]
          processors: [batch, resource/remove_telemetry_sdk_attributes, resource/metrics]
          exporters: [prometheus]
        metrics/cadvisor:
          receivers: [prometheus]
          processors: [cumulativetodelta/cadvisor, metricstransform/cadvisor, batch]
          exporters: [awsemf/cadvisor]
        metrics/cadvisor-prometheus:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheus]

logs:
  sharedLogsVolume:
    enabled: false

charts:
  kube-prometheus-stack:
    values:
      grafana:
        enabled: false

  argo-workflows:
    values:
      artifactRepository:
        s3:
          useSDKCreds: true

  fluent-bit:
    values:
      env:
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: aws-metadata
              key: AWS_REGION
        - name: STAGE_NAME
          valueFrom:
            configMapKeyRef:
              name: aws-metadata
              key: STAGE_NAME

      config:
        # Change output destination to be CloudWatch
        outputs: |
          [OUTPUT]
              Name                cloudwatch_logs
              Match               fluentbit-*
              region              ${AWS_REGION}
              log_group_name      /migration-assistant-${STAGE_NAME}-${AWS_REGION}/logs
              log_stream_prefix   from-
              auto_create_group   true

      # Remove logs PVC mount for EKS deployment
      extraVolumes:
        - name: lua-scripts
          configMap:
            name: fluentbit-lua-scripts

      extraVolumeMounts:
        - name: lua-scripts
          mountPath: /fluentbit/scripts
          readOnly: true

  strimzi-kafka-operator:
    # Use EKS-specific node selectors or tolerations if you have dedicated infra
#    nodeSelector:
#    workload-type: "operator-control-plane"

    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"

    # Handle higher latency that might happen at greater scale
    env:
      - name: STRIMZI_OPERATION_TIMEOUT_MS
        value: "600000"  # This is for orchestration events, like syncing reconciling nodes
      - name: STRIMZI_FULL_RECONCILIATION_INTERVAL_MS
        value: "120000" # 2 minutes (slows down background chatter)
      - name: KUBERNETES_CLIENT_READ_TIMEOUT_MS
        value: "30000"  # Avoid timing out on heavy K8s API responses
