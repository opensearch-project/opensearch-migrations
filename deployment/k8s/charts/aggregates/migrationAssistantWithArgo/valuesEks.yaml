conditionalPackageInstalls:
  localstack: false
  # EKS keeps the Prometheus stack but excludes optional tracing/UI add-ons by default.
  grafana: false
  jaeger: false
  aws-privateca-issuer: true     # pre-install on EKS; lightweight, idle without a PCA ARN
  ack-acmpca-controller: false   # opt-in only — creates real AWS PCA with cost implications
  ack-cloudwatch-controller: true

aws:
  configureAwsEksResources: true
  region: ""
  account: ""
  eksClusterName: ""

# EKS Auto Mode labels every node with its zone and launches capacity in the zone a pod needs.
workloadsNodePool:
  zoneSpread: required

cluster:
  dedicatedKarpenterNodePoolForMigrationConsole: true
  # When true, deploys the custom Karpenter NodePools configured by workloadsNodePool
  # in values.yaml (isolated data-plane pools by default, with WhenEmpty consolidation), instead
  # of using the EKS Auto Mode general-purpose pool. Recommended for production stability.
  useCustomKarpenterNodePool: true

tracing:
  backend: xray
  env:
    - name: AWS_REGION
      valueFrom:
        configMapKeyRef:
          name: aws-metadata
          key: AWS_REGION


defaultBucketConfiguration:
  useLocalStack: false
  deleteOnUninstall: true
  emptyBeforeDelete: true
  endpoint: ""
  snapshotRoleArn: ""
  bucketOperationImagePullPolicy: "IfNotPresent"

# Useful for updating images while developing
#images:
#  captureProxy:
#    pullPolicy: Always
#  trafficReplayer:
#    pullPolicy: Always
#  reindexFromSnapshot:
#    pullPolicy: Always
#  migrationConsole:
#    pullPolicy: Always
#  installer:
#    pullPolicy: Always

metrics:
  env:
    - name: AWS_REGION
      valueFrom:
        configMapKeyRef:
          name: aws-metadata
          key: AWS_REGION
    - name: EKS_CLUSTER_NAME
      valueFrom:
        configMapKeyRef:
          name: aws-metadata
          key: EKS_CLUSTER_NAME
  collectorConfig: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          # OTLP/JSON over HTTP for emitters without a gRPC stack (the python fleet monitor
          # posts its per-sweep gauges here with plain requests).
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'cadvisor'
              scrape_interval: 5s
              scheme: https
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                # Only scrape the local node (important for DaemonSet)
                - source_labels: [__meta_kubernetes_node_name]
                  action: keep
                  regex: ${K8S_NODE_NAME}
                # Change path from /metrics to /metrics/cadvisor
                - target_label: __metrics_path__
                  replacement: /metrics/cadvisor
                # Keep node name as a label
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
              metric_relabel_configs:
                # RFS memory-tier workers carry their tier in the pod name (<session>-rfs-t<n>-<rs>-<pod>, from
                # getRfsTierDeploymentName; pinned by rfsTierPodNames.test.ts); RFS workers without memory scaling
                # are tier 0, matching the tier the workers report on their own metrics.
                - source_labels: [pod]
                  regex: '.*-rfs-t([0-9]+)-[a-z0-9]{1,10}-[a-z0-9]{5}'
                  target_label: tier
                  replacement: '$$1'  # $$ escapes the collector's own env-var expansion
                - source_labels: [container, tier]
                  regex: 'bulk-loader;'
                  target_label: tier
                  replacement: '0'
    # {{ if .Values.metrics.cloudWatch.enabled }}
      # CloudWatch-only scrape of kube-state-metrics for the RFS fleet: which bulk-loader containers are running,
      # and their configured limits. cAdvisor only sees containers that have started; kube-state-metrics also sees
      # pods still waiting for a node. It runs as one replica, so exactly one collector (the one on its node)
      # scrapes it.
      prometheus/ksm-cloudwatch:
        config:
          scrape_configs:
            - job_name: 'ksm-cloudwatch'
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: keep
                  regex: ${K8S_NODE_NAME}
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: kube-state-metrics
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http
              metric_relabel_configs:
                - source_labels: [container]
                  action: keep
                  regex: bulk-loader
                - source_labels: [__name__, resource]
                  action: keep
                  regex: 'kube_pod_container_status_running;|kube_pod_container_info;|kube_pod_container_resource_limits;(cpu|memory)'
                # RFS memory-tier workers carry their tier in the pod name (<session>-rfs-t<n>-<rs>-<pod>, from
                # getRfsTierDeploymentName; pinned by rfsTierPodNames.test.ts); RFS workers without memory scaling
                # are tier 0, matching the tier the workers report on their own metrics.
                - source_labels: [pod]
                  regex: '.*-rfs-t([0-9]+)-[a-z0-9]{1,10}-[a-z0-9]{5}'
                  target_label: tier
                  replacement: '$$1'  # $$ escapes the collector's own env-var expansion
                - source_labels: [container, tier]
                  regex: 'bulk-loader;'
                  target_label: tier
                  replacement: '0'

      # CloudWatch-only scrape of kubelet PVC statistics. Prometheus continues
      # to use kube-prometheus-stack's kubelet scrape and joins these series to
      # Strimzi PVC labels; CloudWatch has no Kubernetes label join, so the
      # current managed dual-role PVC naming contract is applied here.
      prometheus/kafka-pvc-cloudwatch:
        config:
          scrape_configs:
            - job_name: 'kafka-pvc-cloudwatch'
              scrape_interval: 60s
              scheme: https
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  action: keep
                  regex: ${K8S_NODE_NAME}
                - target_label: __metrics_path__
                  replacement: /metrics
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: keep
                  regex: ^kubelet_volume_stats_(available_bytes|capacity_bytes|inodes|inodes_free|health_status_abnormal)$
                - source_labels: [namespace]
                  action: keep
                  regex: ^{{ .Release.Namespace }}$
                - source_labels: [persistentvolumeclaim]
                  action: keep
                  regex: ^data(-[0-9]+)?-.+-dual-role-[0-9]+$
      # CloudWatch scrape of the bounded managed-Kafka JMX rules. Prometheus
      # continues to scrape the same endpoint through the broker PodMonitor.
      prometheus/kafka-broker-cloudwatch:
        config:
          scrape_configs:
            - job_name: 'kafka-broker-cloudwatch'
              scrape_interval: 60s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                # Each DaemonSet collector scrapes only Kafka brokers on its
                # own node so every endpoint is collected exactly once.
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: keep
                  regex: ${K8S_NODE_NAME}
                - source_labels: [__meta_kubernetes_namespace]
                  action: keep
                  regex: ^{{ .Release.Namespace }}$
                - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
                  action: keep
                  regex: ^Kafka$
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: ^tcp-prometheus$
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_label_strimzi_io_cluster]
                  target_label: kafka_cluster
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: keep
                  regex: ^kafka_(server_replicamanager_(under_replicated_partitions|isr_(expands|shrinks)_total)|controller_(offline_partitions_count|active_controller_count)|server_raft_current_(leader|epoch)|network_request_(errors_total|throttle_time_milliseconds)|server_request_handler_idle_ratio|jvm_(heap_(used|max)_bytes|gc_(collections_total|collection_time_milliseconds_total)|process_cpu_ratio|uptime_milliseconds))$
    # {{ end }}
    processors:
      batch:
        timeout: 10s
        send_batch_size: 8192
        send_batch_max_size: 10000
      resource/metrics:
        attributes:
          - key: qualifier
            value: ${env:QUALIFIER}
            action: upsert
    # {{ if .Values.metrics.cloudWatch.enabled }}
      cumulativetodelta:
      resource/kafka:
        attributes:
          - key: EKSClusterName
            value: ${env:EKS_CLUSTER_NAME}
            action: upsert
          - key: qualifier
            value: ${env:QUALIFIER}
            action: upsert
      resource/remove_default_attributes:
        attributes:
          - key: telemetry.sdk.name
            action: delete
          - key: telemetry.sdk.version
            action: delete
          - key: telemetry.sdk.language
            action: delete
          - key: service.name
            action: delete
          - key: service.instance.id
            action: delete
      # Fleet CPU for CloudWatch is summed per node before export: the EMF exporter drops datapoints that collide
      # on [container, namespace] in one batch, which two pods of one container on one node always do. Converting
      # to delta first keeps the sum correct when a pod's cumulative counter disappears or restarts.
      cumulativetodelta/cadvisor:
        include:
          metrics:
            - container_cpu_usage_seconds_total
            - container_cpu_cfs_periods_total
            - container_cpu_cfs_throttled_periods_total
            - container_cpu_cfs_throttled_seconds_total
          match_type: strict
      cumulativetodelta/kafka-broker:
        include:
          metrics:
            - kafka_server_replicamanager_isr_expands_total
            - kafka_server_replicamanager_isr_shrinks_total
            - kafka_network_request_errors_total
            - kafka_jvm_gc_collections_total
            - kafka_jvm_gc_collection_time_milliseconds_total
          match_type: strict
      metricstransform/cadvisor:
        transforms:
          # Per-tier copy for the RFS dashboards, taken before the update below rewrites the original.
          - include: container_cpu_usage_seconds_total
            action: insert
            new_name: container_cpu_usage_seconds_by_tier
            operations:
              - action: aggregate_labels
                label_set: [container, namespace, tier]
                aggregation_type: sum
          - include: container_cpu_usage_seconds_total
            action: update
            operations:
              - action: aggregate_labels
                label_set: [container, namespace]
                aggregation_type: sum
          # Node-summed throttling counters: exact [container, namespace] rows instead of a per-pod SEARCH,
          # which exceeds CloudWatch's per-graph metric limit once pods churn.
          - include: container_cpu_cfs_periods_total
            action: insert
            new_name: container_cpu_cfs_periods_total_sum
            operations:
              - action: aggregate_labels
                label_set: [container, namespace]
                aggregation_type: sum
          - include: container_cpu_cfs_throttled_periods_total
            action: insert
            new_name: container_cpu_cfs_throttled_periods_total_sum
            operations:
              - action: aggregate_labels
                label_set: [container, namespace]
                aggregation_type: sum
      metricstransform/ksm:
        transforms:
          - include: ^kube_pod_container_(status_running|info)$
            match_type: regexp
            action: update
            operations:
              - action: aggregate_labels
                label_set: [container, namespace, tier]
                aggregation_type: sum
          - include: kube_pod_container_resource_limits
            action: update
            operations:
              - action: aggregate_labels
                label_set: [container, namespace, tier, resource]
                aggregation_type: sum
    # {{ end }}
      resource/remove_telemetry_sdk_attributes:
        attributes:
          - key: telemetry.sdk.name
            action: delete
          - key: telemetry.sdk.version
            action: delete
          - key: telemetry.sdk.language
            action: delete
    extensions:
      health_check:
        endpoint: :13133
    exporters:
      debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200
    # {{ if .Values.metrics.cloudWatch.enabled }}
      awsemf/app:
        namespace: 'OpenSearchMigrations'
        dimension_rollup_option: NoDimensionRollup
        resource_to_telemetry_conversion:
          enabled: true
      awsemf/cadvisor:
        namespace: 'OpenSearchMigrations'
        dimension_rollup_option: NoDimensionRollup
        metric_declarations:
          # The [container, namespace] row is read by the capture-replay dashboard; the RFS dashboards use
          # the node-summed per-tier copies below instead.
          - dimensions: [[container, namespace], [container, namespace, pod]]
            metric_name_selectors:
              - container_memory_working_set_bytes
          # Per-pod configured limits let dashboards express RFS resource usage as percentages without hard-coding
          # one workflow's pod shape. CPU usage remains aggregated separately below.
          - dimensions: [[container, namespace, pod]]
            metric_name_selectors:
              - container_spec_cpu_quota
              - container_spec_cpu_period
              - container_spec_memory_limit_bytes
              - container_cpu_cfs_periods_total
              - container_cpu_cfs_throttled_periods_total
              - container_cpu_cfs_throttled_seconds_total
          # Already summed to one point per node and container by metricstransform/cadvisor, so no pod dimension.
          - dimensions: [[container, namespace]]
            metric_name_selectors:
              - container_cpu_usage_seconds_total
              - container_cpu_cfs_periods_total_sum
              - container_cpu_cfs_throttled_periods_total_sum
          # The RFS fleet by memory tier: cAdvisor CPU summed per node, and kube-state-metrics running containers
          # and limits (one exporter, so already fleet totals). At most one series per tier.
          - dimensions: [[container, namespace, tier]]
            label_matchers:
              - label_names: [container]
                regex: '^bulk-loader$'
            metric_name_selectors:
              - container_cpu_usage_seconds_by_tier
              - kube_pod_container_status_running
              - kube_pod_container_info
          - dimensions: [[container, namespace, tier, resource]]
            label_matchers:
              - label_names: [container]
                regex: '^bulk-loader$'
            metric_name_selectors:
              - kube_pod_container_resource_limits
          # Broker disk throughput, which on EKS is EBS throughput against each volume's provisioned limit.
          # Kept only for brokers, whose StatefulSet pod names are stable and bounded. Device is a dimension
          # because the exporter drops points that collide on the same dimensions in one batch.
          - dimensions: [[container, namespace, pod, device]]
            label_matchers:
              - label_names: [container]
                regex: '^kafka$'
            metric_name_selectors:
              - container_fs_writes_bytes_total
              - container_fs_reads_bytes_total
      awsemf/kafka-pvc:
        namespace: 'OpenSearchMigrations'
        dimension_rollup_option: NoDimensionRollup
        resource_to_telemetry_conversion:
          enabled: true
        metric_declarations:
          - dimensions: [[EKSClusterName, qualifier, namespace, persistentvolumeclaim]]
            metric_name_selectors:
              - ^kubelet_volume_stats_(available_bytes|capacity_bytes|inodes|inodes_free|health_status_abnormal)$
      awsemf/kafka-broker:
        namespace: 'OpenSearchMigrations'
        dimension_rollup_option: NoDimensionRollup
        resource_to_telemetry_conversion:
          enabled: true
        metric_declarations:
          - dimensions: [[EKSClusterName, qualifier, namespace, kafka_cluster, pod]]
            metric_name_selectors:
              - ^kafka_server_replicamanager_(under_replicated_partitions|isr_(expands|shrinks)_total)$
              - ^kafka_controller_(offline_partitions_count|active_controller_count)$
              - ^kafka_server_raft_current_(leader|epoch)$
              - ^kafka_server_request_handler_idle_ratio$
              - ^kafka_jvm_(heap_(used|max)_bytes|process_cpu_ratio|uptime_milliseconds)$
          - dimensions: [[EKSClusterName, qualifier, namespace, kafka_cluster, pod, request, error]]
            metric_name_selectors:
              - ^kafka_network_request_errors_total$
          - dimensions: [[EKSClusterName, qualifier, namespace, kafka_cluster, pod, request]]
            metric_name_selectors:
              - ^kafka_network_request_throttle_time_milliseconds$
          - dimensions: [[EKSClusterName, qualifier, namespace, kafka_cluster, pod, collector]]
            metric_name_selectors:
              - ^kafka_jvm_gc_(collections_total|collection_time_milliseconds_total)$
    # {{ end }}
      prometheus:
        endpoint: "0.0.0.0:8889"
        send_timestamps: true
        metric_expiration: 5m
        enable_open_metrics: true
    service:
      extensions: [health_check]
      pipelines:
    # {{ if .Values.metrics.cloudWatch.enabled }}
        metrics/app:
          receivers: [otlp]
          processors: [batch, resource/remove_default_attributes, resource/metrics, cumulativetodelta]
          exporters: [awsemf/app]
    # {{ end }}
        metrics/app-prometheus:
          receivers: [otlp]
          processors: [batch, resource/remove_telemetry_sdk_attributes, resource/metrics]
          exporters: [prometheus]
    # {{ if .Values.metrics.cloudWatch.enabled }}
        metrics/cadvisor:
          receivers: [prometheus]
          processors: [cumulativetodelta/cadvisor, metricstransform/cadvisor, batch]
          exporters: [awsemf/cadvisor]
        metrics/ksm-cloudwatch:
          receivers: [prometheus/ksm-cloudwatch]
          processors: [metricstransform/ksm, batch]
          exporters: [awsemf/cadvisor]
    # {{ end }}
        metrics/cadvisor-prometheus:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheus]
    # {{ if .Values.metrics.cloudWatch.enabled }}
        metrics/kafka-pvc-cloudwatch:
          receivers: [prometheus/kafka-pvc-cloudwatch]
          processors: [resource/remove_default_attributes, resource/kafka, batch]
          exporters: [awsemf/kafka-pvc]
        metrics/kafka-broker-cloudwatch:
          receivers: [prometheus/kafka-broker-cloudwatch]
          processors: [cumulativetodelta/kafka-broker, resource/remove_default_attributes, resource/kafka, batch]
          exporters: [awsemf/kafka-broker]
    # {{ end }}

logs:
  sharedLogsVolume:
    enabled: false

charts:
  kube-prometheus-stack:
    values:
      grafana:
        enabled: false

  argo-workflows:
    values:
      artifactRepository:
        s3:
          useSDKCreds: true

  fluent-bit:
    values:
      env:
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: aws-metadata
              key: AWS_REGION
        - name: STAGE_NAME
          valueFrom:
            configMapKeyRef:
              name: aws-metadata
              key: STAGE_NAME

      config:
        # Change output destination to be CloudWatch
        outputs: |
          [OUTPUT]
              Name                cloudwatch_logs
              Match               fluentbit-*
              region              ${AWS_REGION}
              log_group_name      /migration-assistant-${STAGE_NAME}-${AWS_REGION}/logs
              log_stream_prefix   from-
              auto_create_group   true

      # Remove logs PVC mount for EKS deployment
      extraVolumes:
        - name: lua-scripts
          configMap:
            name: fluentbit-lua-scripts

      extraVolumeMounts:
        - name: lua-scripts
          mountPath: /fluentbit/scripts
          readOnly: true

  strimzi-kafka-operator:
    # Use EKS-specific node selectors or tolerations if you have dedicated infra
#    nodeSelector:
#    workload-type: "operator-control-plane"

    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"

    # Handle higher latency that might happen at greater scale
    env:
      - name: STRIMZI_OPERATION_TIMEOUT_MS
        value: "600000"  # This is for orchestration events, like syncing reconciling nodes
      - name: STRIMZI_FULL_RECONCILIATION_INTERVAL_MS
        value: "120000" # 2 minutes (slows down background chatter)
      - name: KUBERNETES_CLIENT_READ_TIMEOUT_MS
        value: "30000"  # Avoid timing out on heavy K8s API responses
