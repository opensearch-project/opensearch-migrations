plugins {
    id 'base'
}

import org.gradle.api.tasks.*
import org.gradle.api.tasks.bundling.Compression
import org.gradle.api.tasks.bundling.Tar
import groovy.json.JsonSlurper

def helmChartVersionProvider = providers.environmentVariable('HELM_CHART_VERSION')
        .orElse(providers.gradleProperty('helmChartVersion'))
        .orElse(providers.environmentVariable('MIGRATION_ASSISTANT_VERSION'))
        .orElse(providers.gradleProperty('migrationAssistantVersion'))
        .orElse(providers.environmentVariable('IMAGE_VERSION'))
        .orElse(providers.gradleProperty('imageVersion'))
        .orElse(provider { project.version.toString() })

def chartSourceDir = layout.projectDirectory.dir('charts/aggregates/migrationAssistantWithArgo')
def stagedChartDirProvider = layout.buildDirectory.dir('helm-staging/migrationAssistantWithArgo')
def packagedChartDirProvider = layout.buildDirectory.dir('helm-package-staging/migration-assistant')
def helmPackageDirProvider = layout.buildDirectory.dir('helm-package')
def cfnTemplatesDir = rootProject.layout.projectDirectory.dir('deployment/migration-assistant-solution/cdk.out-minified')

tasks.register('stageMigrationAssistantHelmChart', Sync) {
    description = 'Stage the Migration Assistant Helm chart with release-only distribution assets'
    group = 'helm'
    dependsOn ':deployment:migration-assistant-solution:cdkSynthMinified'

    into stagedChartDirProvider

    from(chartSourceDir) {
        exclude 'infra/cfn/**'
    }
    from(cfnTemplatesDir) {
        include '*-eks.template.json'
        into 'infra/cfn'
    }
    doLast {
        def stagedDir = stagedChartDirProvider.get().asFile
        def cfnFiles = fileTree(new File(stagedDir, 'infra/cfn')) {
            include '*-eks.template.json'
        }.files
        if (cfnFiles.size() < 2) {
            throw new GradleException("expected EKS CFN templates in ${new File(stagedDir, 'infra/cfn')}, found ${cfnFiles.size()}")
        }
        def mirrorManifest = new File(stagedDir, 'infra/mirror/private-ecr-manifest.yaml')
        if (!mirrorManifest.isFile()) {
            throw new GradleException("missing ECR mirror manifest in staged chart: ${mirrorManifest}")
        }
    }
}

tasks.register('stageMigrationAssistantHelmPackage', Sync) {
    description = 'Stage the Migration Assistant Helm chart with release chart metadata'
    group = 'helm'
    dependsOn 'stageMigrationAssistantHelmChart'

    into packagedChartDirProvider

    from(stagedChartDirProvider) {
        exclude 'Chart.yaml'
    }
    from(stagedChartDirProvider.map { dir -> dir.file('Chart.yaml') }) {
        filter { line ->
            if (line ==~ /^version:.*/) {
                return "version: ${helmChartVersionProvider.get()}"
            }
            if (line ==~ /^appVersion:.*/) {
                return "appVersion: \"${helmChartVersionProvider.get()}\""
            }
            return line
        }
    }
}

tasks.register('packageMigrationAssistantHelmChart', Tar) {
    description = 'Package the Migration Assistant Helm chart release tarball'
    group = 'helm'
    dependsOn 'stageMigrationAssistantHelmPackage'
    compression = Compression.GZIP
    archiveFileName.set(helmChartVersionProvider.map { ver -> "migration-assistant-${ver}.tgz" })
    destinationDirectory.set(helmPackageDirProvider)

    from(packagedChartDirProvider) {
        into 'migration-assistant'
    }

    doLast {
        logger.lifecycle "wrote ${archiveFile.get().asFile}"
    }
}

assemble.dependsOn 'packageMigrationAssistantHelmChart'

tasks.register('testCaptureReplayGamedayScript', Exec) {
    description = 'Runs the capture/replay gameday helper parser self-test'
    group = 'verification'
    commandLine 'bash', layout.projectDirectory.file('scripts/capture-replay-gameday.sh').asFile, 'self-test'
}

tasks.register('verifyCaptureReplayObservability') {
    description = 'Validates Kubernetes observability assets and fleet metric cardinality safeguards'
    group = 'verification'

    doLast {
        def chartDir = layout.projectDirectory.dir('charts/aggregates/migrationAssistantWithArgo')
        def eksValues = chartDir.file('valuesEks.yaml').asFile.text
        def defaultValues = chartDir.file('values.yaml').asFile.text
        def dashboardTemplate = chartDir.file('templates/resources/grafanaDashboard.yaml').asFile.text
        def renderedTemplates = chartDir.dir('templates').asFileTree
                .matching { include '**/*.yaml', '**/*.yml', '**/*.tpl' }
                .files
                .collect { it.text }
                .join('\n')
        def cloudWatchDashboardDir = chartDir.dir('files/cloudwatch-dashboards')
        def cloudWatchDashboard =
                cloudWatchDashboardDir.file('capture-replay-dashboard.json').asFile
        def installedCloudWatchDashboards = cloudWatchDashboardDir.asFileTree
                .matching { include '**/*.json' }
                .files
        def standaloneCaptureReplayDashboard =
                layout.projectDirectory.file('dashboards/capture-replay-dashboard.json').asFile
        def cdkCaptureReplayDashboard =
                rootProject.layout.projectDirectory.file(
                        'deployment/cdk/opensearch-service-migration/lib/components/capture-replay-dashboard.json'
                ).asFile
        def generatedCdkCaptureReplayDashboard =
                rootProject.layout.projectDirectory.file(
                        'deployment/cdk/opensearch-service-migration/dist/lib/components/capture-replay-dashboard.json'
                ).asFile
        def observabilityOperations =
                rootProject.layout.projectDirectory.file(
                        'docs/captureAndReplay/observabilityOperations.md'
                ).asFile

        if (!(eksValues =~ /- key: service\.instance\.id\s+action: delete/).find()) {
            throw new GradleException('EKS metrics must remove service.instance.id before backend conversion')
        }
        def appPipeline = eksValues.substring(eksValues.indexOf('metrics/app:'))
        if (!appPipeline.contains(
                'processors: [batch, resource/remove_default_attributes, resource/metrics, cumulativetodelta]')) {
            throw new GradleException('EKS application metrics pipeline lost the fleet-cardinality processor')
        }
        if (!defaultValues.contains('tracing:\n  enabled: false')) {
            throw new GradleException('Kubernetes production defaults must keep trace export disabled')
        }
        if (!defaultValues.contains('alertmanager:\n        enabled: false')) {
            throw new GradleException('Kubernetes defaults must keep Alertmanager disabled')
        }
        if (!defaultValues.contains('defaultRules:\n        create: false')) {
            throw new GradleException('Kubernetes defaults must keep bundled Prometheus rules disabled')
        }
        if ((renderedTemplates =~ /(?m)^\s*kind:\s*PrometheusRule\s*$/).find()
                || (renderedTemplates =~ /(?m)^\s*kind:\s*AlertmanagerConfig\s*$/).find()
                || (renderedTemplates =~ /(?m)^\s*kind:\s*Alarm\s*$/).find()
                || (renderedTemplates =~ /(?m)^\s*alert:\s*\S+/).find()) {
            throw new GradleException('Migration Assistant must not install alerts or notifications')
        }
        def embeddedDashboardMatch =
                dashboardTemplate =~ /(?s)capture-replay-observability\.json:\s*\|\n(.*?)\n\{\{- end \}\}/
        if (!embeddedDashboardMatch.find()) {
            throw new GradleException('Grafana dashboard template does not contain embedded dashboard JSON')
        }
        def grafanaJson = embeddedDashboardMatch.group(1)
                .readLines()
                .collect { line ->
                    if (!line.startsWith('    ')) {
                        throw new GradleException(
                                "Embedded Grafana dashboard JSON has invalid indentation: ${line}"
                        )
                    }
                    line.substring(4)
                }
                .join('\n')
        def grafanaDashboard
        try {
            grafanaDashboard = new JsonSlurper().parseText(grafanaJson)
        } catch (Exception e) {
            throw new GradleException('Embedded Grafana dashboard JSON is malformed', e)
        }
        def grafanaPanels = grafanaDashboard.panels ?: []
        def grafanaPanelTitles = grafanaPanels.collect { it.title }.findAll()
        [
                'Traffic load and throughput',
                'Capture request load',
                'Capture proxy throughput',
                'Replayer target throughput',
                'Capture and replay throughput',
                'Replay fidelity',
                'Status-code matches',
                'Status-code mismatches',
                'Status-code match percentage',
                'Status-code comparison breakdown',
                'Replay progress (application metrics)',
                'Kafka commit activity',
                'Source-to-target replay lag',
                'Actual replay speedup',
                'Estimated catch-up time',
                'Historical catch-up estimate',
                'Runtime resources',
                'Replayer CPU utilization by pod',
                'Replayer working-set memory by pod',
                'Capture publishing and routing',
                'Replay intake and oldest work',
                'Kafka commit state (broker lag is CLI-derived)',
                'Target execution and tuple durability',
                'Process safety and clean shutdown'
        ].each { title ->
            if (!grafanaPanelTitles.contains(title)) {
                throw new GradleException("Grafana dashboard is missing panel or section: ${title}")
            }
        }
        def prometheusTargets = grafanaPanels
                .collectMany { panel -> panel.targets ?: [] }
                .findAll { target -> target.expr != null }
        if (prometheusTargets.isEmpty() || prometheusTargets.any { !it.expr?.trim() }) {
            throw new GradleException('Every Grafana Prometheus target must contain a nonblank expression')
        }
        def prometheusExpressions = prometheusTargets.collect { it.expr as String }
        def assertBalancedPromQl = { String expression ->
            def openingFor = [')': '(', ']': '[', '}': '{']
            def stack = []
            boolean inString = false
            boolean escaped = false
            for (int i = 0; i < expression.length(); i++) {
                char current = expression.charAt(i)
                def token = current as String
                if (inString) {
                    if (escaped) {
                        escaped = false
                    } else if (token == '\\') {
                        escaped = true
                    } else if (token == '"') {
                        inString = false
                    }
                    continue
                }
                if (token == '"') {
                    inString = true
                } else if (token == '(' || token == '[' || token == '{') {
                    stack.add(token)
                } else if (openingFor.containsKey(token)) {
                    if (stack.isEmpty()
                            || stack.remove(stack.size() - 1) != openingFor[token]) {
                        throw new GradleException(
                                "Grafana dashboard contains malformed PromQL delimiters: ${expression}"
                        )
                    }
                }
            }
            if (inString || !stack.isEmpty()) {
                throw new GradleException(
                        "Grafana dashboard contains malformed PromQL delimiters: ${expression}"
                )
            }
        }
        prometheusExpressions.each(assertBalancedPromQl)
        if (prometheusExpressions.any { it.contains('.*') }) {
            throw new GradleException(
                    'Grafana PromQL must not use broad metric-name wildcards that can mix instrument series'
            )
        }
        def allPrometheusExpressions = prometheusExpressions.join('\n')
        [
                'fullRequest_count_total',
                'bytesRead_bytes_total',
                'bytesWritten_bytes_total',
                'bytesWrittenToTarget_bytes_total',
                'bytesReadFromTarget_bytes_total',
                'tupleComparison_total',
                'kafkaCommitCount_total',
                'lagBetweenSourceAndTargetRequests_milliseconds_sum',
                'lagBetweenSourceAndTargetRequests_milliseconds_count',
                'targetAttemptsWithoutResponse_attempts_total',
                'targetRetriesExhausted_requests_total'
        ].each { productionSeries ->
            if (!allPrometheusExpressions.contains(productionSeries)) {
                throw new GradleException(
                        "Grafana dashboard is missing production Prometheus series: ${productionSeries}"
                )
            }
        }
        def panelByTitle = grafanaPanels.collectEntries { panel -> [(panel.title): panel] }
        def cpuExpression = panelByTitle['Replayer CPU utilization by pod']
                .targets.collect { it.expr }.join('\n')
        def memoryExpression = panelByTitle['Replayer working-set memory by pod']
                .targets.collect { it.expr }.join('\n')
        [cpuExpression, memoryExpression].each { expression ->
            [
                    'namespace="$namespace"',
                    'container="replayer"',
                    'container!="POD"',
                    'image!=""',
                    'sum by (pod)'
            ].each { requiredFragment ->
                if (!expression.contains(requiredFragment)) {
                    throw new GradleException(
                            "Replayer resource PromQL is missing ${requiredFragment}: ${expression}"
                    )
                }
            }
        }
        if (!cpuExpression.contains('container_cpu_usage_seconds_total')
                || !cpuExpression.contains('rate(')
                || !memoryExpression.contains('container_memory_working_set_bytes')) {
            throw new GradleException('Replayer resource panels must use deployed cAdvisor metrics')
        }
        def statusPanels = [
                panelByTitle['Status-code matches'],
                panelByTitle['Status-code mismatches'],
                panelByTitle['Status-code match percentage'],
                panelByTitle['Status-code comparison breakdown']
        ]
        def statusExpressions = statusPanels
                .collectMany { panel -> panel.targets ?: [] }
                .collect { target -> target.expr as String }
        if (statusExpressions.any { !it.contains('tupleComparison_total') }) {
            throw new GradleException('Every status-code panel must use tupleComparison_total')
        }
        def statusBreakdownExpression =
                panelByTitle['Status-code comparison breakdown'].targets.first().expr as String
        [
                'method',
                'sourceStatusCode',
                'targetStatusCode',
                'statusCodesMatch'
        ].each { boundedLabel ->
            if (!statusBreakdownExpression.contains(boundedLabel)) {
                throw new GradleException(
                        "Status-code breakdown is missing bounded label: ${boundedLabel}"
                )
            }
        }
        [
                'path',
                'url',
                'documentId',
                'requestId',
                'connectionId'
        ].each { unboundedLabel ->
            if (statusExpressions.any { it.contains(unboundedLabel) }) {
                throw new GradleException(
                        "Status-code panels must not use unbounded label: ${unboundedLabel}"
                )
            }
        }
        def lagExpression = panelByTitle['Source-to-target replay lag']
                .targets.first().expr as String
        if (!lagExpression.contains('rate(lagBetweenSourceAndTargetRequests_milliseconds_sum')
                || !lagExpression.contains('rate(lagBetweenSourceAndTargetRequests_milliseconds_count')
                || lagExpression.contains('_bucket')) {
            throw new GradleException(
                    'Source-to-target lag must use windowed histogram sum/count rates'
            )
        }
        [
                panelByTitle['Estimated catch-up time'],
                panelByTitle['Historical catch-up estimate']
        ].each { panel ->
            def expression = panel.targets.first().expr as String
            if (!expression.contains('deriv(')
                    || !expression.contains('< 0')
                    || expression.contains('clamp_min')
                    || expression.contains('vector(0)')) {
                throw new GradleException(
                        "${panel.title} must suppress invalid estimates instead of converting them to zero"
                )
            }
        }
        def operatorSurfaceText = [
                dashboardTemplate,
                installedCloudWatchDashboards.collect { it.text }.join('\n'),
                standaloneCaptureReplayDashboard.text,
                cdkCaptureReplayDashboard.text,
                observabilityOperations.text
        ].join('\n')
        [
                'targetExecutionAttemptsWithoutResponse',
                'targetExecutionRetriesExhausted',
                'kafka_consumergroup_group_lag',
                'kafka_consumergroup_lag',
                'kafka_consumer_group_lag'
        ].each { staleName ->
            if (operatorSurfaceText.contains(staleName)) {
                throw new GradleException("Operator surface references stale or unavailable metric: ${staleName}")
            }
        }
        [
                'targetAttemptsWithoutResponse',
                'targetRetriesExhausted',
                'tupleSinkUploadRetryAttempts',
                'tupleSinkUploadsRetrying',
                'tupleSinkUploadRecoveries',
                'replayOldestContextAgeByActivity',
                'comparingResults'
        ].each { productionName ->
            if (!operatorSurfaceText.contains(productionName)) {
                throw new GradleException("Operator surfaces are missing production metric: ${productionName}")
            }
        }
        if (installedCloudWatchDashboards.isEmpty()) {
            throw new GradleException('No installed CloudWatch dashboard JSON files were found')
        }
        (
                installedCloudWatchDashboards
                    + [
                        standaloneCaptureReplayDashboard,
                        cdkCaptureReplayDashboard,
                        generatedCdkCaptureReplayDashboard
                    ]
        ).unique().each { dashboardFile ->
            def dashboard = new JsonSlurper().parse(dashboardFile)
            if (dashboard.widgets.any {
                it.type == 'alarm'
                    || it.properties?.alarms
                    || it.properties?.annotations?.alarms
            }) {
                throw new GradleException(
                    "Installed CloudWatch dashboard must not reference alarms: ${dashboardFile.name}"
                )
            }
        }
        def parsedDashboard = new JsonSlurper().parse(cloudWatchDashboard)
        def cloudWatchTitles = parsedDashboard.widgets.collect { it.properties?.title }.findAll()
        [
                'Capture Publishing and Routing',
                'Replay Intake and Oldest Work',
                'Kafka Commit State',
                'Target Execution and Tuple Durability',
                'Process Safety and Clean Shutdown'
        ].each { title ->
            if (!cloudWatchTitles.contains(title)) {
                throw new GradleException("CloudWatch dashboard is missing section: ${title}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'testCaptureReplayGamedayScript', 'verifyCaptureReplayObservability'
}
