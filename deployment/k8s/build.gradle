plugins {
    id 'base'
}

import org.gradle.api.tasks.*
import org.gradle.api.tasks.bundling.Compression
import org.gradle.api.tasks.bundling.Tar

def helmChartVersionProvider = providers.environmentVariable('HELM_CHART_VERSION')
        .orElse(providers.gradleProperty('helmChartVersion'))
        .orElse(providers.environmentVariable('MIGRATION_ASSISTANT_VERSION'))
        .orElse(providers.gradleProperty('migrationAssistantVersion'))
        .orElse(providers.environmentVariable('IMAGE_VERSION'))
        .orElse(providers.gradleProperty('imageVersion'))
        .orElse(provider { project.version.toString() })

def chartSourceDir = layout.projectDirectory.dir('charts/aggregates/migrationAssistantWithArgo')
def stagedChartDirProvider = layout.buildDirectory.dir('helm-staging/migrationAssistantWithArgo')
def packagedChartDirProvider = layout.buildDirectory.dir('helm-package-staging/migration-assistant')
def helmPackageDirProvider = layout.buildDirectory.dir('helm-package')
def cfnTemplatesDir = rootProject.layout.projectDirectory.dir('deployment/migration-assistant-solution/cdk.out-minified')

tasks.register('stageMigrationAssistantHelmChart', Sync) {
    description = 'Stage the Migration Assistant Helm chart with release-only distribution assets'
    group = 'helm'
    dependsOn ':deployment:migration-assistant-solution:cdkSynthMinified'

    into stagedChartDirProvider

    from(chartSourceDir) {
        exclude 'infra/cfn/**'
    }
    from(cfnTemplatesDir) {
        include '*-eks.template.json'
        into 'infra/cfn'
    }
    doLast {
        def stagedDir = stagedChartDirProvider.get().asFile
        def cfnFiles = fileTree(new File(stagedDir, 'infra/cfn')) {
            include '*-eks.template.json'
        }.files
        if (cfnFiles.size() < 2) {
            throw new GradleException("expected EKS CFN templates in ${new File(stagedDir, 'infra/cfn')}, found ${cfnFiles.size()}")
        }
        def mirrorManifest = new File(stagedDir, 'infra/mirror/private-ecr-manifest.yaml')
        if (!mirrorManifest.isFile()) {
            throw new GradleException("missing ECR mirror manifest in staged chart: ${mirrorManifest}")
        }
    }
}

tasks.register('stageMigrationAssistantHelmPackage', Sync) {
    description = 'Stage the Migration Assistant Helm chart with release chart metadata'
    group = 'helm'
    dependsOn 'stageMigrationAssistantHelmChart'

    into packagedChartDirProvider

    from(stagedChartDirProvider) {
        exclude 'Chart.yaml'
    }
    from(stagedChartDirProvider.map { dir -> dir.file('Chart.yaml') }) {
        filter { line ->
            if (line ==~ /^version:.*/) {
                return "version: ${helmChartVersionProvider.get()}"
            }
            if (line ==~ /^appVersion:.*/) {
                return "appVersion: \"${helmChartVersionProvider.get()}\""
            }
            return line
        }
    }
}

tasks.register('packageMigrationAssistantHelmChart', Tar) {
    description = 'Package the Migration Assistant Helm chart release tarball'
    group = 'helm'
    dependsOn 'stageMigrationAssistantHelmPackage'
    compression = Compression.GZIP
    archiveFileName.set(helmChartVersionProvider.map { ver -> "migration-assistant-${ver}.tgz" })
    destinationDirectory.set(helmPackageDirProvider)

    from(packagedChartDirProvider) {
        into 'migration-assistant'
    }

    doLast {
        logger.lifecycle "wrote ${archiveFile.get().asFile}"
    }
}

assemble.dependsOn 'packageMigrationAssistantHelmChart'

tasks.register('testCaptureReplayGamedayScript', Exec) {
    description = 'Runs the capture/replay gameday helper parser self-test'
    group = 'verification'
    commandLine 'bash', layout.projectDirectory.file('scripts/capture-replay-gameday.sh').asFile, 'self-test'
}

// The verification tasks below render the chart with `helm template`. Rather than requiring a local install, resolve
// a pinned Helm release through Gradle, as the node plugin does for Node, so it is downloaded once into the Gradle
// cache and works offline afterward. The version matches migrationConsole/Dockerfile, whose Jobs run the chart.
def helmClientVersion = '3.14.0'
def helmOs = System.getProperty('os.name').toLowerCase(Locale.ROOT).with {
    it.contains('mac') ? 'darwin' : it.contains('windows') ? 'windows' : 'linux'
}
def helmArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT).with {
    it in ['aarch64', 'arm64'] ? 'arm64' : it in ['amd64', 'x86_64'] ? 'amd64' : it
}
def helmArchiveExtension = helmOs == 'windows' ? 'zip' : 'tar.gz'
def helmExecutableName = helmOs == 'windows' ? 'helm.exe' : 'helm'

repositories {
    ivy {
        name = 'helmReleases'
        // Overridable for environments that mirror get.helm.sh.
        url = providers.environmentVariable('HELM_DISTRIBUTION_URL')
                .orElse(providers.gradleProperty('helmDistributionUrl'))
                .orElse('https://get.helm.sh')
                .get()
        patternLayout { artifact 'helm-v[revision]-[classifier].[ext]' }
        metadataSources { artifact() }
        content { includeModule('sh.helm', 'helm') }
    }
}

configurations {
    helmClient {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    helmClient "sh.helm:helm:${helmClientVersion}:${helmOs}-${helmArch}@${helmArchiveExtension}"
}

def helmClientDir = layout.buildDirectory.dir('helm-client')
def helmExecutable = helmClientDir.map { it.file(helmExecutableName) }

tasks.register('installHelmClient', Sync) {
    description = "Unpacks the pinned Helm ${helmClientVersion} client used by the chart verification tasks"
    group = 'helm'
    def archives = configurations.helmClient
    from({
        def archive = archives.singleFile
        helmArchiveExtension == 'zip' ? zipTree(archive) : tarTree(archive)
    }) {
        include "**/${helmExecutableName}"
        eachFile { it.relativePath = new RelativePath(true, it.name) }
        filePermissions { unix('rwxr-xr-x') }
    }
    includeEmptyDirs = false
    into helmClientDir
}

tasks.register('verifyCaptureReplayObservability', Exec) {
    description = 'Smoke-tests Grafana and ACK dashboard wiring through the Helm chart'
    group = 'verification'
    commandLine(
            'python3',
            layout.projectDirectory.file(
                    'scripts/verify-capture-replay-observability.py'
            ).asFile,
            chartSourceDir.asFile,
            '--helm',
            helmExecutable.get().asFile
    )
    dependsOn 'installHelmClient'
}

tasks.register('verifyHelmUninstallTeardown', Exec) {
    description = 'Validates rendered Migration Assistant pre-delete teardown'
    group = 'verification'
    commandLine(
            'python3',
            layout.projectDirectory.file('scripts/verify-helm-uninstall-teardown.py').asFile,
            chartSourceDir.asFile,
            '--helm',
            helmExecutable.get().asFile
    )
    dependsOn 'installHelmClient'
}

tasks.named('check') {
    dependsOn 'testCaptureReplayGamedayScript', 'verifyCaptureReplayObservability',
            'verifyHelmUninstallTeardown'
}
