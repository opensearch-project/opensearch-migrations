# CDC (capture-and-replay) migration config — the default input to deployCdcWorkflow.sh.
#
# An ordinary migration config: the same thing you would write by hand and feed to
# `workflow configure edit`. Endpoints, versions, ports and names are all literal here — edit them,
# or pass your own file with -f. The script reads the resource names back out of whatever config it
# is given, so any CDC topology works without changing the script.
#
# Only three placeholders are substituted, and only these are ever touched:
#
#   SOURCE_AUTH_BLOCK / TARGET_AUTH_BLOCK
#       An `authConfig:` stanza, or nothing at all. The script probes each cluster and fills these
#       in, because whether the test clusters want credentials depends on which values file they
#       were deployed with. "No auth" has to mean the authConfig key is ABSENT — it is an optional
#       union in the schema, so an empty `authConfig: {}` fails validation.
#   PROXY_SERVICE_TYPE
#       ClusterIP or LoadBalancer — a property of the cluster you are on, not of the migration.
#
# A config with no placeholders passes through untouched, which is what -f relies on.
#
# NOTE: because those two auth stanzas occupy whole lines, this file does not parse as YAML until
# rendered. The script validates the RENDERED result before submitting it. Placeholders are named
# WITHOUT the ${...} syntax in this header on purpose — comments are substituted too, so spelling
# one out here would expand it into the comment and corrupt the output.

# Capture-and-replay only: no snapshot, no metadata migration, no backfill.
skipApprovals: true
snapshotMigrationConfigs: []

# Endpoints match the testClusters chart (deployment/k8s/charts/aggregates/testClusters).
sourceClusters:
  source1:
    endpoint: "https://elasticsearch-master-headless:9200"
    version: "ES 7.10.2"
    allowInsecure: true
${SOURCE_AUTH_BLOCK}

targetClusters:
  target1:
    endpoint: "https://opensearch-cluster-master-headless:9200"
    allowInsecure: true
${TARGET_AUTH_BLOCK}

# An auto-created Strimzi cluster. Swap in an `existing:` block to point at a Kafka you already run.
kafkaClusterConfiguration:
  default:
    autoCreate: {}

traffic:
  proxies:
    capture-proxy:
      source: source1
      proxyConfig:
        listenPort: 9201
        noCapture: false
        podReplicas: 1
        # kind has no load-balancer controller, and the workflow's readiness gate waits for a
        # LoadBalancer to report ingress — so LoadBalancer would hang there until it times out.
        serviceType: ${PROXY_SERVICE_TYPE}

  replayers:
    replay1:
      fromCapturedTraffic: capture-proxy
      toTarget: target1
      replayerConfig:
        speedupFactor: 2
        observedPacketConnectionTimeout: 30
